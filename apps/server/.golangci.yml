# Curated golangci-lint configuration for apps/server (Go 1.26, a net/http +
# pgx/v5 API service). linters.default is "none" so every enabled check is
# listed explicitly below — nothing is inherited silently from
# golangci-lint's "standard" preset. Style baseline: Google Go style guide
# (google.github.io/styleguide/go), per CLAUDE.md and
# docs/specs/aboutme-design.md §0.
version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  default: none
  enable:
    # Correctness: unchecked errors, go-vet diagnostics, static analysis,
    # dead assignments/code. This is the foundation every Go service needs.
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Error-handling idioms: Go 1.13+ wrapping/Is/As, and never swallowing a
    # checked error back into a nil return.
    - errorlint
    - nilerr

    # HTTP/Postgres resource hygiene. internal/store holds a pgx/v5 pool and
    # the server issues internal HTTP calls (OAuth token exchange, the
    # internal /print call to Nuxt — docs/specs/aboutme-design.md §2), so
    # leaked response bodies, rows, and non-inherited contexts are real
    # production risks here, not theoretical.
    - bodyclose
    - contextcheck
    - noctx
    - rowserrcheck
    - sqlclosecheck

    # Security: SQL string-building, missing HTTP server timeouts,
    # credentials, weak crypto, etc.
    - gosec

    # Style, tuned toward Google Go style below (settings.revive).
    - revive
    - godot
    - misspell
    - unconvert
    - wastedassign

  settings:
    errcheck:
      # Google style: every error is handled. Blank-identifier discards and
      # bare (non ",ok") type assertions must be explicit, not silent.
      check-blank: true
      check-type-assertions: true

    govet:
      enable:
        # Catches `err`/`ctx` re-declared (":=") in a nested scope instead
        # of reused — a frequent source of "checked the wrong error" bugs.
        - shadow

    # staticcheck.checks is intentionally left at the golangci-lint default
    # ("all" minus ST1000/ST1003/ST1016/ST1020-ST1022): those are package
    # comment, naming, receiver-name, and exported-doc-comment conventions,
    # which the revive rules below already enforce with Google-style
    # messaging. Re-enabling them here would just double-report the same
    # line under two linters.

    gosec:
      excludes:
        # Unchecked-error audit — superseded by errcheck, which is enabled
        # above and is the more precise, per-call-site check.
        - G104
      severity: medium
      confidence: medium

    revive:
      severity: warning
      enable-default-rules: false
      rules:
        # Exported identifiers need a doc comment starting with their own
        # name: google.github.io/styleguide/go/decisions#comments.
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
        # Error values/strings: lower-case, no trailing punctuation,
        # `Err`-prefixed sentinels, error returned last and named `err`:
        # google.github.io/styleguide/go/decisions#errors.
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: indent-error-flow
        - name: superfluous-else
        # Naming: MixedCaps, initialisms, short/consistent receiver names:
        # google.github.io/styleguide/go/decisions#naming.
        - name: var-naming
        - name: receiver-naming
        - name: increment-decrement
        # context.Context conventions:
        # google.github.io/styleguide/go/decisions#contexts.
        - name: context-as-argument
        - name: context-keys-type
        - name: unexported-return
        - name: blank-imports
        - name: dot-imports
        - name: time-naming
        - name: range

    godot:
      # Exported/top-level doc comments are complete sentences ending in a
      # period; inline and mid-block comments are left alone.
      scope: declarations
      period: true

    misspell:
      locale: US

    rowserrcheck:
      packages:
        - github.com/jackc/pgx/v5

  exclusions:
    presets:
      - common-false-positives
    rules:
      # Table-driven tests routinely exercise malformed/adversarial input as
      # plain literals; gosec's crypto/permissions/subprocess heuristics are
      # noise there, not signal. Everything else still applies to tests.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dannyota/aboutme/apps/server

# Linters from the task's candidate list that are deliberately NOT enabled:
#   (none — errcheck, govet, staticcheck, ineffassign, unused, revive, gosec,
#   bodyclose, rowserrcheck, sqlclosecheck, contextcheck, errorlint, noctx,
#   misspell, unconvert, wastedassign, nilerr, and godot are all enabled
#   above.) No linters outside that list were added, to keep the set
#   curated rather than exhaustive-by-default.
