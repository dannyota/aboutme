# sqlc generates type-safe Go from the goose migrations plus
# sql/queries.sql into internal/store (package store — the same package as
# the hand-written pgx pool in store.go). pgx/v5 driver, native Go types
# with pointers for nullable columns, json.RawMessage for jsonb, time.Time
# (pointer when nullable) for timestamptz. Run `make generate` after
# editing migrations/ or sql/queries.sql.
#
# `schema:` points at the migrations directory, not a separate declarative
# schema file: apps/server/migrations/ is the single source of truth for
# both what is applied to a database (goose) and what sqlc generates from.
# sqlc replays the migrations' "-- +goose Up" sections itself to derive the
# schema, so there is no second file that can drift from them.
#
# Simplified from an earlier multi-schema pattern that used five
# medallion-layer schemas, each with its own sqlc config block and output
# package. aboutme has ONE schema, so this file has a single entry.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "sql/queries.sql"
    gen:
      go:
        package: "store"
        sql_package: "pgx/v5"
        out: "internal/store"
        emit_interface: true
        rename:
          ua: "UA"
          ip: "IP"
          oauth_transaction: "OAuthTransaction"
          oauth_client: "OAuthClient"
          oauth_authorization_code: "OAuthAuthorizationCode"
          oauth_grant: "OAuthGrant"
          oauth_token: "OAuthToken"
          csrf_secret: "CSRFSecret"
          pkce_verifier: "PKCEVerifier"
          redirect_uri: "RedirectURI"
          redirect_uris: "RedirectURIs"
          seo_geo_enabled: "SEOGeoEnabled"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          # 00002_add_auth_tables.sql declares users.email as
          # `public.citext` (schema-qualified). sqlc maps a BARE `citext` to
          # string by default, but does NOT recognize the qualified form and
          # silently degrades it to interface{} — which still compiles here
          # and then breaks every call site that treats the column as a
          # string. These two overrides restore the intended mapping; do not
          # drop them without first checking whether the qualified spelling
          # is still present in migrations/.
          - db_type: "public.citext"
            go_type:
              type: "string"
          - db_type: "public.citext"
            nullable: true
            go_type:
              type: "string"
              pointer: true
