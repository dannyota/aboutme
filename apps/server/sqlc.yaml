# sqlc generates type-safe Go from sql/{schema,queries}.sql into
# internal/store (package store — the same package as the hand-written pgx
# pool in store.go). pgx/v5 driver, native Go types with pointers for
# nullable columns, json.RawMessage for jsonb, time.Time (pointer when
# nullable) for timestamptz. Run `make generate` after editing sql/*.sql.
#
# Simplified from an earlier multi-schema pattern that used five
# medallion-layer schemas, each with its own sqlc config block and output
# package. aboutme has ONE schema, so this file has a single entry.
version: "2"
sql:
  - engine: "postgresql"
    schema: "sql/schema.sql"
    queries: "sql/queries.sql"
    gen:
      go:
        package: "store"
        sql_package: "pgx/v5"
        out: "internal/store"
        emit_interface: true
        rename:
          ua: "UA"
          ip: "IP"
          oauth_transaction: "OAuthTransaction"
          csrf_secret: "CSRFSecret"
          pkce_verifier: "PKCEVerifier"
          redirect_uri: "RedirectURI"
          seo_geo_enabled: "SEOGeoEnabled"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
