version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "sql/"
    gen:
      go:
        package: "store"
        sql_package: "pgx/v5"
        out: "internal/store"
        emit_interface: true
        rename:
          ua: "UA"
          ip: "IP"
          oauth_transaction: "OAuthTransaction"
          oauth_client: "OAuthClient"
          oauth_authorization_code: "OAuthAuthorizationCode"
          oauth_grant: "OAuthGrant"
          oauth_token: "OAuthToken"
          csrf_secret: "CSRFSecret"
          pkce_verifier: "PKCEVerifier"
          redirect_uri: "RedirectURI"
          redirect_uris: "RedirectURIs"
          seo_geo_enabled: "SEOGeoEnabled"
          png: "PNG"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          # sqlc maps a bare citext to string but degrades schema-qualified public.citext to interface{}, so these overrides stay (sqlc type overrides).
          - db_type: "public.citext"
            go_type:
              type: "string"
          - db_type: "public.citext"
            nullable: true
            go_type:
              type: "string"
              pointer: true
