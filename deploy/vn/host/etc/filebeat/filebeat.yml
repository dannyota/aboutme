# Filebeat 8.7.1 ships journald output to vMonitor
# (docs/design/vietnam-production.md, "Logs, metrics, and alarms"). Shape from
# https://docs.greennode.ai/vmonitor/dashboards/logs/lam-viec-voi-log-agent/cai-dat-log-agent-tren-cac-he-dieu-hanh/debian-ubuntu
#
# The two values below come from the Filebeat keystore
# (`filebeat keystore add VMONITOR_BOOTSTRAP_SERVERS`) or the environment;
# the operator sets them from the vMonitor console. Journald holds no request
# bodies, and Caddy's access log with client addresses never reaches it.
filebeat.inputs:
  - type: journald
    id: journald-all

processors:
  - add_host_metadata: ~

output.kafka:
  hosts: ["${VMONITOR_BOOTSTRAP_SERVERS}"]
  topic: "${VMONITOR_TOPIC}"
  ssl.certificate_authorities: ["/etc/aboutme/secrets/vmonitor/VNG.trust.pem"]
  ssl.certificate: "/etc/aboutme/secrets/vmonitor/user.cer.pem"
  ssl.key: "/etc/aboutme/secrets/vmonitor/user.key.pem"
  # GreenNode's sample sets verification_mode to none, which this repository
  # does not copy. Unconfirmed: whether full verification works against their
  # broker certificate.
  ssl.verification_mode: full

# Filebeat's own logs go to stderr, which systemd sends to journald.
logging.to_files: false
logging.to_stderr: true
