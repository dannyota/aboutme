# Caddy's metadata-only WAF match log stays on tmpfs and never reaches disk or
# the journal (docs/design/vietnam-production.md, "Edge"). uid 10001 is the
# Caddy image's user.
d /run/aboutme 0755 root root -
d /var/lib/aboutme/deployment 0755 root root -
f /run/aboutme/workload.lock 0660 root postgres -
d /run/aboutme/caddy-log 0750 10001 10001 -
d /run/aboutme/caddy-log/waf 0750 10001 10001 -
d /run/aboutme/caddy-log/crowdsec 0700 10001 10001 -
f /run/aboutme/caddy-log/crowdsec/serving.json 0600 10001 10001 -
f /run/aboutme/caddy-log/crowdsec/maintenance.json 0600 10001 10001 -
f /run/aboutme/caddy-log/crowdsec/serving-bouncer.json 0600 10001 10001 -
f /run/aboutme/caddy-log/crowdsec/maintenance-bouncer.json 0600 10001 10001 -
