# Caddy's metadata-only WAF match log stays on tmpfs and never reaches disk or
# the journal (docs/design/vietnam-production.md, "Edge"). uid 10001 is the
# Caddy image's user.
d /run/aboutme 0755 root root -
d /run/aboutme/caddy-log 0750 10001 10001 -
d /run/aboutme/caddy-log/waf 0750 10001 10001 -
