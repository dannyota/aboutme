# pgBackRest (docs/design/vietnam-production.md, "PostgreSQL"). Secrets are in
# /etc/pgbackrest/conf.d/secrets.conf, a file on the data volume (see
# secrets.conf.example), read through the default config-include-path.
#
# Unconfirmed: that vStorage works as a pgBackRest S3 repository with
# path-style addressing (design "Provider facts to confirm").
[global]
repo1-type=s3
repo1-s3-bucket=aboutme-backups
repo1-s3-endpoint=hcm04.vstorage.vngcloud.vn
repo1-s3-region=HCM04
repo1-s3-uri-style=path
repo1-path=/aboutme-prod
repo1-cipher-type=aes-256-cbc
# Retention is 30 days by time; archive retention follows the retained fulls,
# so WAL is kept for every full backup that is kept.
repo1-retention-full-type=time
repo1-retention-full=30
repo1-retention-archive-type=full
start-fast=y
compress-type=zst
process-max=2
log-level-console=info
log-level-file=off

[aboutme]
pg1-path=/var/lib/postgresql/18/main
pg1-socket-path=/run/postgresql
