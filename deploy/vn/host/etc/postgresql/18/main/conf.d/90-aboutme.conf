# PostgreSQL 18 settings (docs/design/vietnam-production.md, "PostgreSQL").
# The data directory stays at the package default,
# /var/lib/postgresql/18/main, on the data volume.

# No TCP listener: the only listener is the Unix socket, so no connection
# needs TLS.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'
password_encryption = scram-sha-256

# Memory budget: 1 GiB of the 4 GiB host (design "Host"). 256 MB of shared
# buffers plus 40 connections at 8 MB of work_mem each stays inside it.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
max_connections = 40

# Continuous WAL archiving to the backup bucket; about one minute of commits
# is at risk.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=aboutme archive-push %p'
archive_timeout = 60s
max_wal_senders = 3

# Logs go to the journal on the host: no statements, no connection lines.
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = -1
log_connections = off
log_statement = 'none'
