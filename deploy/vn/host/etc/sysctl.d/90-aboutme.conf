# Host kernel settings (docs/design/vietnam-production.md, "Host").

# Caddy binds ports 80 and 443 as uid 10001 on the host network with no
# capability, so unprivileged processes may bind from port 80 up.
net.ipv4.ip_unprivileged_port_start = 80

# Chromium's sandbox in the server container needs unprivileged user
# namespaces. Ubuntu 24.04 restricts them through AppArmor by default. The
# readiness probe checks that these two settings hold.
user.max_user_namespaces = 16384
kernel.apparmor_restrict_unprivileged_userns = 0

# Go binds its print listener to the aboutme bridge gateway, 172.17.0.1:8081.
# Netavark creates that bridge address only while a container is attached, so
# the server may bind it before the address exists or while Nuxt restarts.
net.ipv4.ip_nonlocal_bind = 1

# Memory is compressed in zram instead of swapped to disk.
vm.swappiness = 100

# Hardening.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1
