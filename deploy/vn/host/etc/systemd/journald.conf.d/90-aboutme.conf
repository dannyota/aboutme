# The journal is the production log store: it lives on the data volume
# (/var/log/journal is bound from /srv/data/journal by data-volume.sh), keeps
# 30 days, and is capped at 2 GB (docs/design/vietnam-production.md, "Logs,
# metrics, and alarms"). Nothing ships logs off the host.
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=2G
MaxRetentionSec=30day
