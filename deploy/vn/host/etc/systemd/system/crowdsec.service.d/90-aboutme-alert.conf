# Mails the support mailbox when this packaged unit fails
# (docs/design/vietnam-production.md, "Logs, metrics, and alarms").
[Unit]
OnFailure=aboutme-alert@%N.service
Requires=aboutme-crowdsec-retention-startup.service
After=aboutme-crowdsec-retention-startup.service postgresql@18-main.service
BindsTo=postgresql@18-main.service

[Service]
ExecStartPre=
ExecStartPre=/usr/local/lib/aboutme/crowdsec-retention-lease-check.sh
ExecStartPre=/usr/bin/crowdsec -c /etc/crowdsec/config.yaml -t -error
ExecStartPre=/usr/local/lib/aboutme/crowdsec-retention-lease-check.sh
ExecReload=
ExecReload=/usr/local/lib/aboutme/crowdsec-retention-lease-check.sh
ExecReload=/usr/bin/crowdsec -c /etc/crowdsec/config.yaml -t -error
ExecReload=/usr/local/lib/aboutme/crowdsec-retention-lease-check.sh
ExecReload=/bin/kill -HUP $MAINPID
LimitCORE=0
MemoryMax=256M
StandardOutput=null
StandardError=null
