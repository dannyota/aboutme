type: leaky
format: 2.0
name: aboutme/http-status
description: Detect repeated HTTP denial and unknown-route probes
# Only scanner signals count. Many customers can share one address (mobile
# carrier NAT, public Wi-Fi), so a mistyped password (401), the app's own
# throttle (429), and the bouncer's answer to a banned address (403) are left
# out: counting them would ban everyone behind that address.
filter: evt.Meta.log_type == 'aboutme-http' && (evt.Meta.http_status in ['400', '404', '405'] || evt.Meta.route_class == 'unknown')
groupby: evt.Meta.source_ip + '|' + evt.Meta.route_class
capacity: 20
leakspeed: 10s
blackhole: 5m
# Keep only the last events in memory and in the alert, not the whole bucket.
cache_size: 5
labels:
  remediation: true
  classification:
    - attack.T1595
  behavior: http:scan
  label: HTTP denial and probing responses
  spoofable: 0
  service: http
  confidence: 2
