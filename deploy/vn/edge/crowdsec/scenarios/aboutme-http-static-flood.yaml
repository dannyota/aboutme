# Static assets and health checks, which aboutme/http-rate leaves out because
# every page load bursts them. Only a flood far beyond what many customers
# behind one address send can fill this bucket.
type: leaky
format: 2.0
name: aboutme/http-static-flood
description: Detect floods of static asset and health-check requests
filter: evt.Meta.log_type == 'aboutme-http' && evt.Meta.route_class in ['static', 'system']
groupby: evt.Meta.source_ip
capacity: 3000
leakspeed: 20ms
blackhole: 5m
# Keep only the last events in memory and in the alert, not the whole bucket.
cache_size: 5
labels:
  remediation: true
  classification:
    - attack.T1498
  behavior: http:flood
  label: HTTP static request flood
  spoofable: 0
  service: http
  confidence: 2
