type: leaky
format: 2.0
name: aboutme/http-rate
description: Detect sustained HTTP request floods
# Static assets and health checks are cheap and arrive in bursts with every
# page load; counting them would flag an address many customers share.
filter: evt.Meta.log_type == 'aboutme-http' && evt.Meta.route_class not in ['static', 'system']
groupby: evt.Meta.source_ip
capacity: 300
leakspeed: 250ms
blackhole: 5m
# Keep only the last events in memory and in the alert, not the whole bucket.
cache_size: 5
labels:
  remediation: true
  classification:
    - attack.T1498
  behavior: http:flood
  label: HTTP request flood
  spoofable: 0
  service: http
  confidence: 2
