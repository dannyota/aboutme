# Coraza settings for the direct listener, loaded after Coraza's recommended
# configuration so each line here wins (docs/design/vietnam-production.md,
# "Edge"). edges/direct.sites loads this file.

# Detection only: a rule match is logged and the request still passes. To
# block, change this one line to "SecRuleEngine On".
SecRuleEngine DetectionOnly

# Request bodies are inspected, up to 5 MiB, which is above the largest body
# Go accepts (the MCP endpoint's 4 MiB). The whole body stays in memory, so
# no request body is ever written to a temporary file on disk.
SecRequestBodyLimit 5242880
SecRequestBodyInMemoryLimit 5242880

# Response bodies are not inspected: buffering them would delay pages and
# server-sent events, and they carry personal data.
SecResponseBodyAccess Off

# The audit log records a transaction only when the rule set would have
# answered 403, which in detection-only mode means the anomaly score passed
# the blocking threshold. Its parts are the header (A: time, transaction id,
# client address, URI), the trailer (H), the matched rules with their
# messages (K), and the end marker (Z). No request or response headers or
# bodies (B, C, E, F, I, J) are written, so cookies, tokens, and resume text
# never reach it; a rule message can still quote the argument it matched.
# The file is local to the host, like Coraza's own rule-match log in
# edges/direct.global.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^403$"
SecAuditLogParts AHKZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/caddy-waf/audit.log
