# Rule exclusions for the OWASP Core Rule Set, loaded after its setup file
# and before its rules (docs/design/vietnam-production.md, "Edge"). Rules
# here change which rules run for a request at runtime, so they must run
# before the rule set's own rules. IDs 10000 to 10999 are ours.
#
# Resume writes carry rich text that can trip the rule set. Every route that
# writes resume content (apps/server/internal/resumeapi, docs/api/openapi.yaml):
#
#   POST   /api/v1/resumes                                   createResume
#   PATCH  /api/v1/resumes/{id}                              updateResumeMetadata
#   DELETE /api/v1/resumes/{id}                              deleteResume
#   POST   /api/v1/resumes/{id}/publish                      publishResume
#   PATCH  /api/v1/resumes/{id}/personal-details             updateResumePersonalDetails
#   PATCH  /api/v1/resumes/{id}/customization                updateResumeCustomization
#   PATCH  /api/v1/resumes/{id}/structure                    updateResumeStructure
#   PATCH  /api/v1/resumes/{id}/sections/{sectionKey}        updateResumeSection
#   PATCH  /api/v1/resumes/{id}/entries/{sectionKey}         upsertResumeEntry
#   DELETE /api/v1/resumes/{id}/entries/{sectionKey}/{entryId} deleteResumeEntry
#   POST   /api/v1/resumes/{id}/photo                        uploadResumePhoto
#   PATCH  /api/v1/resumes/{id}/photo                        updateResumePhotoCrop
#   DELETE /api/v1/resumes/{id}/photo                        deleteResumePhoto
#   POST   /mcp                                              MCP tools that edit resumes
#
# Rule 10000 marks these requests with tx.aboutme_resume_write=1. It
# excludes nothing yet: detection-only mode logs which rules the real
# traffic trips. Before switching to blocking, add one rule per tripped rule
# set part, scoped to the marked requests and to the body arguments only,
# for example:
#
#   SecRule TX:aboutme_resume_write "@eq 1" \
#       "id:10010,phase:2,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=attack-xss;ARGS_POST"
SecRule REQUEST_METHOD "@rx ^(?:POST|PATCH|DELETE)$" \
    "id:10000,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:mcp|api/v1/resumes(?:/[^/]+(?:/(?:publish|personal-details|customization|structure|photo|sections/[^/]+|entries/[^/]+(?:/[^/]+)?))?)?)$" \
        "t:none,setvar:tx.aboutme_resume_write=1"
