version: "2"

run:
  timeout: 5m
  go: "1.27.4"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    - errorlint
    - nilerr

    - bodyclose
    - contextcheck
    - noctx
    - rowserrcheck
    - sqlclosecheck

    - gosec
    - forbidigo

    - revive
    - godot
    - misspell
    - unconvert
    - wastedassign

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true

    govet:
      enable:
        - shadow

    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: '^template\.HTML$'
          pkg: '^html/template$'
          msg: Trusted HTML conversions require sanitizer review.

    gosec:
      excludes:
        - G104
      severity: medium
      confidence: medium

    revive:
      severity: warning
      enable-default-rules: false
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
            - disableChecksOnConstants
            - disableChecksOnFunctions
            - disableChecksOnMethods
            - disableChecksOnTypes
            - disableChecksOnVariables
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: var-naming
        - name: receiver-naming
        - name: increment-decrement
        - name: context-as-argument
        - name: context-keys-type
        - name: unexported-return
        - name: blank-imports
        - name: dot-imports
        - name: time-naming
        - name: range

    godot:
      scope: declarations
      period: true

    misspell:
      locale: US

  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - danny.vn/aboutme/deploy/observer

