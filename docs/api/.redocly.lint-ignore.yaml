# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
openapi.yaml:
  operation-2xx-response:
    - "#/paths/~1auth~1google~1start/get/responses"
    - "#/paths/~1auth~1google~1callback/get/responses"
    - "#/paths/~1auth~1github~1start/get/responses"
    - "#/paths/~1auth~1github~1callback/get/responses"
    - "#/paths/~1auth~1linkedin~1start/get/responses"
    - "#/paths/~1auth~1linkedin~1callback/get/responses"
    - "#/paths/~1github-evidence~1callback/get/responses"
  # PersonalDetailsPatch guards the server-owned `photo` field out of a
  # client-owned whole-object patch with `not: {required: [photo]}`. That is
  # exactly a required-property name with no sibling definition, which is what
  # this rule flags -- restating the personal-details shape here to satisfy it
  # would create the second source of truth D16 exists to prevent.
  no-required-schema-properties-undefined:
    - "#/components/schemas/PersonalDetailsPatch/not/required/0"
