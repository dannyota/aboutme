# Lint config scoped to docs/api/openapi.yaml — invoke from the repository root as:
#   pnpm exec redocly lint docs/api/openapi.yaml --config docs/api/redocly.yaml
#
# Never fetch the bare "redocly" package with npx or pnpm dlx: that unrelated
# npm placeholder prints a joke and exits 0, masking a lint failure.
extends:
  - recommended
rules:
  # /healthz and /readyz are unparameterized liveness/readiness probes with
  # no request body or query/path params, so there is no client-triggerable
  # 4xx to document for them (see design doc §2 route table).
  operation-4xx-response: off
  # Envelope, Error, Revision, IfMatch, and IdempotencyKey are the shared
  # envelope/write-safety contract (design doc §4). They are deliberately
  # declared ahead of use: this file only ever grows new paths that reference
  # them and is never rewritten. Error is already referenced by GET /readyz's
  # 503 response.
  no-unused-components: off
  # Examples are contract, not decoration: a wrong example teaches a client
  # the wrong shape. Both rules are errors so docs/api/test asserts the
  # linter enforces them instead of a test re-implementing JSON Schema.
  no-invalid-media-type-examples: error
  no-invalid-schema-examples: error
