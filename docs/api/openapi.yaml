        - $ref: "#/components/parameters/ResumeID"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The normalized photo bytes.
          headers:
            ETag:
              $ref: "#/components/headers/ObjectETag"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The caller's `If-None-Match` matches the current
            object. Zero bytes and no `Content-Type`.
          headers:
            ETag:
              $ref: "#/components/headers/ObjectETag"
        "400":
          $ref: "#/components/responses/PhotoReadBadRequest"
        "401":
          $ref: "#/components/responses/ResumeUnauthorized"
        "404":
          $ref: "#/components/responses/ResumeOrPhotoNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowedPhoto"
        "429":
          $ref: "#/components/responses/ResumeRateLimited"
        "500":
          $ref: "#/components/responses/ResumeInternalError"
    patch:
      operationId: updateResumePhotoCrop
      tags: [resumes, media]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Change or clear the photo crop
      description: >-
        Changes only the normalized crop rectangle. The body is exactly
        `{crop: <crop>|null}`: null removes the crop property. It accepts no
        object key and no other photo field.


        The photo key is read inside the compare-and-swap transaction and
        preserved, and the route performs no object-store I/O at all. Ordinary
        JSON write admission applies; the upload-only limits, `415`, and
        `media_busy` are unreachable here.
      parameters:
        - $ref: "#/components/parameters/ResumeID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SchemaVersionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoCropPatch"
            example:
              crop:
                x: 0.1
                y: 0.05
                width: 0.8
                height: 0.8
      responses:
        "200":
          $ref: "#/components/responses/ResumeWritten"
        "400":
          $ref: "#/components/responses/ResumeWriteBadRequest"
        "401":
          $ref: "#/components/responses/ResumeUnauthorized"
        "403":
          $ref: "#/components/responses/ResumeCsrfRejected"
        "404":
          $ref: "#/components/responses/ResumeOrPhotoNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowedPhoto"
        "409":
          $ref: "#/components/responses/ResumeIdempotencyConflict"
        "412":
          $ref: "#/components/responses/ResumeRevisionMismatch"
        "413":
          $ref: "#/components/responses/ResumeBodyTooLarge"
        "422":
          $ref: "#/components/responses/ResumeDocumentInvalid"
        "428":
          $ref: "#/components/responses/ResumePreconditionRequired"
        "429":
          $ref: "#/components/responses/ResumeRateLimited"
        "500":
          $ref: "#/components/responses/ResumeInternalError"
    delete:
      operationId: deleteResumePhoto
      tags: [resumes, media]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Delete the resume photo
      description: >-
        Removes the photo reference and its crop, and enqueues exact-key
        deletion of the object in the same transaction. Access is revoked at
        commit; the bytes are removed by the deletion worker within the
        24-hour target (ADR 0019).


        The request has no body. Its idempotency fingerprint hashes a
        zero-length payload. The response is `204` with the new parent
        `ETag`.
      parameters:
        - $ref: "#/components/parameters/ResumeID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SchemaVersionHeader"
      responses:
        "204":
          description: Deleted. Zero bytes and no `Content-Type`, with the new
            parent revision in `ETag`.
          headers:
            ETag:
              $ref: "#/components/headers/ParentETag"
            X-Resume-Schema-Version:
              $ref: "#/components/headers/EmittedSchemaVersion"
        "400":
          $ref: "#/components/responses/ResumeWriteBadRequest"
        "401":
          $ref: "#/components/responses/ResumeUnauthorized"
        "403":
          $ref: "#/components/responses/ResumeCsrfRejected"
        "404":
          $ref: "#/components/responses/ResumeOrPhotoNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowedPhoto"
        "409":
          $ref: "#/components/responses/ResumeIdempotencyConflict"
        "412":
          $ref: "#/components/responses/ResumeRevisionMismatch"
        "413":
          $ref: "#/components/responses/ResumeBodyTooLarge"
        "428":
          $ref: "#/components/responses/ResumePreconditionRequired"
        "429":
          $ref: "#/components/responses/ResumeRateLimited"
        "500":
          $ref: "#/components/responses/ResumeInternalError"

  /public/resumes/{slug}:
    get:
      operationId: getPublicResume
      tags: [public]
      security: []
      summary: Read one published resume as public JSON
      description: >-
        Returns the closed privacy-filtered public projection for a live
        resume. Missing, private, renamed, deleted, tombstoned, and malformed
        slugs are indistinguishable `404` responses. The generation gate runs
        before cache reuse or conditional evaluation.
      parameters:
        - $ref: "#/components/parameters/PublicSlug"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses: &publicResumeResponses
        "200":
          $ref: "#/components/responses/PublicResumeRead"
        "304":
          $ref: "#/components/responses/PublicResumeNotModified"
        "400":
          $ref: "#/components/responses/PublicBadRequest"
        "404":
          $ref: "#/components/responses/PublicNotFound"
        "405":
          $ref: "#/components/responses/PublicMethodNotAllowed"
        "503":
          $ref: "#/components/responses/PublicUnavailable"
    head:
      operationId: headPublicResume
      tags: [public]
      security: []
      summary: Read public resume JSON headers
      description: >-
        Performs the same admission, generation, conditional comparison, and
        response selection as GET. It sends the GET representation's status
        and headers, including Content-Length, but no body bytes.
      parameters:
        - $ref: "#/components/parameters/PublicSlug"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses: *publicResumeResponses
  /public/resumes/{slug}/photo:
    get:
      operationId: getPublicResumePhoto
      tags: [public, media]
      security: []
      summary: Read a published resume's normalized photo
      description: >-
        Returns the current normalized JPEG or PNG only while the resume is
        live and still references that exact private object. Object keys and
        provider validators never reach the public response.
      parameters:
        - $ref: "#/components/parameters/PublicSlug"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses: &publicPhotoResponses
        "200":
          $ref: "#/components/responses/PublicPhotoRead"
        "304":
          $ref: "#/components/responses/PublicPhotoNotModified"
        "400":
          $ref: "#/components/responses/PublicBadRequest"
        "404":
          $ref: "#/components/responses/PublicNotFound"
        "405":
          $ref: "#/components/responses/PublicMethodNotAllowed"
        "503":
          $ref: "#/components/responses/PublicUnavailable"
    head:
      operationId: headPublicResumePhoto
      tags: [public, media]
      security: []
      summary: Read published photo headers
      description: >-
        Performs the same admission, object read, byte validation, and
        conditional comparison as GET. It sends the GET representation's
        status and headers, including Content-Length, but no body bytes.
      parameters:
        - $ref: "#/components/parameters/PublicSlug"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses: *publicPhotoResponses
  /auth/password/register:
    post:
      operationId: postAuthPasswordRegister
      tags: [auth]
      security: []
      summary: Queue email verification for a new password account
      description: >-
        Validates name, email, and password, then queues a verification email
        for an unowned email. Owned and unowned emails return the same `202`
        and reveal no account state; a provider-only user must sign in through
        the provider and add a password in settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRegisterRequest"
      responses:
        "202":
          $ref: "#/components/responses/PasswordAccepted"
        "400":
          $ref: "#/components/responses/PasswordRequestInvalid"
        "403":
          $ref: "#/components/responses/PasswordCsrfRejected"
        "413":
          $ref: "#/components/responses/PasswordBodyTooLarge"
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
        "422":
          $ref: "#/components/responses/PasswordPolicyInvalid"
        "429":
          $ref: "#/components/responses/PasswordRateLimited"
        "503":
          $ref: "#/components/responses/PasswordUnavailable"
  /auth/password/verify:
    post:
      operationId: postAuthPasswordVerify
      tags: [auth]
      security: []
      summary: Consume a verification token and create the account
      description: >-
        Consumes a single-use verification token and creates the account and
        credential. Creates no session; success redirects to login. A
        concurrent provider signup that won the email race returns the same
        success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordVerifyRequest"
      responses:
        "204":
          description: Email verified. No body — the page redirects to login.
        "400":
          $ref: "#/components/responses/PasswordTokenBadRequest"
        "403":
          $ref: "#/components/responses/PasswordCsrfRejected"
        "413":
          $ref: "#/components/responses/PasswordBodyTooLarge"
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
        "429":
          $ref: "#/components/responses/PasswordRateLimited"
        "503":
          $ref: "#/components/responses/PasswordUnavailable"
  /auth/password/login:
    post:
      operationId: postAuthPasswordLogin
      tags: [auth]
      security: []
      summary: Create an opaque session from email and password
      description: >-
        Verifies the email and password, then creates the same opaque
        `__Host-session` cookie as a provider login. Unknown email,
        provider-only account, and wrong password are indistinguishable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "204":
          description: >-
            Authenticated. No body; the session is set on the
            `__Host-session` cookie.
        "400":
          $ref: "#/components/responses/PasswordRequestInvalid"
        "401":
          $ref: "#/components/responses/PasswordAuthenticationFailed"
        "403":
          $ref: "#/components/responses/PasswordCsrfRejected"
        "413":
          $ref: "#/components/responses/PasswordBodyTooLarge"
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
        "429":
          $ref: "#/components/responses/PasswordRateLimited"
        "503":
          $ref: "#/components/responses/PasswordUnavailable"
  /auth/password/forgot:
    post:
      operationId: postAuthPasswordForgot
      tags: [auth]
      security: []
      summary: Queue a password reset when eligible
      description: >-
        Accepts an email and always returns the generic `202`. Only an
        existing account with a password gets a reset email; unknown and
        provider-only emails create neither.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordForgotRequest"
      responses:
        "202":
          $ref: "#/components/responses/PasswordAccepted"
        "400":
          $ref: "#/components/responses/PasswordRequestInvalid"
        "403":
          $ref: "#/components/responses/PasswordCsrfRejected"
        "413":
          $ref: "#/components/responses/PasswordBodyTooLarge"
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
        "429":
          $ref: "#/components/responses/PasswordRateLimited"
        "503":
          $ref: "#/components/responses/PasswordUnavailable"
  /auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      tags: [auth]
      security: []
      summary: Consume a reset token and replace the credential
      description: >-
        Consumes a single-use reset token, replaces the credential, and
        revokes every session. Never logs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password reset. No body — the page redirects to login.
        "400":
          $ref: "#/components/responses/PasswordTokenBadRequest"
        "403":
          $ref: "#/components/responses/PasswordCsrfRejected"
        "413":
          $ref: "#/components/responses/PasswordBodyTooLarge"
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
        "422":
          $ref: "#/components/responses/PasswordPolicyInvalid"
        "429":
          $ref: "#/components/responses/PasswordRateLimited"
        "503":
          $ref: "#/components/responses/PasswordUnavailable"
  /auth/password/reauth:
    post:
      operationId: postAuthPasswordReauth
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Refresh recent reauthentication with the current password
      description: >-
        Verifies the current password and refreshes the completing session's
        recent-reauthentication time. Requires a live session and CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReauthRequest"
      responses:
        "204":
          description: Reauthenticated. No body.
        "400":
          $ref: "#/components/responses/PasswordRequestInvalid"
        "401":
          $ref: "#/components/responses/PasswordReauthUnauthorized"
        "403":
          $ref: "#/components/responses/PasswordCsrfRejected"
        "413":
          $ref: "#/components/responses/PasswordBodyTooLarge"
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
        "429":
          $ref: "#/components/responses/PasswordRateLimited"
        "503":
          $ref: "#/components/responses/PasswordUnavailable"
  /me/password:
    put:
      operationId: putMePassword
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Add or replace the account password credential
      description: >-
        Adds a credential to a provider-only account or replaces the current
        one. Requires a live session, CSRF, and a recent reauthentication.
        Creates a fresh current session and revokes all old sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSetRequest"
      responses:
        "204":
          description: >-
            Credential updated. No body; a fresh session is set on the
            `__Host-session` cookie.
        "400":
          $ref: "#/components/responses/PasswordRequestInvalid"
        "401":
          $ref: "#/components/responses/PasswordAuthenticationRequired"
        "403":
          $ref: "#/components/responses/PasswordSetForbidden"
        "413":
          $ref: "#/components/responses/PasswordBodyTooLarge"
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
        "422":
          $ref: "#/components/responses/PasswordPolicyInvalid"
        "429":
          $ref: "#/components/responses/PasswordRateLimited"
        "503":
          $ref: "#/components/responses/PasswordUnavailable"

components:
  responses:
    AuthStartRateLimited:
      description: >-
        The start routes' own rate limit is exhausted. Anonymous sign-in
        `GET` starts are keyed by client IP. Authenticated link and
        reauthentication `POST` starts are keyed by `(account, client IP)`.
        Both are tighter than the whole-server default because each accepted
        start writes a database row. Carries `Retry-After` in whole seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Whole seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: too many requests; retry later
    ResumeRead:
      description: One owned resume, projected to the requested wire version.
      headers:
        ETag:
          $ref: "#/components/headers/ParentETag"
        X-Resume-Schema-Version:
          $ref: "#/components/headers/EmittedSchemaVersion"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Resume"
          example:
            data:
              id: 018f5b6a-9a3e-7c21-8b1e-000000000010
              title: Backend engineer
              lng: en
              revision: "42"
              live: true
              slug: ada-lovelace
              downloadEnabled: true
              seoGeoEnabled: true
              schemaVersion: 2
              createdAt: 2026-08-01T09:00:00Z
              updatedAt: 2026-08-11T18:20:00Z
              document:
                schemaVersion: 2
    ResumeWritten:
      description: The whole resume after the write, at its new revision.
      headers:
        ETag:
          $ref: "#/components/headers/ParentETag"
        X-Resume-Schema-Version:
          $ref: "#/components/headers/EmittedSchemaVersion"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Resume"
          example:
            data:
              id: 018f5b6a-9a3e-7c21-8b1e-000000000010
              title: Backend engineer
              lng: en
              revision: "43"
              live: true
              slug: ada-lovelace
              downloadEnabled: true
              seoGeoEnabled: true
              schemaVersion: 2
              createdAt: 2026-08-01T09:00:00Z
              updatedAt: 2026-08-12T09:05:00Z
              document:
                schemaVersion: 2
    ResumeListBadRequest:
      description: >-
        `invalid_client_ip` when the trusted-proxy boundary cannot derive one
        canonical client address, or `unsupported_schema_version` when
        `X-Resume-Schema-Version` is outside the accepted set. The latter
        carries `details.acceptedVersions`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_schema_version
              message: requested resume schema version is not accepted
              details:
                acceptedVersions: [1, 2]
    ResumeReadBadRequest:
      description: >-
        `invalid_client_ip`, `request_invalid` for a malformed path
        parameter, or `unsupported_schema_version` for a wire version outside
        the accepted set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: request_invalid
              message: resume id is not a UUID
    ResumeWriteBadRequest:
      description: >-
        A malformed request, before any state change: `invalid_client_ip`,
        `idempotency_key_required`, `idempotency_key_invalid`,
        `precondition_malformed` when `If-Match` is not `"r<digits>"`,
        `request_invalid` for malformed JSON, an unknown field, a repeated or
        comma-folded singleton header, or a malformed path parameter, or
        `unsupported_schema_version`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: idempotency_key_required
              message: every mutation requires an Idempotency-Key header
    ResumeCreateBadRequest:
      description: >-
        As the write case, except that a create has no prior revision:
        supplying `If-Match` is `precondition_not_supported` rather than
        `precondition_malformed`. Also `invalid_client_ip`,
        `idempotency_key_required`, `idempotency_key_invalid`,
        `request_invalid`, and `unsupported_schema_version`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: precondition_not_supported
              message: resume creation has no prior revision to match
    PhotoReadBadRequest:
      description: >-
        `invalid_client_ip`, or `request_invalid` for a malformed resume id
        or an `If-None-Match` that is repeated, comma-folded, weak, or
        otherwise malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: request_invalid
              message: If-None-Match must be one well-formed strong tag
    ResumeUnauthorized:
      description: Missing or invalid `__Host-session` cookie
        (`session_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: session_required
              message: a valid session is required
    ResumeCsrfRejected:
      description: >-
        `csrf_rejected`. The `X-CSRF-Token` header is missing or wrong, or
        the `Origin`/`Referer` check failed. Rejection precedes body decode,
        idempotency inspection, and any state change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: csrf_rejected
              message: CSRF validation failed
    ResumeNotFound:
      description: >-
        `resume_not_found`. Also the answer for a resume owned by another
        account: the API is not an existence oracle, so a foreign id and a
        random one are indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: resume_not_found
              message: resume not found
    ResumeOrPhotoNotFound:
      description: >-
        `resume_not_found` when the resume is missing or owned by another
        account, or `media_not_found` when the owned resume carries no photo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: media_not_found
              message: this resume has no photo
    ResumeCreateConflict:
      description: >-
        A domain conflict, never staleness: `resume_cap_exceeded` for a
        create beyond the per-account cap, or `idempotency_key_reuse` when
        the same key arrives with a different request fingerprint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: resume_cap_exceeded
              message: this account already has the maximum number of resumes
    ResumeIdempotencyConflict:
      description: >-
        `idempotency_key_reuse`: the same key under the same user and
        operation identity arrived with a different request fingerprint.
        Nothing is written and no stored response is replayed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: idempotency_key_reuse
              message: this idempotency key was used with a different request
    ResumeRevisionMismatch:
      description: >-
        `revision_mismatch`: the `If-Match` revision is stale. `details`
        carries the winning `revision` and `document` so a client can rebase
        without a second round trip. Staleness is always `412`, never `409`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: revision_mismatch
              message: the resume was modified since you last loaded it
              details:
                revision: "44"
                document:
                  schemaVersion: 2
    ResumePreconditionRequired:
      description: >-
        `precondition_required`: this mutation needs an `If-Match` header and
        none was sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: precondition_required
              message: this mutation requires an If-Match header
    ResumeBodyTooLarge:
      description: >-
        `body_too_large`: the JSON request body exceeded the bounded read
        limit. Rejection precedes decode and any state change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: body_too_large
              message: request body exceeds the maximum size
    ResumeDocumentInvalid:
      description: >-
        `document_invalid`: the request parsed, but the resulting document
        fails schema, aggregate, or bounds validation. `details.issues[]`
        lists each offending path with its own code and message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: document_invalid
              message: the resulting document is invalid
              details:
                issues:
                  - path: content.experience.entries[0].title
                    code: too_long
                    message: value exceeds the field's maximum length
    CustomizationRejected:
      description: >-
        `customization_path_denied` when a delta path is outside the fixed
        allowlist, or `document_invalid` when the applied result fails
        validation. Nothing is written in either case.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: customization_path_denied
              message: that customization path cannot be written
              details:
                issues:
                  - path: content
                    code: customization_path_denied
                    message: only customization paths may be written here
    PhotoTooLarge:
      description: >-
        `media_too_large`: the request or its `file` part exceeded the media
        ceilings. The streaming upload path maps its own overflow here and
        never emits `body_too_large`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: media_too_large
              message: the uploaded image exceeds the maximum size
    PhotoTypeUnsupported:
      description: >-
        `media_type_unsupported`: the decoder-sniffed container is outside
        the closed set of static JPEG, PNG, and WebP. No object is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: media_type_unsupported
              message: only JPEG, PNG, or WebP images are accepted
    PhotoInvalid:
      description: >-
        `media_invalid` when a recognized image is animated, structurally
        invalid, out of bounds, or cannot be normalized, or
        `document_invalid` when the resulting document fails validation.
        Parser text never reaches the client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: media_invalid
              message: the image could not be decoded and normalized
              details:
                reason: malformed
    PhotoBusy:
      description: >-
        `media_busy`: the task-wide media permit was not acquired within one
        second, so the request is shed before any body read. Carries
        `Retry-After: 1`.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
          example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: media_busy
              message: media processing is busy; retry shortly
    ResumeRateLimited:
      description: >-
        `rate_limited`: a route-specific budget is exhausted. Reads, writes,
        and photo uploads have separate `(account, client IP)` policies, so
        one account cannot consume another's allowance.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: too many requests; retry later
    ResumeInternalError:
      description: >-
        `internal_error`: an unexpected server failure. The body carries no
        SQL fragment, stack frame, object key, bucket name, internal host, or
        other account's identifier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: internal server error
    ResumePublishForbidden:
      description: >-
        `csrf_rejected` when the CSRF or exact-origin chain fails, or
        `reauth_required` when a fresh change would release a slug and the
        current session has no recent full OAuth login. Rejection begins no
        publish transaction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: reauth_required
              message: recent reauthentication is required
    ResumePublishConflict:
      description: >-
        A publish-domain conflict, never staleness: `slug_taken` when another
        resume or an unexpired tombstone owns the requested slug, or
        `idempotency_key_reuse` when one retained key arrives with a changed
        fingerprint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: slug_taken
              message: that slug is not available
    ResumePublishInvalid:
      description: >-
        `publish_invalid`: the request parsed, but its effective flags, slug,
        or resume completeness cannot be published. The outer message is
        exactly `resume cannot be published`; `details.issues[]` contains
        every applicable closed publish issue in deterministic order.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublishError"
          example:
            error:
              code: publish_invalid
              message: resume cannot be published
              details:
                issues:
                  - path: personalDetails.fullName
                    code: required
                    message: full name is required for publication
    PublicStateBusy:
      description: >-
        `public_state_busy`: a required public-generation drain did not finish
        within the shared five-second deadline. No mutation transaction began.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            const: 1
          example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: public_state_busy
              message: public state is busy; retry shortly
    PublicResumeRead:
      description: The exact unencoded public JSON representation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Length:
          $ref: "#/components/headers/RepresentationContentLength"
        ETag:
          $ref: "#/components/headers/PublicBodyETag"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicResume"
    PublicPhotoRead:
      description: The exact normalized public photo representation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Length:
          $ref: "#/components/headers/RepresentationContentLength"
        ETag:
          $ref: "#/components/headers/PublicBodyETag"
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    PublicResumeNotModified:
      description: >-
        The strong conditional tag matches the selected public JSON bytes.
        Zero body bytes and no Content-Length.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Type:
          description: Media type of the selected GET representation.
          schema:
            type: string
            const: application/json; charset=utf-8
          example: application/json; charset=utf-8
        ETag:
          $ref: "#/components/headers/PublicBodyETag"
    PublicPhotoNotModified:
      description: >-
        The strong conditional tag matches the selected normalized photo
        bytes. Zero body bytes and no Content-Length.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Type:
          description: Media type of the selected GET representation.
          schema:
            type: string
            enum: [image/jpeg, image/png]
          example: image/jpeg
        ETag:
          $ref: "#/components/headers/PublicBodyETag"
    PublicBadRequest:
      description: >-
        `request_invalid`: after public admission, the conditional header is
        repeated, comma-folded, weak, wildcard, whitespace-padded, or otherwise
        malformed. No ETag is sent.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Length:
          $ref: "#/components/headers/RepresentationContentLength"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: request_invalid
              message: request is invalid
    PublicNotFound:
      description: >-
        `public_not_found`: the uniform answer for missing, private, renamed,
        deleted, tombstoned, malformed, wrong-target, or flag-disabled public
        state. No ETag is sent.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Length:
          $ref: "#/components/headers/RepresentationContentLength"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: public_not_found
              message: public resume not found
    PublicMethodNotAllowed:
      description: >-
        `method_not_allowed`: the recognized public JSON or photo path accepts
        only GET and HEAD. Dispatch happens before resource lookup or body read.
      headers:
        Allow:
          description: Methods this public path serves.
          schema:
            type: string
            const: GET, HEAD
          example: GET, HEAD
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Length:
          $ref: "#/components/headers/RepresentationContentLength"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: method is not allowed
    PublicUnavailable:
      description: >-
        `temporarily_unavailable`: an admitted dependency failure or generation
        transition mismatch. Stale bytes are never substituted and no ETag is
        sent.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PublicCacheControl"
        Content-Length:
          $ref: "#/components/headers/RepresentationContentLength"
        Retry-After:
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            const: 1
          example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: temporarily_unavailable
              message: service temporarily unavailable
    MethodNotAllowedResumes:
      description: "`method_not_allowed` on the resume collection."
      headers:
        Allow:
          description: Methods this path serves.
          schema:
            type: string
          example: GET, POST
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: method not allowed
    MethodNotAllowedResumeItem:
      description: "`method_not_allowed` on one resume."
      headers:
        Allow:
          description: Methods this path serves.
          schema:
            type: string
          example: DELETE, GET, PATCH
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: method not allowed
    MethodNotAllowedPatchOnly:
      description: "`method_not_allowed` on a patch-only resume child."
      headers:
        Allow:
          description: Methods this path serves.
          schema:
            type: string
          example: PATCH
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: method not allowed
    MethodNotAllowedDeleteOnly:
      description: "`method_not_allowed` on a delete-only resume child."
      headers:
        Allow:
          description: Methods this path serves.
          schema:
            type: string
          example: DELETE
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: method not allowed
    MethodNotAllowedPhoto:
      description: "`method_not_allowed` on the resume photo."
      headers:
        Allow:
          description: Methods this path serves.
          schema:
            type: string
          example: DELETE, GET, PATCH, POST
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: method not allowed
    MethodNotAllowedPublish:
      description: "`method_not_allowed` on the publish transition."
      headers:
        Allow:
          description: Methods this path serves.
          schema:
            type: string
            const: POST
          example: POST
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: method not allowed
    PasswordAccepted:
      description: >-
        The generic `202` acceptance used by registration and
        forgot-password. Byte-identical for every account state and reveals
        no email ownership.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PasswordAccepted"
          example:
            data:
              accepted: true
    PasswordRequestInvalid:
      description: >-
        `request_invalid`: malformed JSON, an unknown or repeated field, a
        wrong-typed field, an envelope shape error, or a malformed token
        shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: request_invalid
              message: request is malformed
    PasswordCredentialTokenInvalid:
      description: >-
        `credential_token_invalid`: a well-shaped token that is absent,
        expired, consumed, or replaced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: credential_token_invalid
              message: credential token is invalid
    PasswordTokenBadRequest:
      description: >-
        `request_invalid` for malformed JSON, an unknown or repeated field, a
        wrong-typed field, or a malformed token shape; or
        `credential_token_invalid` for a well-shaped token that is absent,
        expired, consumed, or replaced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: credential_token_invalid
              message: credential token is invalid
    PasswordReauthUnauthorized:
      description: >-
        `authentication_required` when no live session is present, or
        `reauth_failed` when the supplied password is not the current
        credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: reauth_failed
              message: reauthentication failed
    PasswordSetForbidden:
      description: >-
        `csrf_rejected` when the Origin/Referer or synchronizer-token check
        fails, or `reauth_required` when the recent-reauthentication window
        is not satisfied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: reauth_required
              message: recent reauthentication required
    PasswordAuthenticationFailed:
      description: >-
        `authentication_failed`: unknown email, a provider-only account, or a
        wrong password. All three are indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: authentication_failed
              message: authentication failed
    PasswordReauthFailed:
      description: >-
        `reauth_failed`: the supplied password is not the current credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: reauth_failed
              message: reauthentication failed
    PasswordAuthenticationRequired:
      description: "`authentication_required`: no live session is present."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: authentication_required
              message: authentication required
    PasswordCsrfRejected:
      description: >-
        `csrf_rejected`: the exact Origin/Referer check failed (every
        password route) or the synchronizer token failed (authenticated
        routes).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: csrf_rejected
              message: CSRF validation failed
    PasswordReauthRequired:
      description: >-
        `reauth_required`: the recent-reauthentication window is not
        satisfied for an add/change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: reauth_required
              message: recent reauthentication required
    PasswordBodyTooLarge:
      description: "`body_too_large`: the request exceeded its 4,096-byte cap."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: body_too_large
              message: request body is too large
    PasswordMediaTypeUnsupported:
      description: >-
        `media_type_unsupported`: the request Content-Type is not exactly
        `application/json`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: media_type_unsupported
              message: Content-Type must be application/json
    PasswordPolicyInvalid:
      description: >-
        `password_invalid`: a closed password-policy issue. `details.issue`
        is one of `length`, `common`, or `breached`; the rejected value is
        never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: password_invalid
              message: password does not meet policy
              details:
                issue: length
    PasswordRateLimited:
      description: >-
        `rate_limited`: a bounded password limiter rejected the attempt.
        Carries `Retry-After` in whole seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Whole seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: too many requests; retry later
    PasswordUnavailable:
      description: >-
        `authentication_unavailable`: a required hash, breach, database,
        encryption, or queue dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: authentication_unavailable
              message: authentication is temporarily unavailable
  headers:
    ParentETag:
      description: The owning resume's revision as a strong entity tag,
        `"r<revision>"`. Send it back as `If-Match` on the next mutation.
      schema:
        type: string
        pattern: '^"r[0-9]+"$'
      example: '"r43"'
    ObjectETag:
      description: Strong entity tag derived from the photo's immutable
        object key. It changes only when the photo is replaced.
      schema:
        type: string
      example: '"p-3f2a91c8"'
    EmittedSchemaVersion:
      description: The resume document version this response was emitted at.
        Absent from whole-resume deletion and from binary photo reads.
      schema:
        type: integer
        minimum: 1
      example: 2
    PublicCacheControl:
      description: >-
        Public representations must revalidate at the origin before reuse.
        Public responses remain transformable so Caddy can own content
        encoding and its validator suffix.
      schema:
        type: string
        const: no-cache, must-revalidate
      example: no-cache, must-revalidate
    PublicBodyETag:
      description: >-
        Strong validator: lowercase SHA-256 of the exact unencoded selected
        response body, quoted with no domain or representation prefix. Caddy
        may add its encoding suffix only on the viewer-facing response.
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
      example: '"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"'
    RepresentationContentLength:
      description: >-
        Byte length of the exact GET representation. HEAD sends the same value
        while suppressing body bytes.
      schema:
        type: integer
        minimum: 0
      example: 512

  schemas:
    Envelope:
      type: object
      description: Success response wrapper. `data` carries the
        operation-specific payload; individual operations refine its shape
        via `allOf`.
      required:
        - data
      properties:
        data: {}
    AuthStartResponse:
      type: object
      description: >-
        `POST /auth/{provider}/start`'s success envelope: the provider
        authorize URL the client navigates the browser to itself.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - authorizeUrl
          properties:
            authorizeUrl:
              type: string
              format: uri
              description: >-
                The provider's own authorize endpoint, carrying this
                transaction's `state` and PKCE challenge. Single use: it
                is bound to the `__Host-oauth-tx` cookie set on the same
                response, and both expire together after 10 minutes.
              example: https://accounts.google.com/o/oauth2/v2/auth?...
    OAuthConsentScope:
      type: string
      description: Account-wide permission granted to a connected agent.
      enum: [resumes:read, resumes:write]
    OAuthConsentDecisionRequest:
      type: object
      description: >-
        Strict JSON representation of the validated authorization request and
        the user's decision. Unknown and duplicate fields are rejected.
      additionalProperties: false
      required:
        - client_id
        - redirect_uri
        - response_type
        - scope
        - code_challenge
        - code_challenge_method
        - decision
      properties:
        client_id:
          type: string
          format: uuid
        redirect_uri:
          type: string
          format: uri
          description: Must exactly match one redirect URI registered by the client.
        response_type:
          type: string
          const: code
        scope:
          type: string
          enum:
            - resumes:read
            - resumes:write
            - resumes:read resumes:write
        state:
          type: string
          maxLength: 512
          description: Opaque client state, echoed on redirect when present.
        code_challenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        code_challenge_method:
          type: string
          const: S256
        decision:
          type: string
          enum: [approve, deny]
    OAuthConsentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [clientName, scopes]
          properties:
            clientName:
              type: string
              maxLength: 64
            scopes:
              type: array
              minItems: 1
              maxItems: 2
              uniqueItems: true
              items:
                $ref: "#/components/schemas/OAuthConsentScope"
    OAuthConsentDecisionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [redirectTo]
          properties:
            redirectTo:
              type: string
              format: uri-reference
              description: >-
                Redirect URL on the exact registered redirect URI only. It
                carries the authorization result and optional client state;
                it is never an arbitrary caller-selected destination.
    OAuthAgentGrant:
      type: object
      additionalProperties: false
      required: [id, clientName, scopes, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        clientName:
          type: string
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OAuthConsentScope"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
    OAuthAgentGrantsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [grants]
          properties:
            grants:
              type: array
              maxItems: 10
              items:
                $ref: "#/components/schemas/OAuthAgentGrant"
    Error:
      type: object
      description: Failure response wrapper.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code (e.g.
                `slug_taken`, `precondition_failed`).
              example: precondition_failed
            message:
              type: string
              description: Human-readable message; not intended to be
                parsed by clients.
              example: The resume was modified since you last loaded it.
            details:
              type: object
              description: >-
                Optional, code-specific structured context. Both `code` and
                `message` stay required and unchanged; this is additive.


                `412 revision_mismatch` carries `revision` (the winning
                revision) and `document` (the winning document), so a client
                can rebase without a second round trip. A document, bounds,
                or customization rejection carries `issues[]`, each with
                `path`, `code`, and `message`. `400
                unsupported_schema_version` carries `acceptedVersions`, the
                versions the server accepts.
              properties:
                revision:
                  $ref: "#/components/schemas/Revision"
                document:
                  $ref: "#/components/schemas/ResumeDocument"
                acceptedVersions:
                  type: array
                  description: Wire versions this server accepts.
                  items:
                    type: integer
                    minimum: 1
                issues:
                  type: array
                  description: One entry per rejected value.
                  items:
                    type: object
                    required: [path, code, message]
                    properties:
                      path:
                        type: string
                        description: Dotted path to the offending value.
                      code:
                        type: string
                      message:
                        type: string
                reason:
                  type: string
                  description: Stable reason for a `media_invalid` response.
                  enum:
                    - malformed
                    - animated
                    - dimensions
                    - orientation
                    - trailing_data
                    - normalization_failed
                issue:
                  $ref: "#/components/schemas/PasswordPolicyIssue"
    Revision:
      type: string
      pattern: "^[0-9]+$"
      description: >-
        A resume's revision number. Server-assigned, monotonically
        increasing, and stored as a Postgres bigint — serialized here as a
        **string** (not a JSON number) so TypeScript and Dart clients don't
        lose precision on 64-bit values. Appears in resource bodies (e.g.
        `"revision": "42"`) and is echoed in the `ETag` response header as
        `"r<revision>"` for use in a subsequent `If-Match`.
      example: "42"
    User:
      type: object
      description: A registered aboutme user's own account record (design
        spec §3 `users` table), as returned by `GET /me`.
      required:
        - id
        - email
        - name
        - avatarKey
        - hasPassword
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarKey:
          type: [string, "null"]
          description: Object-storage key for the user's avatar image, or
            `null` if none has been set.
        hasPassword:
          type: boolean
          description: Whether the account has a password credential. A
            provider-only account is `false` until a password is added.
      example:
        id: 018f5b6a-9a3e-7c21-8b1e-000000000001
        email: ada@example.com
        name: Ada Lovelace
        avatarKey: null
        hasPassword: false
    Identity:
      type: object
      description: One linked OAuth provider identity. `GET /me` exposes
        only the provider itself —
        never the provider's own subject/user id, an internal correlation
        key with no reason to ever reach a client.
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [google, github, linkedin]
      example:
        provider: google
    SessionDevice:
      type: object
      description: One of the caller's own live sessions, as returned by
        `GET /sessions`. Explicitly
        revoked, idle-expired, absolute-expired, and grace-dead
        rotation-predecessor sessions are never included — see `GET
        /sessions`' own operation description for the full exclusion
        rule.
      required:
        - id
        - createdAt
        - lastSeenAt
        - ua
        - ip
        - current
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: RFC 3339, UTC (`Z` suffix).
        lastSeenAt:
          type: string
          format: date-time
          description: RFC 3339, UTC (`Z` suffix).
        ua:
          type: [string, "null"]
          description: The `User-Agent` header recorded when this session
            was issued, or `null` if none was sent.
        ip:
          type: [string, "null"]
          description: The client IP recorded when this session was issued,
            or `null` if none could be determined.
        current:
          type: boolean
          description: "`true` for exactly the one session the request
            itself is authenticated with."
      example:
        id: 018f5b6a-9a3e-7c21-8b1e-000000000002
        createdAt: "2026-08-01T12:00:00Z"
        lastSeenAt: "2026-08-02T09:30:00Z"
        ua: Mozilla/5.0 (Macintosh; ...)
        ip: 203.0.113.7
        current: true
    OAuthCallbackErrorCode:
      type: string
      description: >-
        The closed OAuth error vocabulary the web client handles. Callback
        rejection redirects use all values except `reauth_required`. A
        login callback redirects to `/login?error=<code>`; a link or
        reauthentication callback redirects to
        `/app/settings/sessions?error=<code>`. An unrecognized callback
        value is handled as `auth_failed`.


        `reauth_required` is included because the authenticated `POST
        /auth/{provider}/start?purpose=link` operation returns it in a JSON
        error. No `/start` operation redirects with an error query.


        - `auth_failed`: the generic code for every rejection not
          explicitly listed below (transaction invalid/expired/replayed,
          state mismatch, ID token verification failure, missing code,
          etc.) — deliberately no oracle distinguishing which check
          failed. For `purpose=link`/`reauth`, this also covers a
          `purpose=reauth` attempt against a provider identity that isn't
          already linked and the completing request having no valid session
          for the user who began the flow.

        - `email_not_verified`: the provider's own account has an
          unverified (or absent) email. `purpose=login` only — linking
          never requires a verified email.

        - `cancelled`: the visitor declined consent at the provider
          (`error=access_denied` echoed back on the callback, RFC 6749
          §4.1.2.1).

        - `email_already_registered`: `purpose=login` only. The verified
          email already belongs to an existing account reached via a
          DIFFERENT provider (or the same provider under a different
          identity) — no automatic cross-provider email merge
          (AC-AUTH-001). Carries an additional
          `&provider=<p>` query param naming the provider THIS callback is
          for (already public — it's the URL path) — never the existing
          account's own provider, which the response must not name (a
          targeted-phishing hint).

        - `identity_already_linked`: `purpose=link`/`reauth` only. The
          provider identity this callback resolved
          is already claimed by a DIFFERENT user than the one who started
          the flow. No row is mutated and no session is issued for either
          user. Kept distinct from `auth_failed` — unlike most rejections
          here — because the actor is authenticated and the condition is
          one they can act on.

        - `reauth_required`: `POST /auth/{provider}/start?purpose=link`
          only, never a callback query. The session is valid, but its last
          full OAuth login is more than 15 minutes old. The server checks
          this before creating a transaction. Session revocation endpoints
          use the same JSON error code so one prompt can handle each
          sensitive action.
      enum:
        - auth_failed
        - email_not_verified
        - cancelled
        - email_already_registered
        - identity_already_linked
        - reauth_required
    PublishResumeRequest:
      type: object
      description: >-
        Complete publish-state command. Omitted slug preserves stored state;
        the three booleans are always explicit. A present empty or null slug
        is a malformed request, not a publish-policy issue.
      additionalProperties: false
      required:
        - live
        - downloadEnabled
        - seoGeoEnabled
      properties:
        slug:
          type: string
          minLength: 1
          description: >-
            Requested public slug. Grammar, length, reserved-root, claim, and
            tombstone checks are semantic publish policy after JSON decoding.
        live:
          type: boolean
        downloadEnabled:
          type: boolean
        seoGeoEnabled:
          type: boolean
    PublishValidationIssue:
      type: object
      description: One deterministic semantic publish-policy issue.
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
          enum:
            - required_for_live
            - requires_live
            - invalid_format
            - reserved
            - required
            - visible_entry_required
        message:
          type: string
    PublishError:
      description: >-
        The standard Error envelope narrowed to `publish_invalid` issue
        details. Its outer shape and required code/message fields are the same
        API-wide error family.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              const: publish_invalid
            message:
              type: string
              const: resume cannot be published
            details:
              type: object
              additionalProperties: false
              required: [issues]
              properties:
                issues:
                  type: array
                  items:
                    $ref: "#/components/schemas/PublishValidationIssue"
    PublicResume:
