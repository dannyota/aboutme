                  value:
                    error:
                      code: csrf_rejected
                      message: CSRF validation failed
                reauth_required:
                  summary: "purpose=link, stale reauth window"
                  value:
                    error:
                      code: reauth_required
                      message: recent reauthentication is required
        "429":
          $ref: "#/components/responses/AuthStartRateLimited"
  /auth/linkedin/callback:
    get:
      operationId: getAuthLinkedInCallback
      tags: [auth]
      security: []
      summary: Complete "Sign in with LinkedIn"
      description: >-
        Consumes the pending OAuth transaction (`__Host-oauth-tx`
        cookie), exchanges the authorization code (PKCE), verifies the ID
        token (issuer/audience/signature/expiry, plus the OIDC nonce), and
        resolves the local user per `purpose`, exactly like `GET
        /auth/google/callback` — see that
        operation's own description for the full `purpose=login` vs
        `purpose=link`/`reauth` behavior and redirect targets, with ONE
        LinkedIn-specific difference: `purpose=login`'s registration path
        (an UNKNOWN identity only — an existing identity's repeat login
        never re-checks email at all, matching every other provider)
        requires a verified email exactly like Google, EXCEPT LinkedIn's
        OIDC `email`/`email_verified` claims are OPTIONAL — an absent
        `email_verified` claim is never treated as true (AC-AUTH-002).
        `purpose=link`/`reauth` never checks email; linking an existing
        account remains allowed without a verified email.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: The provider's authorization code (RFC 6749 §4.1.2).
            Absent on a provider-signaled rejection (see `error` below).
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Must match the pending transaction's own `state` (RFC
            6749 §10.12) or the callback is rejected with `auth_failed`.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Set by the PROVIDER itself when the visitor declines
            consent — `error=access_denied`, mapped to this server's own
            `cancelled` code.
      responses:
        "302":
          description: Always redirects — see the operation description for
            the success/rejected branches.
          headers:
            Location:
              schema:
                type: string
                format: uri
              example: https://aboutme.vn/login?error=auth_failed

  # ---- Session-authenticated JSON API (AC-AUTH-005) -----------------------
  /me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - sessionCookie: []
      summary: The caller's own account, a fresh CSRF token, and linked
        providers
      description: >-
        Returns the authenticated caller's own user record, a fresh CSRF
        token, and which OAuth providers they have a linked identity for.
        Identities are ordered by `(created_at, id)`, oldest first, so clients
        have a stable default reauthentication provider even when timestamps
        are equal.


        The CSRF token is returned **only** here, in the response body —
        never in a header, cookie, URL, or log line. A client must echo it
        back on the `X-CSRF-Token`
        header for every mutating cookie-authenticated request (see the
        `csrfToken` security scheme).
      responses:
        "200":
          description: The caller's own account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user, csrfToken, identities]
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          csrfToken:
                            type: string
                            description: base64url (no padding) encoding of
                              this session's own CSRF secret. Echo back
                              on `X-CSRF-Token` for every mutating
                              request.
                            example: kQ2f9Z3sV1n8LhTt7v0wYb-example
                          identities:
                            type: array
                            description: >-
                              Linked identities ordered by `(created_at, id)`,
                              oldest first.
                            items:
                              $ref: "#/components/schemas/Identity"
              example:
                data:
                  user:
                    id: 018f5b6a-9a3e-7c21-8b1e-000000000001
                    email: ada@example.com
                    name: Ada Lovelace
                    avatarKey: null
                  csrfToken: kQ2f9Z3sV1n8LhTt7v0wYb-example
                  identities:
                    - provider: google
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: session_required
                  message: a valid session is required
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Log out (revoke the current session)
      description: >-
        Revokes the caller's own current session, clears the
        `__Host-session` cookie, and sets `Clear-Site-Data: "cookies",
        "storage"` so the browser drops any cached credential-derived
        state too.
      responses:
        "204":
          description: Logged out. No response body — session endpoints
            return `204`, not a `{"data":...}` envelope, on a successful
            mutation.
          headers:
            Clear-Site-Data:
              schema:
                type: string
              example: '"cookies", "storage"'
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF validation failed (Origin/Referer, Content-Type,
            or token mismatch — collapsed into one no-oracle code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: csrf_rejected
                  message: CSRF validation failed
  /sessions:
    get:
      operationId: getSessions
      tags: [auth]
      security:
        - sessionCookie: []
      summary: List the caller's own live sessions (device list)
      description: >-
        Every LIVE session belonging to the caller. A session is excluded
        the moment ANY of these become true: it is explicitly revoked; it
        is idle-expired (no activity for 30 days); it is absolute-expired
        (90 days since it was first issued, regardless of activity); or it
        is a grace-dead rotation predecessor (a superseded session row
        whose rotation grace window has already elapsed but isn't itself
        marked revoked).
      responses:
        "200":
          description: The caller's own live sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SessionDevice"
              example:
                data:
                  - id: 018f5b6a-9a3e-7c21-8b1e-000000000002
                    createdAt: "2026-08-01T12:00:00Z"
                    lastSeenAt: "2026-08-02T09:30:00Z"
                    ua: Mozilla/5.0 (Macintosh; ...)
                    ip: 203.0.113.7
                    current: true
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSessions
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Log out everywhere (revoke every live session)
      description: >-
        Revokes every one of the caller's own live sessions, clears the
        current `__Host-session` cookie, and sets `Clear-Site-Data:
        "cookies", "storage"`.


        Requires a RECENT reauthentication — the session's last full
        OAuth login within the last 15 minutes — rejected with `403
        reauth_required` otherwise, checked BEFORE any session row is
        touched.
      responses:
        "204":
          description: Logged out everywhere. No response body.
          headers:
            Clear-Site-Data:
              schema:
                type: string
              example: '"cookies", "storage"'
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF validation failed, OR the session's last
            reauthentication is stale — two distinct codes under the
            same status (`csrf_rejected`, `reauth_required`); the CSRF
            check always runs first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                csrf_rejected:
                  value:
                    error:
                      code: csrf_rejected
                      message: CSRF validation failed
                reauth_required:
                  value:
                    error:
                      code: reauth_required
                      message: recent reauthentication is required
  /sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: deleteSession
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Revoke one of the caller's own sessions
      description: >-
        Revokes exactly one session, which must belong to the caller AND
        be LIVE by the same rule `GET /sessions` excludes by (not
        revoked, not idle/absolute-expired, not a grace-dead rotation
        predecessor). Requires a RECENT reauthentication (see `DELETE
        /sessions`), checked BEFORE any row is touched.


        Also revokes the target's own rotation LINEAGE partner(s), if
        any: the session it was itself rotated from, and the session (if
        still live) that was rotated from it. This applies to any target,
        not only the caller's current session — a caller who sees both
        halves of a still-open rotation pair in their own device list
        must not be able to leave the other half live by revoking just
        one of the two rows.


        Clears the caller's own `__Host-session` cookie and sets
        `Clear-Site-Data` whenever the caller's OWN current session dies
        as part of this request — whether `id` named it directly, OR a
        DIFFERENT id was named and the caller's current session turned
        out to be THAT target's lineage partner (predecessor or
        successor). Revoking a session unrelated to the caller's own
        current one leaves both response artifacts, and the current
        session itself, untouched.


        An `id` that doesn't exist, belongs to a DIFFERENT user, is
        already revoked, is idle-expired, is absolute-expired, or is a
        grace-dead rotation predecessor all return the same `404` under
        the no-oracle contract — never a distinct `403` that would
        confirm the id exists for someone else, or a distinct `410`/`400`
        that would confirm it once existed but is merely dead.
      responses:
        "204":
          description: Revoked. No response body. Also clears
            `__Host-session` and sets `Clear-Site-Data` if the caller's
            own current session died as part of this request (directly,
            or via its rotation lineage — see the operation description).
          headers:
            Clear-Site-Data:
              schema:
                type: string
              example: '"cookies", "storage"'
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF validation failed, or recent reauthentication is
            required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                csrf_rejected:
                  value:
                    error:
                      code: csrf_rejected
                      message: CSRF validation failed
                reauth_required:
                  value:
                    error:
                      code: reauth_required
                      message: recent reauthentication is required
        "404":
          description: No live session with this id belongs to the caller
            (unknown id, already revoked, or belongs to someone else —
            indistinguishable by design).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: no such session
components:
  responses:
    AuthStartRateLimited:
      description: >-
        The start routes' own rate limit is exhausted. Anonymous sign-in
        `GET` starts are keyed by client IP. Authenticated link and
        reauthentication `POST` starts are keyed by `(account, client IP)`.
        Both are tighter than the whole-server default because each accepted
        start writes a database row. Carries `Retry-After` in whole seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Whole seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: too many requests; retry later
  schemas:
    Envelope:
      type: object
      description: Success response wrapper. `data` carries the
        operation-specific payload; individual operations refine its shape
        via `allOf`.
      required:
        - data
      properties:
        data: {}
    AuthStartResponse:
      type: object
      description: >-
        `POST /auth/{provider}/start`'s success envelope: the provider
        authorize URL the client navigates the browser to itself.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - authorizeUrl
          properties:
            authorizeUrl:
              type: string
              format: uri
              description: >-
                The provider's own authorize endpoint, carrying this
                transaction's `state` and PKCE challenge. Single use: it
                is bound to the `__Host-oauth-tx` cookie set on the same
                response, and both expire together after 10 minutes.
              example: https://accounts.google.com/o/oauth2/v2/auth?...
    Error:
      type: object
      description: Failure response wrapper.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code (e.g.
                `slug_taken`, `precondition_failed`).
              example: precondition_failed
            message:
              type: string
              description: Human-readable message; not intended to be
                parsed by clients.
              example: The resume was modified since you last loaded it.
    Revision:
      type: string
      pattern: "^[0-9]+$"
      description: >-
        A resume's revision number. Server-assigned, monotonically
        increasing, and stored as a Postgres bigint — serialized here as a
        **string** (not a JSON number) so TypeScript and Dart clients don't
        lose precision on 64-bit values. Appears in resource bodies (e.g.
        `"revision": "42"`) and is echoed in the `ETag` response header as
        `"r<revision>"` for use in a subsequent `If-Match`.
      example: "42"
    User:
      type: object
      description: A registered aboutme user's own account record (design
        spec §3 `users` table), as returned by `GET /me`.
      required:
        - id
        - email
        - name
        - avatarKey
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarKey:
          type: [string, "null"]
          description: Object-storage key for the user's avatar image, or
            `null` if none has been set.
      example:
        id: 018f5b6a-9a3e-7c21-8b1e-000000000001
        email: ada@example.com
        name: Ada Lovelace
        avatarKey: null
    Identity:
      type: object
      description: One linked OAuth provider identity. `GET /me` exposes
        only the provider itself —
        never the provider's own subject/user id, an internal correlation
        key with no reason to ever reach a client.
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [google, github, linkedin]
      example:
        provider: google
    SessionDevice:
      type: object
      description: One of the caller's own live sessions, as returned by
        `GET /sessions`. Explicitly
        revoked, idle-expired, absolute-expired, and grace-dead
        rotation-predecessor sessions are never included — see `GET
        /sessions`' own operation description for the full exclusion
        rule.
      required:
        - id
        - createdAt
        - lastSeenAt
        - ua
        - ip
        - current
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: RFC 3339, UTC (`Z` suffix).
        lastSeenAt:
          type: string
          format: date-time
          description: RFC 3339, UTC (`Z` suffix).
        ua:
          type: [string, "null"]
          description: The `User-Agent` header recorded when this session
            was issued, or `null` if none was sent.
        ip:
          type: [string, "null"]
          description: The client IP recorded when this session was issued,
            or `null` if none could be determined.
        current:
          type: boolean
          description: "`true` for exactly the one session the request
            itself is authenticated with."
      example:
        id: 018f5b6a-9a3e-7c21-8b1e-000000000002
        createdAt: "2026-08-01T12:00:00Z"
        lastSeenAt: "2026-08-02T09:30:00Z"
        ua: Mozilla/5.0 (Macintosh; ...)
        ip: 203.0.113.7
        current: true
    OAuthCallbackErrorCode:
      type: string
      description: >-
        The closed OAuth error vocabulary the web client handles. Callback
        rejection redirects use all values except `reauth_required`. A
        login callback redirects to `/login?error=<code>`; a link or
        reauthentication callback redirects to
        `/app/settings/sessions?error=<code>`. An unrecognized callback
        value is handled as `auth_failed`.


        `reauth_required` is included because the authenticated `POST
        /auth/{provider}/start?purpose=link` operation returns it in a JSON
        error. No `/start` operation redirects with an error query.


        - `auth_failed`: the generic code for every rejection not
          explicitly listed below (transaction invalid/expired/replayed,
          state mismatch, ID token verification failure, missing code,
          etc.) — deliberately no oracle distinguishing which check
          failed. For `purpose=link`/`reauth`, this also covers a
          `purpose=reauth` attempt against a provider identity that isn't
          already linked and the completing request having no valid session
          for the user who began the flow.

        - `email_not_verified`: the provider's own account has an
          unverified (or absent) email. `purpose=login` only — linking
          never requires a verified email.

        - `cancelled`: the visitor declined consent at the provider
          (`error=access_denied` echoed back on the callback, RFC 6749
          §4.1.2.1).

        - `email_already_registered`: `purpose=login` only. The verified
          email already belongs to an existing account reached via a
          DIFFERENT provider (or the same provider under a different
          identity) — no automatic cross-provider email merge
          (AC-AUTH-001). Carries an additional
          `&provider=<p>` query param naming the provider THIS callback is
          for (already public — it's the URL path) — never the existing
          account's own provider, which the response must not name (a
          targeted-phishing hint).

        - `identity_already_linked`: `purpose=link`/`reauth` only. The
          provider identity this callback resolved
          is already claimed by a DIFFERENT user than the one who started
          the flow. No row is mutated and no session is issued for either
          user. Kept distinct from `auth_failed` — unlike most rejections
          here — because the actor is authenticated and the condition is
          one they can act on.

        - `reauth_required`: `POST /auth/{provider}/start?purpose=link`
          only, never a callback query. The session is valid, but its last
          full OAuth login is more than 15 minutes old. The server checks
          this before creating a transaction. Session revocation endpoints
          use the same JSON error code so one prompt can handle each
          sensitive action.
      enum:
        - auth_failed
        - email_not_verified
        - cancelled
        - email_already_registered
        - identity_already_linked
        - reauth_required
  parameters:
    AuthPurpose:
      name: purpose
      in: query
      required: false
      description: >-
        Why this OAuth transaction is being started. `GET` serves only
        `login`, which is also the default. An absent or unrecognized value
        is treated as `login`; `link` and `reauth` are the only exceptions
        and return `405` with `Allow: POST`.


        - `login` (default): an ordinary, unauthenticated sign-in/
          registration attempt. Reachable from anywhere — a bookmarked or
          shared link, another site's "continue with aboutme" button —
          with no session, CSRF, or same-site requirement at all.

        - `link` / `reauth`: **not served by `GET`**. Both
          are `405` here, with `Allow: POST`, before any session read,
          database access, or cookie is set — see the `POST` operation on
          the same path, and `AuthLinkPurpose` below.


        The unconditional refusal prevents a cross-site page from chaining
        reauthentication and linking through browser navigations. Privileged
        starts use the CSRF-protected `POST` operation instead.
      schema:
        type: string
        enum: [login]
        default: login
      example: login
    AuthLinkPurpose:
      name: purpose
      in: query
      required: true
      description: >-
        Which privileged flow `POST /auth/{provider}/start` is beginning
        for the caller's own already-authenticated account. Required, with
        no default: this route serves exactly these two, and substituting
        one would return an authorize URL for a flow the caller did not
        ask for.


        - `link`: attach this provider identity to the caller's account.
          Additionally requires a session whose last full OAuth login
          (`reauthenticated_at`) is within the last 15 minutes, checked
          BEFORE any transaction row is created — `403 reauth_required`
          otherwise.

        - `reauth`: refresh the caller's own session's
          `reauthenticated_at` via a fresh round trip against an
          ALREADY-linked provider (the compensating control the long
          idle and absolute session timeouts require before a sensitive
          operation). Deliberately does NOT itself require a recent
          reauthentication — that would be circular, since its whole point
          is to establish one. What makes that safe is that this route is
          `csrfToken`-protected, so a cross-site page cannot make the
          request at all.
      schema:
        type: string
        enum: [link, reauth]
      example: link
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Optimistic-concurrency precondition, ETag form: `"r<revision>"`
        (quotes included, per RFC 9110). Required on every mutation of an
        existing resume. Resume creation has no prior revision and rejects an
        `If-Match` header. A mismatch returns `412 Precondition Failed` with
        the current revision/document — never `409` (see the write-safety
        section above).
      schema:
        type: string
        pattern: '^"r[0-9]+"$'
      example: '"r42"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID scoping this mutation to `(user, canonical
        operation identity, key)`. The operation identity contains the method,
        registered operation, and canonical concrete target values. Replaying
        the same scoped key with a matching semantic request fingerprint
        returns the original stored response; a different fingerprint is
        rejected as a domain conflict.
      schema:
        type: string
        format: uuid
      example: 018f0f3e-9e3a-7000-8000-000000000001
    SessionID:
      name: id
      in: path
      required: true
      description: A session's id (`sessions.id`, `uuidv7`).
      schema:
        type: string
        format: uuid
      example: 018f5b6a-9a3e-7c21-8b1e-000000000002
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: >-
        Server-side opaque session token: `httpOnly`,
        `Secure`, `SameSite=Lax`, no `Domain` attribute (`__Host-`
        prefix). Never a JWT — a revocable, Postgres-backed session row.
        Every non-OAuth-redirect operation in the `auth` tag requires
        this.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Synchronizer CSRF token:
        `base64url` (no padding) encoding of the authenticated session's
        own CSRF secret, obtained from `GET /me`'s `csrfToken` field —
        the only place it is ever returned — and required, alongside
        `sessionCookie`, on every mutating cookie-authenticated request
        (together with `SameSite=Lax` and an exact `Origin`/`Referer`
        check). Declared together with `sessionCookie` (AND, not OR) on
        every mutating operation in the `auth` tag.
