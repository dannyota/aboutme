      summary: Upload or replace the resume photo
      description: >-
        Accepts `multipart/form-data` with exactly one raw part named `file`.
        The request is capped at 2,162,688 bytes and the file part at
        2,097,152 bytes; either overflow is `413 media_too_large`, never
