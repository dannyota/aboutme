    get:
      operationId: getResumePhoto
      tags: [resumes, media]
      security:
        - sessionCookie: []
      summary: Read the resume photo's normalized bytes
      description: >-
        Streams the stored normalized JPEG or PNG to the owner. Objects are
        private: existence never grants access, and every read passes the
        ownership check first (ADR 0019).


        The strong `ETag` is derived from the immutable object key, so it
        changes only when the photo is replaced. `If-None-Match` accepts one
        well-formed strong tag: an exact match is `304` with no body, a
        different tag is `200`. This binary read is outside the wire-version
        contract and emits no schema-version header.
