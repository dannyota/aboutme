        "412":
          $ref: "#/components/responses/ResumeRevisionMismatch"
        "413":
          $ref: "#/components/responses/PhotoTooLarge"
        "415":
          $ref: "#/components/responses/PhotoTypeUnsupported"
        "422":
          $ref: "#/components/responses/PhotoInvalid"
        "428":
          $ref: "#/components/responses/ResumePreconditionRequired"
        "429":
          $ref: "#/components/responses/ResumeRateLimited"
        "500":
          $ref: "#/components/responses/ResumeInternalError"
        "503":
