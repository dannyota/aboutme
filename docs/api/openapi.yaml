    ResumeSummary:
      type: object
      description: >-
        One owned resume without its document: enough to list, name, and
        route to it. Publish state is included because the owner's list
        shows it; the public slug is null until the resume is published.
      required:
        - id
        - title
        - lng
        - revision
        - live
        - slug
        - downloadEnabled
        - seoGeoEnabled
        - schemaVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned resume id (`uuidv7`).
        title:
          type: string
          maxLength: 160
          description: Owner-visible title. Not public and not the slug.
        lng:
          type: string
          maxLength: 35
          description: Canonical BCP 47 language tag for the resume's
            content. Reads use `und` when stored metadata is absent, empty,
            invalid, or overlong.
        revision:
          $ref: "#/components/schemas/Revision"
        live:
          type: boolean
          description: Whether the resume is currently published.
        slug:
          type: [string, "null"]
          description: Globally unique public slug, or null when the resume
            has never been published. Resumes are the public entity; users
            are not.
        downloadEnabled:
          type: boolean
          description: Whether public download representations are enabled.
        seoGeoEnabled:
          type: boolean
          description: Whether this live resume participates in discovery.
        schemaVersion:
          type: integer
          minimum: 1
          description: Document version this response was emitted at. Equal
            to the `X-Resume-Schema-Version` response header.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 018f5b6a-9a3e-7c21-8b1e-000000000010
        title: Backend engineer
        lng: en
        revision: "42"
        live: true
        slug: ada-lovelace
        downloadEnabled: true
        seoGeoEnabled: true
        schemaVersion: 2
        createdAt: 2026-08-01T09:00:00Z
        updatedAt: 2026-08-11T18:20:00Z
    Resume:
      allOf:
        - $ref: "#/components/schemas/ResumeSummary"
        - type: object
          required: [document]
          properties:
            document:
              $ref: "#/components/schemas/ResumeDocument"
      description: A resume summary plus its whole document.
    ResumeDocument:
      type: object
      description: >-
        The resume document. Its shape is **not** restated here: it is
        governed by `packages/schema/resume.schema.json` at the version named
        by the `X-Resume-Schema-Version` header, and the generated client
        types come from `packages/schema/gen/ts`. Restating a 24-section,
        byte-bounded schema in this file would create a second source of
        truth for one contract and drift silently. This document owns the
        envelope, headers, statuses, and error shapes.
      example:
        schemaVersion: 2
    EntryUpsert:
      type: object
      description: >-
        One entry to create or replace. Identity is `entry.id`: an existing
        id replaces that entry in place and keeps its position, a new id
        appends. The entry's own shape is governed by
        `packages/schema/resume.schema.json` at the declared version.
      additionalProperties: false
      required: [entry]
      properties:
        entry:
          type: object
          description: The whole entry object, including its `id`.
      example:
        entry:
          id: 018f5b6a-9a3e-7c21-8b1e-0000000000a1
          title: Staff engineer
    SectionPatch:
      type: object
      description: >-
        A section's own metadata. Placement is never here: moving a section
        between columns or changing section order goes through
        `PATCH /resumes/{id}/structure` (ADR 0009).
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 80
          description: Owner-chosen heading. An empty string is an explicit
            draft value; absence leaves the field unchanged.
        iconKey:
          type: [string, "null"]
          maxLength: 64
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: Key from the renderer's closed icon map, or null to
            remove the optional stored field. An empty or unknown key is
            rejected; absence leaves the field unchanged.
        entryOrder:
          type: array
          description: A permutation of this section's existing entry ids.
            It reorders only; it cannot add or remove an entry.
          items:
            type: string
            format: uuid
      example:
        displayName: Experience
        iconKey: briefcase
    StructureCommand:
      description: >-
        One section-structure command. Commands are evaluated **in list
        order** against the result of the previous command, so a later
        command addresses the layout the earlier ones produced.


        Every `index` is a **zero-based** insertion position with a minimum
        of 0. A create into a target column of length `N` accepts `0..N`,
        where `N` appends. A move **removes the source key first** and then
        measures the target column, so a same-column move is bounded by the
        resulting length; `N` again appends. An index outside that bound is
        `422 document_invalid`; a non-integer index is `400
        request_invalid`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, key, sectionType, column, index]
          properties:
            op:
              const: createSection
            key:
              type: string
              maxLength: 36
            sectionType:
              type: string
              enum:
                - profile
                - work
                - education
                - skill
                - language
                - certificate
                - project
                - custom
            displayName:
              type: string
              maxLength: 80
            iconKey:
              type: string
              maxLength: 64
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            column:
              type: string
              enum: [main, sidebar]
            index:
              type: integer
              minimum: 0
        - type: object
          additionalProperties: false
          required: [op, key]
          properties:
            op:
              const: deleteSection
            key:
              type: string
              maxLength: 36
        - type: object
          additionalProperties: false
          required: [op, key, column, index]
          properties:
            op:
              const: moveSection
            key:
              type: string
              maxLength: 36
            column:
              type: string
              enum: [main, sidebar]
            index:
              type: integer
              minimum: 0
        - type: object
          additionalProperties: false
          required: [op, column, keys]
          properties:
            op:
              const: reorderColumn
            column:
              type: string
              enum: [main, sidebar]
            keys:
              type: array
              uniqueItems: true
              maxItems: 24
              items:
                type: string
                maxLength: 36
      example:
        op: moveSection
        key: skills
        column: sidebar
        index: 1
    CustomizationDelta:
      description: >-
        One customization change. `set` writes a value at an allowlisted
        path; `unset` removes it. Deltas apply in list order, so a later
        delta overwrites an earlier one on the same path. A path outside the
        fixed allowlist is `422 customization_path_denied`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, path, value]
          properties:
            op:
              const: set
            path:
              type: string
              description: Dotted allowlisted path inside `customization`,
                limited to 256 UTF-8 bytes by the server.
            value:
              not:
                type: "null"
              description: Non-null value governed by the resume schema at
                the selected path.
        - type: object
          additionalProperties: false
          required: [op, path]
          properties:
            op:
              const: unset
            path:
              type: string
              description: Dotted allowlisted path inside `customization`,
                limited to 256 UTF-8 bytes by the server.
      example:
        op: set
        path: font.family
        value: inter
    PersonalDetailsPatch:
      type: object
      additionalProperties: false
      description: >-
        The whole client-owned personal-details object at the declared wire
        version, governed by `packages/schema/resume.schema.json`. Sending it
        whole keeps the write idempotent and lets a field be cleared by
        omission.


        Only the client-writable top-level property names are repeated here;
        contract tests derive that list from every accepted schema version.
        Their value shapes remain schema-owned. `photo` is server-owned and
        rejected; the photo routes write it from a server-derived key.
      properties:
        fullName:
          description: Value governed by the declared resume schema version.
        headline:
          description: Value governed by the declared resume schema version.
        details:
          description: Value governed by the declared resume schema version.
      example:
        fullName: Ada Lovelace
        headline: Backend engineer
    PhotoCropPatch:
      type: object
      description: >-
        The crop-only photo command. It accepts no object key and no other
        photo field, preserves the key read inside the write transaction, and
        performs no object-store I/O.
      additionalProperties: false
      required: [crop]
      properties:
        crop:
          type: [object, "null"]
          description: >-
            The normalized crop rectangle, or `null` to clear it. Its bounds
            are governed by `resume.schema.json#/$defs/photoCrop`: `x` and
            `y` in `[0, 1]`, `width` and `height` in `(0, 1]`, all four
            required.
          required: [x, y, width, height]
          additionalProperties: false
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1
            width:
              type: number
              exclusiveMinimum: 0
              maximum: 1
            height:
              type: number
              exclusiveMinimum: 0
              maximum: 1
      example:
        crop:
          x: 0.1
          y: 0.05
          width: 0.8
          height: 0.8
    PasswordEmail:
      type: string
      maxLength: 254
      description: >-
        The account email in its canonical lowercase ASCII addr-spec form
        (5–254 bytes, no display name, comments, controls, surrounding
        space, or internationalized spelling).
      example: ada@example.com
    PasswordValue:
      type: string
      maxLength: 1024
      description: >-
        A password value. The raw JSON-decoded string is capped again by the
        server at 1,024 UTF-8 bytes before any normalization; the API never
        receives a confirmation value.
      example: correct horse battery staple
    PasswordToken:
      type: string
      minLength: 43
      maxLength: 43
      description: >-
        A single-use verification or reset token: exactly 43 unpadded
        base64url characters encoding 32 random bytes.
      example: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefg
    PasswordPolicyIssue:
      type: string
      enum: [length, common, breached]
      description: >-
        Closed reason code carried in a `password_invalid` rejection's
        `details.issue`. Never the rejected value.
    PasswordAccepted:
      type: object
      description: >-
        The fixed `202` success body shared by registration and
        forgot-password. Byte-identical for every account state and reveals
        no email ownership.
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted:
              type: boolean
      example:
        data:
          accepted: true
    PasswordRegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 400
          description: Registration name (1–100 code points after NFC).
        email:
          $ref: "#/components/schemas/PasswordEmail"
        password:
          $ref: "#/components/schemas/PasswordValue"
    PasswordVerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/PasswordToken"
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/PasswordEmail"
        password:
          $ref: "#/components/schemas/PasswordValue"
    PasswordForgotRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/PasswordEmail"
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          $ref: "#/components/schemas/PasswordToken"
        password:
          $ref: "#/components/schemas/PasswordValue"
    PasswordReauthRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/PasswordValue"
    PasswordSetRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/PasswordValue"

  parameters:
    AuthPurpose:
      name: purpose
      in: query
      required: false
      description: >-
        Why this OAuth transaction is being started. `GET` serves only
        `login`, which is also the default. An absent or unrecognized value
        is treated as `login`; `link` and `reauth` are the only exceptions
        and return `405` with `Allow: POST`.


        - `login` (default): an ordinary, unauthenticated sign-in/
          registration attempt. Reachable from anywhere — a bookmarked or
          shared link, another site's "continue with aboutme" button —
          with no session, CSRF, or same-site requirement at all.

        - `link` / `reauth`: **not served by `GET`**. Both
          are `405` here, with `Allow: POST`, before any session read,
          database access, or cookie is set — see the `POST` operation on
          the same path, and `AuthLinkPurpose` below.


        The unconditional refusal prevents a cross-site page from chaining
        reauthentication and linking through browser navigations. Privileged
        starts use the CSRF-protected `POST` operation instead.
      schema:
        type: string
        enum: [login]
        default: login
      example: login
    AuthReturnPath:
      name: next
      in: query
      required: false
      description: >-
        Same-origin relative path to open after a successful provider login.
        The server accepts at most 2,048 bytes, requires one leading `/`, and
        rejects a leading `//`, any URI scheme, malformed URL syntax, or a
        backslash. An absent or invalid value is bound as `/app/resumes` in the
        OAuth transaction. Link and reauthentication callbacks ignore it.
      schema:
        type: string
        maxLength: 2048
        pattern: '^/(?!/)[^\\]*$'
      example: /oauth/authorize?client_id=018f5b6a-9a3e-7c21-8b1e-000000000001
    AuthLinkPurpose:
      name: purpose
      in: query
      required: true
      description: >-
        Which privileged flow `POST /auth/{provider}/start` is beginning
        for the caller's own already-authenticated account. Required, with
        no default: this route serves exactly these two, and substituting
        one would return an authorize URL for a flow the caller did not
        ask for.


        - `link`: attach this provider identity to the caller's account.
          Additionally requires a session whose last full OAuth login
          (`reauthenticated_at`) is within the last 15 minutes, checked
          BEFORE any transaction row is created — `403 reauth_required`
          otherwise.

        - `reauth`: refresh the caller's own session's
          `reauthenticated_at` via a fresh round trip against an
          ALREADY-linked provider (the compensating control the long
          idle and absolute session timeouts require before a sensitive
          operation). Deliberately does NOT itself require a recent
          reauthentication — that would be circular, since its whole point
          is to establish one. What makes that safe is that this route is
          `csrfToken`-protected, so a cross-site page cannot make the
          request at all.
      schema:
        type: string
        enum: [link, reauth]
      example: link
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Optimistic-concurrency precondition, ETag form: `"r<revision>"`
        (quotes included, per RFC 9110). Required on every mutation of an
        existing resume. Resume creation has no prior revision and rejects an
        `If-Match` header. A mismatch returns `412 Precondition Failed` with
        the current revision/document — never `409` (see the write-safety
        section above).


        Singleton header: exactly one field line with one value. A repeated
        field line or a comma-folded value is `400 precondition_malformed`,
        never silently first-wins.
      schema:
        type: string
        pattern: '^"r[0-9]+"$'
      example: '"r42"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID scoping this mutation to `(user, canonical
        operation identity, key)`. The operation identity contains the method,
        registered operation, and canonical concrete target values. Replaying
        the same scoped key with a matching semantic request fingerprint
        returns the original stored response; a different fingerprint is
        rejected as a domain conflict.


        Singleton header: exactly one field line with one value. A repeated
        field line or a comma-folded value is `400 idempotency_key_invalid`,
        never silently first-wins.
      schema:
        type: string
        format: uuid
      example: 018f0f3e-9e3a-7000-8000-000000000001
    SessionID:
      name: id
      in: path
      required: true
      description: A session's id (`sessions.id`, `uuidv7`).
      schema:
        type: string
        format: uuid
      example: 018f5b6a-9a3e-7c21-8b1e-000000000002
    GrantID:
      name: grantId
      in: path
      required: true
      description: A connected agent grant's id (`oauth_grants.id`, `uuidv7`).
      schema:
        type: string
        format: uuid
      example: 018f5b6a-9a3e-7c21-8b1e-000000000030
    ResumeID:
      name: id
      in: path
      required: true
      description: A resume's id (`resumes.id`, `uuidv7`). A resume owned by
        another account answers exactly like a missing one.
      schema:
        type: string
        format: uuid
      example: 018f5b6a-9a3e-7c21-8b1e-000000000010
    PublicSlug:
      name: slug
      in: path
      required: true
      description: >-
        Public resume slug. The router applies this closed grammar, but a
        malformed, missing, private, renamed, deleted, tombstoned, or
        flag-disabled slug receives the same `404 public_not_found` response.
      schema:
        type: string
        minLength: 4
        maxLength: 30
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      example: ada-lovelace
    SectionKey:
      name: sectionKey
      in: path
      required: true
      description: A section's key inside the resume document's `content`
        map. Its path shape matches the released resume schema; malformed keys
        are `400 request_invalid`, while a well-formed unknown key is a `404
        resume_not_found`-shaped domain failure.
      schema:
        type: string
        minLength: 1
        maxLength: 36
        pattern: "^[a-z]+$|^[0-9a-f-]{36}$"
      example: experience
    EntryID:
      name: entryId
      in: path
      required: true
      description: An entry's id inside the addressed section.
      schema:
        type: string
        format: uuid
      example: 018f5b6a-9a3e-7c21-8b1e-0000000000a1
    SchemaVersionHeader:
      name: X-Resume-Schema-Version
      in: header
      required: false
      description: >-
        The resume document version this request speaks. Absent means the
        server's current version. It appears on every JSON resume read and
        every mutation, including bodyless deletes, because a mutation
        resolves it into its idempotency fingerprint. The binary photo read
        is outside this contract.


        A value outside the accepted set is `400
        unsupported_schema_version` with `details.acceptedVersions`.


        Singleton header: exactly one field line with one value. A repeated
        field line or a comma-folded value is `400
        unsupported_schema_version`, never
        silently first-wins.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "2"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        Conditional representation read. Owner photo and public routes accept
        exactly one well-formed strong entity tag: an exact match returns
        `304` with no body, while a different tag returns `200` and the
        selected bytes.


        Singleton header: a repeated field line, a comma-folded list, a weak
        tag, or `*` is `400 request_invalid`. This route deliberately does
        not implement multi-tag negotiation.
      schema:
        type: string
      example: '"p-3f2a91c8"'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: >-
        Server-side opaque session token: `httpOnly`,
        `Secure`, `SameSite=Lax`, no `Domain` attribute (`__Host-`
        prefix). Never a JWT — a revocable, Postgres-backed session row.
        Every non-OAuth-redirect operation in the `auth` tag requires
        this.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Synchronizer CSRF token:
        `base64url` (no padding) encoding of the authenticated session's
        own CSRF secret, obtained from `GET /me`'s `csrfToken` field —
        the only place it is ever returned — and required, alongside
        `sessionCookie`, on every mutating cookie-authenticated request
        (together with `SameSite=Lax` and an exact `Origin`/`Referer`
        check). Declared together with `sessionCookie` (AND, not OR) on
        every mutating operation in the `auth` tag.
