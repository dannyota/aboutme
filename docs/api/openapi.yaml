        - $ref: "#/components/parameters/AuthLinkPurpose"
      responses:
        "200":
          description: The authorize URL to navigate the browser to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStartResponse"
              example:
                data:
                  authorizeUrl: https://www.linkedin.com/oauth/v2/authorization?...
        "400":
          description: >-
            `purpose` was absent or was something other than `link` or
            `reauth`. This route serves exactly those two — a login start
            is the `GET`'s job — and never substitutes a default, which
            would hand back an authorize URL for a flow the caller did not
            ask for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: bad_request
                  message: purpose must be link or reauth
        "401":
          description: No valid `__Host-session` cookie. Clears the cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: session_required
                  message: a valid session is required
        "403":
          description: >-
            Either the CSRF chain rejected the request (missing/mismatched
            `Origin`, missing/wrong `csrfToken`) or — `purpose=link` only —
            the session's last full OAuth login is more than 15 minutes
            old. The reauth check runs BEFORE any transaction row is
            created, so a stale caller never gets a live transaction
            handle. `purpose=reauth` has no such gate: its whole point is
            to establish recency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                csrf_rejected:
                  summary: Failed the CSRF chain
                  value:
                    error:
                      code: csrf_rejected
                      message: CSRF validation failed
                reauth_required:
                  summary: "purpose=link, stale reauth window"
                  value:
                    error:
                      code: reauth_required
                      message: recent reauthentication is required
        "429":
          $ref: "#/components/responses/AuthStartRateLimited"
  /auth/linkedin/callback:
    get:
      operationId: getAuthLinkedInCallback
      tags: [auth]
      security: []
      summary: Complete "Sign in with LinkedIn"
      description: >-
        Consumes the pending OAuth transaction (`__Host-oauth-tx`
        cookie), exchanges the authorization code (PKCE), verifies the ID
        token (issuer/audience/signature/expiry, plus the OIDC nonce), and
        resolves the local user per `purpose`, exactly like `GET
        /auth/google/callback` — see that
        operation's own description for the full `purpose=login` vs
        `purpose=link`/`reauth` behavior and redirect targets, with ONE
        LinkedIn-specific difference: `purpose=login`'s registration path
        (an UNKNOWN identity only — an existing identity's repeat login
        never re-checks email at all, matching every other provider)
        requires a verified email exactly like Google, EXCEPT LinkedIn's
        OIDC `email`/`email_verified` claims are OPTIONAL — an absent
        `email_verified` claim is never treated as true (AC-AUTH-002).
        `purpose=link`/`reauth` never checks email; linking an existing
        account remains allowed without a verified email.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: The provider's authorization code (RFC 6749 §4.1.2).
            Absent on a provider-signaled rejection (see `error` below).
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Must match the pending transaction's own `state` (RFC
            6749 §10.12) or the callback is rejected with `auth_failed`.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Set by the PROVIDER itself when the visitor declines
            consent — `error=access_denied`, mapped to this server's own
            `cancelled` code.
      responses:
        "302":
          description: Always redirects — see the operation description for
            the success/rejected branches.
          headers:
            Location:
              schema:
                type: string
                format: uri
              example: https://aboutme.vn/login?error=auth_failed

  # ---- Session-authenticated JSON API (AC-AUTH-005) -----------------------
  /me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - sessionCookie: []
      summary: The caller's own account, a fresh CSRF token, and linked
        providers
      description: >-
        Returns the authenticated caller's own user record, a fresh CSRF
        token, and which OAuth providers they have a linked identity for.
        Identities are ordered by `(created_at, id)`, oldest first, so clients
        have a stable default reauthentication provider even when timestamps
        are equal.


        The CSRF token is returned **only** here, in the response body —
        never in a header, cookie, URL, or log line. A client must echo it
        back on the `X-CSRF-Token`
        header for every mutating cookie-authenticated request (see the
        `csrfToken` security scheme).
      responses:
        "200":
          description: The caller's own account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user, csrfToken, identities]
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          csrfToken:
                            type: string
                            description: base64url (no padding) encoding of
                              this session's own CSRF secret. Echo back
                              on `X-CSRF-Token` for every mutating
                              request.
                            example: kQ2f9Z3sV1n8LhTt7v0wYb-example
                          identities:
                            type: array
                            description: >-
                              Linked identities ordered by `(created_at, id)`,
                              oldest first.
                            items:
                              $ref: "#/components/schemas/Identity"
              example:
                data:
                  user:
                    id: 018f5b6a-9a3e-7c21-8b1e-000000000001
                    email: ada@example.com
                    name: Ada Lovelace
                    avatarKey: null
                    hasPassword: false
                  csrfToken: kQ2f9Z3sV1n8LhTt7v0wYb-example
                  identities:
                    - provider: google
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: session_required
                  message: a valid session is required
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Log out (revoke the current session)
      description: >-
        Revokes the caller's own current session, clears the
        `__Host-session` cookie, and sets `Clear-Site-Data: "cookies",
        "storage"` so the browser drops any cached credential-derived
        state too.
      responses:
        "204":
          description: Logged out. No response body — session endpoints
            return `204`, not a `{"data":...}` envelope, on a successful
            mutation.
          headers:
            Clear-Site-Data:
              schema:
                type: string
              example: '"cookies", "storage"'
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF validation failed (Origin/Referer, Content-Type,
            or token mismatch — collapsed into one no-oracle code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: csrf_rejected
                  message: CSRF validation failed
  /sessions:
    get:
      operationId: getSessions
      tags: [auth]
      security:
        - sessionCookie: []
      summary: List the caller's own live sessions (device list)
      description: >-
        Every LIVE session belonging to the caller. A session is excluded
        the moment ANY of these become true: it is explicitly revoked; it
        is idle-expired (no activity for 30 days); it is absolute-expired
        (90 days since it was first issued, regardless of activity); or it
        is a grace-dead rotation predecessor (a superseded session row
        whose rotation grace window has already elapsed but isn't itself
        marked revoked).
      responses:
        "200":
          description: The caller's own live sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SessionDevice"
              example:
                data:
                  - id: 018f5b6a-9a3e-7c21-8b1e-000000000002
                    createdAt: "2026-08-01T12:00:00Z"
                    lastSeenAt: "2026-08-02T09:30:00Z"
                    ua: Mozilla/5.0 (Macintosh; ...)
                    ip: 203.0.113.7
                    current: true
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSessions
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Log out everywhere (revoke every live session)
      description: >-
        Revokes every one of the caller's own live sessions, clears the
        current `__Host-session` cookie, and sets `Clear-Site-Data:
        "cookies", "storage"`.


        Requires a RECENT reauthentication — the session's last full
        OAuth login within the last 15 minutes — rejected with `403
        reauth_required` otherwise, checked BEFORE any session row is
        touched.
      responses:
        "204":
          description: Logged out everywhere. No response body.
          headers:
            Clear-Site-Data:
              schema:
                type: string
              example: '"cookies", "storage"'
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF validation failed, OR the session's last
            reauthentication is stale — two distinct codes under the
            same status (`csrf_rejected`, `reauth_required`); the CSRF
            check always runs first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                csrf_rejected:
                  value:
                    error:
                      code: csrf_rejected
                      message: CSRF validation failed
                reauth_required:
                  value:
                    error:
                      code: reauth_required
                      message: recent reauthentication is required
  /sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: deleteSession
      tags: [auth]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Revoke one of the caller's own sessions
      description: >-
        Revokes exactly one session, which must belong to the caller AND
        be LIVE by the same rule `GET /sessions` excludes by (not
        revoked, not idle/absolute-expired, not a grace-dead rotation
        predecessor). Requires a RECENT reauthentication (see `DELETE
        /sessions`), checked BEFORE any row is touched.


        Also revokes the target's own rotation LINEAGE partner(s), if
        any: the session it was itself rotated from, and the session (if
        still live) that was rotated from it. This applies to any target,
        not only the caller's current session — a caller who sees both
        halves of a still-open rotation pair in their own device list
        must not be able to leave the other half live by revoking just
        one of the two rows.


        Clears the caller's own `__Host-session` cookie and sets
        `Clear-Site-Data` whenever the caller's OWN current session dies
        as part of this request — whether `id` named it directly, OR a
        DIFFERENT id was named and the caller's current session turned
        out to be THAT target's lineage partner (predecessor or
        successor). Revoking a session unrelated to the caller's own
        current one leaves both response artifacts, and the current
        session itself, untouched.


        An `id` that doesn't exist, belongs to a DIFFERENT user, is
        already revoked, is idle-expired, is absolute-expired, or is a
        grace-dead rotation predecessor all return the same `404` under
        the no-oracle contract — never a distinct `403` that would
        confirm the id exists for someone else, or a distinct `410`/`400`
        that would confirm it once existed but is merely dead.
      responses:
        "204":
          description: Revoked. No response body. Also clears
            `__Host-session` and sets `Clear-Site-Data` if the caller's
            own current session died as part of this request (directly,
            or via its rotation lineage — see the operation description).
          headers:
            Clear-Site-Data:
              schema:
                type: string
              example: '"cookies", "storage"'
        "401":
          description: Missing or invalid `__Host-session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF validation failed, or recent reauthentication is
            required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                csrf_rejected:
                  value:
                    error:
                      code: csrf_rejected
                      message: CSRF validation failed
                reauth_required:
                  value:
                    error:
                      code: reauth_required
                      message: recent reauthentication is required
        "404":
          description: No live session with this id belongs to the caller
            (unknown id, already revoked, or belongs to someone else —
            indistinguishable by design).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: no such session
  # ---- Session-authenticated OAuth consent and grant management ----------
  /oauth/consent:
    get:
      operationId: getOAuthConsent
      tags: [OAuthAgentAccess]
      security:
        - sessionCookie: []
      summary: Read the pending agent consent request
      description: >-
        Re-validates the complete authorization request against the registered
        client and returns only its display name and requested scope list.
        `state` is echoed by the decision operation, but is never logged or
        returned as a separate response field. This read is safe and does not
        require CSRF.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: redirect_uri
          in: query
          required: true
          description: Must exactly match one redirect URI registered by the client.
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: scope
          in: query
          required: true
          description: >-
            One or both account-wide scopes. This is a closed list, not free
            text. Multiple scopes use OAuth's canonical space-delimited form.
          style: form
          schema:
            type: string
            enum:
              - resumes:read
              - resumes:write
              - resumes:read resumes:write
        - name: state
          in: query
          required: false
          description: Opaque client state, bounded to 512 bytes and echoed on redirect.
          schema:
            type: string
            maxLength: 512
        - name: code_challenge
          in: query
          required: true
          description: RFC 7636 S256 challenge (43 base64url characters).
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: "^[A-Za-z0-9_-]{43}$"
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
      responses:
        "200":
          description: Registered client name and requested scopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthConsentResponse"
              example:
                data:
                  clientName: Resume assistant
                  scopes: [resumes:read]
        "400":
          description: The authorization request is malformed or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: request_invalid
                  message: authorization request is invalid
        "401":
          description: Missing or invalid session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: session_required
                  message: a valid session is required
        "404":
          description: The client or registered redirect URI was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: no such authorization client
    post:
      operationId: postOAuthConsentDecision
      tags: [OAuthAgentAccess]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Approve or deny agent consent
      description: >-
        Re-validates every authorization request field against the registered
        client before acting. Approval records the account-wide grant and
        redirects to the exact registered redirect URI with the authorization
        result; denial redirects there with `error=access_denied`. The
        redirect carries the submitted `state` when present. No token or code
        is returned as a response field.
      requestBody:
        required: true
        description: Strict JSON request, no unknown or duplicate fields, ≤ 4,096 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthConsentDecisionRequest"
      responses:
        "200":
          description: Redirect destination for the consent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthConsentDecisionResponse"
              example:
                data:
                  redirectTo: https://agent.example/callback?state=opaque
        "400":
          description: The authorization request or decision body is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: request_invalid
                  message: authorization request is invalid
        "401":
          description: Missing or invalid session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: session_required
                  message: a valid session is required
        "403":
          description: CSRF or exact-Origin validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: csrf_rejected
                  message: CSRF validation failed
        "404":
          description: The client or registered redirect URI was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: no such authorization client
        "413":
          description: Request body exceeds 4,096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: body_too_large
                  message: request body is too large
        "415":
          $ref: "#/components/responses/PasswordMediaTypeUnsupported"
  /me/agents:
    get:
      operationId: listAgentGrants
      tags: [OAuthAgentAccess]
      security:
        - sessionCookie: []
      summary: List connected agent grants
      description: >-
        Lists every live agent grant for the authenticated account. The
        response contains display metadata and timestamps only; it never
        contains token, authorization-code, or other credential material.
      responses:
        "200":
          description: The caller's live connected-agent grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAgentGrantsResponse"
              example:
                data:
                  grants:
                    - id: 018f5b6a-9a3e-7c21-8b1e-000000000030
                      clientName: Resume assistant
                      scopes: [resumes:read, resumes:write]
                      createdAt: "2026-09-01T09:00:00Z"
                      lastUsedAt: null
        "401":
          description: Missing or invalid session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: session_required
                  message: a valid session is required
  /me/agents/{grantId}:
    parameters:
      - $ref: "#/components/parameters/GrantID"
    delete:
      operationId: revokeAgentGrant
      tags: [OAuthAgentAccess]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Revoke a connected agent grant
      description: >-
        Revokes the live grant and its token family. Unknown, already revoked,
        or foreign grant IDs all return the same 404 response and are not
        distinguishable.
      responses:
        "204":
          description: Grant revoked. No response body.
        "401":
          description: Missing or invalid session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: session_required
                  message: a valid session is required
        "403":
          description: CSRF or exact-Origin validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: csrf_rejected
                  message: CSRF validation failed
        "404":
          description: No live grant with this ID belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: no such agent grant
  /resumes:
    get:
      operationId: listResumes
      tags: [resumes]
      security:
        - sessionCookie: []
      summary: List the caller's own resumes
      description: >-
        Returns the caller's own resumes as summaries: identity, title,
        language, revision, publish state, and timestamps. The resume
        document is deliberately absent — a list view never pays for up to
        three 512 KB documents. Fetch one document with
        `GET /resumes/{id}`.


        Ordering is `(created_at, id)`, oldest first, so a client has a
        stable list across equal timestamps. A caller with no resumes gets
        an empty array, never `404`.
      parameters:
        - $ref: "#/components/parameters/SchemaVersionHeader"
      responses:
        "200":
          description: The caller's own resume summaries, oldest first.
          headers:
            X-Resume-Schema-Version:
              $ref: "#/components/headers/EmittedSchemaVersion"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ResumeSummary"
              example:
                data:
                  - id: 018f5b6a-9a3e-7c21-8b1e-000000000010
                    title: Backend engineer
                    lng: en
                    revision: "42"
                    live: true
                    slug: ada-lovelace
                    downloadEnabled: true
                    seoGeoEnabled: true
                    schemaVersion: 2
                    createdAt: 2026-08-01T09:00:00Z
                    updatedAt: 2026-08-11T18:20:00Z
        "400":
          $ref: "#/components/responses/ResumeListBadRequest"
        "401":
          $ref: "#/components/responses/ResumeUnauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResumes"
        "429":
          $ref: "#/components/responses/ResumeRateLimited"
        "500":
          $ref: "#/components/responses/ResumeInternalError"
    post:
      operationId: createResume
      tags: [resumes]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Create a resume
      description: >-
        Creates one resume owned by the caller and returns it with its
        starting document. The body carries `title`, optional `lng`, and an
        optional seed `document` at the declared wire version. The revision,
        slug, publish state, and any photo metadata are server-owned.


        A create has no prior revision, so it takes `Idempotency-Key` and
        rejects `If-Match` with `400 precondition_not_supported` rather than
        ignoring it (ADR 0016, plan D6). The per-account resume cap is a
        domain conflict: the fourth create returns `409
        resume_cap_exceeded`, never `412`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SchemaVersionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 160
                  description: Owner-visible resume title, bounded in code
                    points by the numeric budgets.
                lng:
                  type: [string, "null"]
                  maxLength: 35
                  description: BCP 47 language tag for the resume's content.
                    Absent, null, or empty means undetermined (`und`).
                document:
                  allOf:
                    - $ref: "#/components/schemas/ResumeDocument"
                    - type: object
                      properties:
                        personalDetails:
                          type: object
                          properties:
                            photo: {}
                          not:
                            properties:
                              photo: {}
                            required: [photo]
                  description: >-
                    Optional seed document at the declared wire version.
                    `personalDetails.photo` is rejected because only the
                    server-owned photo routes may create photo metadata.
            example:
              title: Backend engineer
              lng: en
      responses:
        "201":
          description: The created resume, at its first revision.
          headers:
            Location:
              description: Canonical relative URL of the created resume.
              schema:
                type: string
              example: /api/v1/resumes/018f5b6a-9a3e-7c21-8b1e-000000000010
            ETag:
              $ref: "#/components/headers/ParentETag"
            X-Resume-Schema-Version:
              $ref: "#/components/headers/EmittedSchemaVersion"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Resume"
              example:
                data:
                  id: 018f5b6a-9a3e-7c21-8b1e-000000000010
                  title: Backend engineer
                  lng: en
                  revision: "1"
                  live: false
                  slug: null
                  downloadEnabled: false
                  seoGeoEnabled: false
