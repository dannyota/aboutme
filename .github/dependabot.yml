version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directories:
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      gomod:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # apps/server/cmd/mcp-workflow/evidence.go and scripts/mcp-owner-workflow.sh
      # pin the SDK evidence label; update both with the SDK.
      - dependency-name: github.com/modelcontextprotocol/go-sdk
  - package-ecosystem: gomod
    directories:
      - /deploy/caddy/production/build
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      gomod:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: github.com/caddyserver/caddy/v2
  - package-ecosystem: npm
    directories:
      - "/"
      - /packages/schema
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directories:
      - /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: playwright
      - dependency-name: playwright-core
      - dependency-name: typescript
      - dependency-name: pdfjs-dist
  - package-ecosystem: npm
    directories:
      - /deploy/dev-https-browser
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: playwright
      - dependency-name: playwright-core
      - dependency-name: "@axe-core/playwright"
