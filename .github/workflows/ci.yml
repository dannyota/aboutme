name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA of the trusted ancestor commit to compare with the candidate.
        required: true
        type: string

# Least-privilege default for every job: the workflow only reads the repo. No
# job writes back to it, and semgrep ci authenticates to its own platform via
# SEMGREP_APP_TOKEN rather than GITHUB_TOKEN.
permissions:
  contents: read

# A newer push to the same ref supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs docs-lint, lengths-check, and every operational-test lane (fast,
  # deploy-script, and browser-image/MCP-owner-workflow) in one job: none of
  # them needs a database, Go, or a browser, so splitting them across jobs
  # only added queueing and duplicate checkouts. Each check after the first
  # runs under `if: ${{ !cancelled() }}` so one failure does not hide another.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/dev-https-browser/package-lock.json
      - run: npm ci
      - if: ${{ !cancelled() }}
        run: make docs-lint
      - if: ${{ !cancelled() }}
        run: make lengths-check
      - if: ${{ !cancelled() }}
        run: make operational-test-fast
      - if: ${{ !cancelled() }}
        run: make operational-test-deploy
      - if: ${{ !cancelled() }}
        run: npm ci
        working-directory: deploy/dev-https-browser
      - if: ${{ !cancelled() }}
        run: make operational-test-browser

  # dev-https-test.sh --static runs unsharded here: scripts/dev-https-test.sh
  # still supports DEV_HTTPS_TEST_SHARD=i/n and the CHECKS-array completeness
  # check, but the 20-concurrent-job budget this workflow already spends on
  # the browser-proof shards leaves no room for a matrix here too.
  docs-dev-https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make operational-test-dev-https

  # The append-only migration and released-schema guards, gitleaks, and the
  # schema/API/Tofu contract gates, in one job: the first three need full
  # history (fetch-depth 0), which is harmless for the rest, and none of the
  # six needs more than its own setup.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject modified or deleted migrations
        env:
          # Passed through the environment rather than interpolated directly
          # into the script: `${{ }}` expansion happens before the shell sees
          # the line, so event-derived values belong in env: as a rule, even
          # for a commit SHA like this one.
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
              ! git cat-file -e "$BASE_SHA^{commit}" ||
              ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
              echo "Manual CI requires base_sha to be a full ancestor commit SHA." >&2
              exit 1
            fi
          fi
          bash scripts/check-migrations-append-only.sh --commits "$BASE_SHA" HEAD
      # Released resume schemas are immutable (docs/design/data.md, "Document
      # versions"): a released resume.v<N>.schema.json is the contract stored
      # documents and adjacent-version converters are pinned to. A one-time,
      # owner-approved documentation-citation rewrite is hash-pinned below so
      # it cannot authorize any other v1 bytes. The same name-status logic as
      # the migration guard above, over a different immutable artifact.
      # packages/schema/test/released-append-only.test.ts proves each
      # rejected status against throwaway repositories and pins this
      # script's text.
      - if: ${{ !cancelled() }}
        name: Reject modified or deleted released schemas
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
              ! git cat-file -e "$BASE_SHA^{commit}" ||
              ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
              echo "Manual CI requires base_sha to be a full ancestor commit SHA." >&2
              exit 1
            fi
          fi
          if ! base=$(git rev-parse --verify --quiet "$BASE_SHA^{commit}") ||
            ! head=$(git rev-parse --verify --quiet "HEAD^{commit}"); then
            echo "Could not resolve released-schema comparison commits." >&2
            exit 1
          fi
          approved_old_v1_sha256="2da37bb75297fefe32a920e3fae960100f0a99236ba4dc21ef25ae6b3f61f13f"
          approved_new_v1_sha256="879858284bc3cb4092d1d671466a9c620e27abf134aecedce070b6f21e4e5866"
          # Compare the event base and candidate trees directly. A merge-base
          # diff can hide a released-schema reversion after rewritten history.
          if ! diff=$(git diff --name-status "$base" "$head" -- 'packages/schema/resume.v*.schema.json'); then
            echo "Could not compare released schemas with base." >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff" | grep -E '^(M|D|R|T)' || true)
          approved_v1_change=$(printf 'M\tpackages/schema/resume.v1.schema.json')
          if [ "$changed" = "$approved_v1_change" ]; then
            base_v1_sha256=$(git show "$base:packages/schema/resume.v1.schema.json" | sha256sum | cut -d ' ' -f 1)
            head_v1_sha256=$(git show "$head:packages/schema/resume.v1.schema.json" | sha256sum | cut -d ' ' -f 1)
            if [ "$base_v1_sha256" = "$approved_old_v1_sha256" ] && [ "$head_v1_sha256" = "$approved_new_v1_sha256" ]; then
              changed=""
            fi
          fi
          if [ -n "$changed" ]; then
            echo "Released schemas are immutable; only a new version file may be added:"
            echo "$changed"
            exit 1
          fi
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            packages/schema/package-lock.json
      - if: ${{ !cancelled() }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - if: ${{ !cancelled() }}
        name: Compute the Go cache week
        id: go-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # Restored and saved separately: a key ending in the week lets a
      # cache live past one run instead of being replaced by it, and
      # restore-keys fall back to the same job's older cache, then to
      # server's, before building from nothing.
      - if: ${{ !cancelled() }}
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-server-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
      - if: ${{ !cancelled() }}
        run: make schema-check
      - if: ${{ !cancelled() }}
        run: go build ./... && go vet ./... && go test ./...
        working-directory: packages/schema/gen/go
      - if: ${{ !cancelled() }}
        run: npm ci
      # The drift gate in `make api-check` runs the generator pinned in
      # apps/web. --ignore-scripts skips `nuxt prepare`; the gate needs only
      # the generator binary.
      - if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        run: make api-check
      - if: ${{ !cancelled() }}
        name: Install the pinned gitleaks (8.30.1)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        run: bash scripts/check-tool-versions.sh gitleaks
      - if: ${{ !cancelled() }}
        run: gitleaks detect --redact --no-banner
      - if: ${{ !cancelled() }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - if: ${{ !cancelled() }}
        run: tofu fmt -check -recursive deploy/aws
      - if: ${{ !cancelled() }}
        name: Validate each root
        run: |
          for root in deploy/aws/probe deploy/aws/bootstrap deploy/aws/prod; do
            tofu -chdir="$root" init -backend=false -input=false >/dev/null
            tofu -chdir="$root" validate
          done
      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  # The Go build/vet/test/lint gate, plus the sqlc-drift and route-table
  # gates: all three need only a Go toolchain and this job's own Go cache, so
  # folding them in removed two jobs' worth of checkout and cache overhead.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Compute the Go cache week
        id: go-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # Restored and saved separately: see the contracts job for why.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-server-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
      - run: make server-build
      - if: ${{ !cancelled() }}
        run: make server-vet
      - if: ${{ !cancelled() }}
        run: make server-test
      - if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/server
          version: v2.14.0
      - if: ${{ !cancelled() }}
        name: go mod tidy is a no-op
        run: |
          cd apps/server
          cp go.mod /tmp/go.mod.before && cp go.sum /tmp/go.sum.before
          go mod tidy
          diff /tmp/go.mod.before go.mod && diff /tmp/go.sum.before go.sum \
            || { echo "go.mod/go.sum are not tidy — run 'go mod tidy' in apps/server and commit"; exit 1; }
      - if: ${{ !cancelled() }}
        name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd apps/server && govulncheck ./...
      # Enforces the single-source-of-truth contract (ADR 0010): apps/server/
      # migrations/ is the only declared source for BOTH goose and sqlc's
      # generated data layer. Fails on any drift, including an untracked
      # generated file, so `make sqlc-check` uses `git status --porcelain`
      # rather than `git diff --exit-code`. This needs no database: sqlc
      # parses the migration files statically. sqlc stays pinned so the gate
      # flags real drift rather than generator formatting changes.
      - if: ${{ !cancelled() }}
        name: Install the pinned sqlc (v1.31.1)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        name: Assert sqlc is present and pinned
        run: sqlc version | grep -q 'v1.31.1'
      - if: ${{ !cancelled() }}
        run: make sqlc-check
      # Exercises the real deploy/caddy/Caddyfile route table (AC-OPS-005)
      # through a live caddy process fronting stub backends. Needs a caddy
      # binary but no database; pinned to 2.11.4 to match
      # deploy/compose.yml's caddy image tag. The release binary is faster
      # than `go install`ing and compiling caddy from source.
      - if: ${{ !cancelled() }}
        name: Install the pinned caddy (2.11.4)
        run: |
          curl -fsSL -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  /tmp/caddy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf /tmp/caddy.tar.gz -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        run: make route-table-test
        env:
          CADDY_BIN: caddy
      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  # Runs only ./internal/media/...'s slow normalization corpus test, in its
  # own job so the much shorter rest of the suite (server-resumeapi's own
  # server-test-s3 step) is not held behind it. server-test-s3's
  # SERVER_TEST_S3_RUN/SERVER_TEST_S3_SKIP select the complementary halves so
  # every test in the package runs exactly once between the two jobs.
  server-media-s3-corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Compute the Go cache week
        id: go-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-server-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
      - run: make test-s3-up
      - if: ${{ !cancelled() }}
        run: make server-test-s3
        env:
          SERVER_TEST_S3_RUN: ^TestNormalizeAcceptsFrozenCorpusDeterministically$
      - if: always()
        run: make test-s3-down
      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make web-test

  # Runs from its own checkout with no `needs:`: it uses no artifact web-test
  # or web-build produces, so it runs in parallel with them.
  web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ignore local E2E result roots
        run: |
          grep -qxF '/.dev/' .git/info/exclude ||
            printf '%s\n' '/.dev/' >> .git/info/exclude
      - name: Compare pinned browser baselines
        env:
          WEB_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -z "${UPDATE_GOLDEN+x}"
          test -z "${PLAYWRIGHT_UPDATE_SNAPSHOTS+x}"
          make web-e2e
      - name: Upload preview gap report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-gap-report
          path: .dev/web-e2e-results/*/*/compare/harness/preview-gap-report.json
          if-no-files-found: warn

  # make web-source-build first, from the untouched checkout: it builds the
  # Nuxt app from exactly the files the source manifest lists in an isolated
  # tarball, but requires a clean working tree and index
  # (scripts/web-e2e-source.sh), so it runs before any step below that
  # installs dependencies or writes build output. A stale manifest fails here
  # quickly and in parallel, instead of inside the Playwright image (and
  # without being masked behind a red web-test job). The rest of the Nuxt
  # build/lint/typecheck gate joins this job so its own checkout and Go-free
  # setup are not paid twice.
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Ignore local result roots
        run: |
          grep -qxF '/.dev/' .git/info/exclude ||
            printf '%s\n' '/.dev/' >> .git/info/exclude
      - run: make web-source-build
      - if: ${{ !cancelled() }}
        run: npm ci
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        run: make web-lint
      - if: ${{ !cancelled() }}
        run: make web-typecheck
      - if: ${{ !cancelled() }}
        run: make web-build
      - if: ${{ !cancelled() }}
        run: make web-no-eval-check

  # Builds the production Caddy image (compiling Caddy from source) and runs
  # its routing, origin-pull mTLS, client-IP trust, and maintenance-mode
  # tests, so a broken build or a config regression fails here instead of
  # first surfacing in release-images after a tag.
  caddy-prod-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make caddy-prod-test

  # Runs server-test-integration and the DB-backed suites in server-test-db
  # against the primary postgres service, so this job's suites run at the
  # same time as server-resumeapi's rather than one after the other. The
  # migration suite, the slowest of the database suites, runs here too but
  # against its own postgres-migrations service on a different port, so its
  # schema mutations never share a database with the other suites in this
  # job or with server-resumeapi.
  server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        # A throwaway database on tmpfs removes disk latency from the suites.
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres-migrations:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Compute the Go cache week
        id: go-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-server-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-integration
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      # Runs the DB-backed auth/store/user suites. Without this, a bare
      # `go test ./...` reports ok while every DSN-gated case skips, including
      # the acceptance tests for AC-AUTH-001..005 and AC-SEC-002. The target
      # sets REQUIRE_TEST_DB=1, so a missing DSN fails the job instead of
      # passing vacuously.
      - if: ${{ !cancelled() }}
        run: make server-test-db
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        name: Initialize database roles (migrations)
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5433/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make server-migration-test
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5433/aboutme?sslmode=disable
      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  # Runs the filesystem- and S3-backed resumeapi suites against their own
  # database service, so they run at the same time as server-integration's
  # suites rather than one after the other.
  server-resumeapi:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        # A throwaway database on tmpfs removes disk latency from the suites.
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Compute the Go cache week
        id: go-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-server-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-resumeapi
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make test-s3-up
      - if: ${{ !cancelled() }}
        run: make server-test-resumeapi-s3
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      # The rest of ./internal/media/..., skipping the two tests
      # server-media-s3-corpus already ran (its corpus test, and the budget
      # test neither job runs), so every test in the package runs exactly
      # once between the two jobs.
      - if: ${{ !cancelled() }}
        run: make server-test-s3
        env:
          SERVER_TEST_S3_SKIP: ^(TestNormalizationBudget|TestNormalizeAcceptsFrozenCorpusDeterministically)$
      - if: always()
        run: make test-s3-down
      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  # Runs the synthetic passkey and recovery journey against the exact
  # candidate through the repository HTTPS harness. This is the only hosted
  # observation of that flow: GitHub CI cannot see the deployed release
  # fence, the enrollment flag, live identity providers, or the production
  # origin, so a compile-only or Playwright-list result never substitutes for
  # this job. Uploaded evidence covers only fictional accounts.
  #
  # The enabled journey runs as two shards (second-factor.spec.ts
  # "Enabled-proof sharding"), each its own harness and its own evidence
  # file. primary-disabled's shard also runs the disabled-enrollment phase,
  # restoring the unsharded order (primary, then disabled) that phase's
  # first Vietnamese render depends on. passkey-browser-proof-coverage checks
  # every step is true, and the disabled phase ran once, across both shards'
  # evidence once every shard finishes.
  passkey-browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [primary-disabled, recovery-attempts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Starts pulling the pinned Playwright base image (the FROM reference
      # in deploy/dev-https-browser/Dockerfile) in the background so it
      # overlaps with setup and dev-https instead of blocking
      # dev-https-browser-image later.
      - name: Start pulling the pinned Playwright base image in the background
        run: |
          image=$(awk '/^FROM /{print $2; exit}' deploy/dev-https-browser/Dockerfile)
          status_file="$RUNNER_TEMP/playwright-base-pull.status"
          log_file="$RUNNER_TEMP/playwright-base-pull.log"
          rm -f "$status_file"
          nohup bash -c 'podman pull "$0" >"$1" 2>&1; echo $? >"$2"' \
            "$image" "$log_file" "$status_file" >/dev/null 2>&1 &
          disown
          {
            echo "PLAYWRIGHT_BASE_PULL_STATUS=$status_file"
            echo "PLAYWRIGHT_BASE_PULL_LOG=$log_file"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Compute the Go cache week
        id: go-cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-server-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
      # A go-installed caddy reports version "unknown", which the dev-https
      # tool check rejects, so this job uses the official release binary.
      - name: Install the pinned caddy (2.11.4)
        run: |
          curl -fsSL -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  /tmp/caddy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf /tmp/caddy.tar.gz -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      # Cached on apps/web/package-lock.json: `npx playwright install`
      # is a no-op on a hit and still verifies the pinned browser is present.
      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      # The harness preflight requires the pinned Chromium on the host.
      - name: Install web dependencies and the pinned Chromium
        run: npm ci && npx playwright install chromium
        working-directory: apps/web
      - run: make dev-https
      - name: Wait for the background base-image pull
        run: |
          for _ in $(seq 1 600); do
            [ -f "$PLAYWRIGHT_BASE_PULL_STATUS" ] && break
            sleep 1
          done
          [ -f "$PLAYWRIGHT_BASE_PULL_STATUS" ] || {
            echo "base image pull did not finish in time" >&2
            cat "$PLAYWRIGHT_BASE_PULL_LOG" >&2 || true
            exit 1
          }
          status=$(cat "$PLAYWRIGHT_BASE_PULL_STATUS")
          if [ "$status" -ne 0 ]; then
            echo "base image pull failed (exit $status)" >&2
            cat "$PLAYWRIGHT_BASE_PULL_LOG" >&2 || true
            exit 1
          fi
      - run: make dev-https-browser-image
      - run: make dev-https-passkey-check
        env:
          ABOUTME_PASSKEY_SHARD: ${{ matrix.shard }}
      - name: Upload passkey proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passkey-browser-proof-evidence-${{ matrix.shard }}
          path: .dev/native-https/evidence/passkey-*
          if-no-files-found: ignore
          retention-days: 14
          # .dev is a dot-directory; the upload action excludes those by
          # default and would silently archive nothing without this.
          include-hidden-files: true
      - name: Stop the HTTPS harness
        if: always()
        run: make dev-https-down
      - name: Stop the runner-local database
        if: always()
        run: make test-db-down
      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  # Each passkey-browser-proof shard's own evidence passed the closed-list
  # check in verify-evidence.mjs when its shard ran; this checks that the two
  # shards' evidence together still proves every step of the scenario, and
  # that the disabled-enrollment phase ran exactly once.
  passkey-browser-proof-coverage:
    needs: passkey-browser-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: passkey-browser-proof-evidence-*
          path: passkey-shard-evidence
      - run: |
          mapfile -t evidence_files < <(
            find passkey-shard-evidence \
              \( -name passkey-second-factor-proof.json \
                 -o -name passkey-enrollment-disabled-proof.json \) )
          [ "${#evidence_files[@]}" -gt 0 ] ||
            { echo "no shard evidence files were downloaded" >&2; exit 1; }
          node deploy/dev-https-browser/check-passkey-shard-coverage.mjs \
            "${evidence_files[@]}"

  # Runs the synthetic TOTP enrollment, verification, and recovery journey
  # against the exact candidate through the repository HTTPS harness. This is
  # the only hosted observation of that flow: GitHub CI cannot see the
  # deployed release fence, the enrollment flag, or the production origin, so
  # a compile-only or Playwright-list result never substitutes for this job.
  # Uploaded evidence covers only fictional accounts.
  #
  # The enabled journey runs as six shards (totp.spec.ts "Enabled-proof
  # sharding"), each its own harness and its own evidence file; primary alone
  # carries most of the account's own step count, so it is its own shard.
