name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for every job: the workflow only reads the repo. No
# job writes back to it, and semgrep ci authenticates to its own platform via
# SEMGREP_APP_TOKEN rather than GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: make docs-lint
      - run: make operational-test

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: packages/schema/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - run: make schema-check
      - run: go build ./... && go vet ./... && go test ./...
        working-directory: packages/schema/gen/go

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      # The drift gate in `make api-check` runs the generator pinned in
      # apps/web. --ignore-scripts skips `nuxt prepare`; the gate needs only
      # the generator binary.
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: make api-check

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - run: make server-build
      - run: make server-vet
      - run: make server-test
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/server
          version: v2.12.2
      - name: go mod tidy is a no-op
        run: |
          cd apps/server
          cp go.mod /tmp/go.mod.before && cp go.sum /tmp/go.sum.before
          go mod tidy
          diff /tmp/go.mod.before go.mod && diff /tmp/go.sum.before go.sum \
            || { echo "go.mod/go.sum are not tidy — run 'go mod tidy' in apps/server and commit"; exit 1; }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          cd apps/server && govulncheck ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make web-lint
      - run: make web-typecheck
      - run: make web-test
      - run: make web-build

  server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - run: make server-test-integration
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      # Runs the DB-backed auth/store/user suites. Without this, a bare
      # `go test ./...` reports ok while every DSN-gated case skips — the
      # acceptance tests for AC-AUTH-001..005 and AC-SEC-002 among them. The
      # target sets REQUIRE_TEST_DB=1, so a missing DSN fails the job instead
      # of passing vacuously.
      - run: make server-test-db
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-migration-test
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable

  migrations-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject modified or deleted migrations
        env:
          # Passed through the environment rather than interpolated directly
          # into the script: `${{ }}` expansion happens before the shell sees
          # the line, so event-derived values belong in env: as a rule, even
          # when — as here — they are commit SHAs.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if ! diff=$(git diff --name-status "$base"...HEAD -- apps/server/migrations); then
            echo "could not compare migrations with the base commit" >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff" | grep -E '^(M|D|R|T)' | grep -E '\.sql$' || true)
          if [ -n "$changed" ]; then
            echo "Applied migrations are immutable; only new files may be added:"
            echo "$changed"
            exit 1
          fi

  # Released resume schemas are immutable (docs/design/data.md, "Document
  # versions"): a released resume.v<N>.schema.json is the contract stored
  # documents and adjacent-version converters are pinned to. A one-time,
  # owner-approved documentation-citation rewrite is hash-pinned below so it
  # cannot authorize any other v1 bytes. Parallels
  # migrations-append-only above; the same name-status logic, a different
  # immutable artifact. packages/schema/test/released-append-only.test.ts
  # proves each rejected status against throwaway repositories and pins this
  # script's text.
  released-schema-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject modified or deleted released schemas
        env:
          # Passed through the environment rather than interpolated directly
          # into the script, for the same reason migrations-append-only does
          # it: `${{ }}` expansion happens before the shell sees the line.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          approved_old_v1_sha256="2da37bb75297fefe32a920e3fae960100f0a99236ba4dc21ef25ae6b3f61f13f"
          approved_new_v1_sha256="879858284bc3cb4092d1d671466a9c620e27abf134aecedce070b6f21e4e5866"
          if ! diff=$(git diff --name-status "$base"...HEAD -- 'packages/schema/resume.v*.schema.json'); then
            echo "Could not compare released schemas with base." >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff" | grep -E '^(M|D|R|T)' || true)
          approved_v1_change=$(printf 'M\tpackages/schema/resume.v1.schema.json')
          if [ "$changed" = "$approved_v1_change" ]; then
            base_v1_sha256=$(git show "$base:packages/schema/resume.v1.schema.json" | sha256sum | cut -d ' ' -f 1)
            head_v1_sha256=$(git show "HEAD:packages/schema/resume.v1.schema.json" | sha256sum | cut -d ' ' -f 1)
            if [ "$base_v1_sha256" = "$approved_old_v1_sha256" ] && [ "$head_v1_sha256" = "$approved_new_v1_sha256" ]; then
              changed=""
            fi
          fi
          if [ -n "$changed" ]; then
            echo "Released schemas are immutable; only a new version file may be added:"
            echo "$changed"
            exit 1
          fi

  # Token-free secret scanning runs for every push and pull request, including
  # forks where GitHub correctly withholds the connected Semgrep token.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - name: Install the pinned gitleaks (8.30.1)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check-tool-versions.sh gitleaks
      - run: gitleaks detect --redact --no-banner

  # Connected Semgrep: Code (SAST, Pro rules + cross-file analysis), Supply
  # Chain (SCA for Go + npm), and Secrets — all free for public repositories.
  # It replaces the separate osv-scanner job: Supply Chain covers dependency
  # CVEs across both ecosystems. It authenticates with SEMGREP_APP_TOKEN, which
  # GitHub withholds from FORK pull requests, so run it on push and same-repo
  # PRs only — a fork PR would have no token and fail.
  semgrep:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semgrep ci is diff-aware; give it history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.172.0
      - run: semgrep ci --no-suppress-errors
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Exercises the real deploy/caddy/Caddyfile route table (AC-OPS-005) through a
  # live caddy process fronting stub backends. Needs a caddy binary but no
  # database; pinned to 2.11.4 to match deploy/compose.yml's caddy image tag.
  route-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - name: Install the pinned caddy (2.11.4)
        run: |
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make route-table-test
        env:
          CADDY_BIN: caddy

  # Enforces the single-source-of-truth contract (ADR 0010): apps/server/
  # migrations/ is the only declared source for BOTH goose and sqlc's generated
  # data layer. Fails on any drift, including untracked generated files — which
  # is why `make sqlc-check` uses `git status --porcelain` rather than
  # `git diff --exit-code`.
  #
  # This needs no database and no DATABASE_URL: sqlc parses the migration files
  # statically. It replaces the former data-drift job, whose other half diffed
  # sql/schema.sql against the migrations through Atlas — with one source there
  # is nothing left to diff. sqlc stays pinned so the gate flags real drift
  # rather than generator formatting changes.
  sqlc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - name: Install the pinned sqlc (v1.31.1)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Assert sqlc is present and pinned
        run: sqlc version | grep -q 'v1.31.1'
      - run: make sqlc-check
