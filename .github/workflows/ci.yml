name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA of the merge base of fetched main and the candidate.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  preflight:
    name: CI preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base_sha: ${{ steps.comparison.outputs.base_sha }}
      selection: ${{ steps.selection.outputs.selection }}
      mutations: ${{ steps.selection.outputs.mutations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate comparison base and immutable artifacts
        id: comparison
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            base=$(bash scripts/check-migrations-append-only.sh --dispatch-base "$BASE_SHA" HEAD origin/main)
          elif [ "$GITHUB_EVENT_NAME" = schedule ] || { [ "$GITHUB_EVENT_NAME" = push ] && [[ "$base" =~ ^0+$ ]]; }; then
            base=HEAD
          fi
          bash scripts/check-migrations-append-only.sh --commits "$base" HEAD
          bash scripts/check-released-schemas.sh --commits "$base" HEAD
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select CI jobs
        id: selection
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(python3 -I scripts/ci-path-selection.py "$GITHUB_EVENT_NAME" "$BASE_SHA" 2>/dev/null) || result='full 1'
          case "$result" in
            'full 0'|'full 1'|'prose 0'|'prose 1'|'no-web 0'|'no-web 1') ;;
            *) result='full 1' ;;
          esac
          read -r selection mutations <<< "$result"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$selection" = no-web ]; then
            if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              selection=full
            # GitHub Apps can write check runs but cannot create workflow runs, so only a main push run of this workflow counts (GitHub Actions docs).
            elif ! runs=$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE_SHA&event=push&per_page=50" 2>/dev/null); then
              selection=full
              mutations=1
            elif ! verdict=$(printf '%s\n' "$runs" | jq -er 'if (.workflow_runs | type) != "array" then error("shape") elif any(.workflow_runs[]; type == "object" and .conclusion == "success" and .path == ".github/workflows/ci.yml" and .head_branch == "main" and .event == "push") then "green" else "other" end' 2>/dev/null); then
              selection=full
              mutations=1
            elif [ "$verdict" != green ]; then
              selection=full
            fi
          fi
          printf 'selection=%s\n' "$selection" >> "$GITHUB_OUTPUT"
          printf 'selection=%s\n' "$selection" >> "$GITHUB_STEP_SUMMARY"
          printf 'mutations=%s\n' "$mutations" >> "$GITHUB_OUTPUT"
          printf 'mutations=%s\n' "$mutations" >> "$GITHUB_STEP_SUMMARY"

  macos-tooling:
    name: macOS tooling
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and use Homebrew Bash and GNU coreutils
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bash coreutils
          bash_bin=$(brew --prefix --installed bash)/bin
          coreutils_bin=$(brew --prefix --installed coreutils)/libexec/gnubin
          "$bash_bin/bash" -c '((BASH_VERSINFO[0] >= 4))'
          printf '%s\n' "$bash_bin" "$coreutils_bin" >> "$GITHUB_PATH"
      - name: Watchdog process tests
        run: bash scripts/test/run-capped-test.sh
      - name: Static pre-push wrapper tests
        if: ${{ !cancelled() }}
        run: bash scripts/test/pre-push-test.sh
      - name: Production proof staging tests
        if: ${{ !cancelled() }}
        run: bash scripts/test/totp-production-proof-test.sh
      - uses: ./.github/actions/setup-go
        with:
          light: "true"
      - name: Native process supervision tests
        working-directory: apps/server
        run: go test ./internal/renderprocess

  vn-infra:
    name: VN infrastructure
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/vn-infra.yml

  contracts:
    name: Repository contracts
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            packages/schema/package-lock.json
            deploy/dev-https-browser/package-lock.json
      - if: ${{ !cancelled() }}
        id: go
        uses: ./.github/actions/setup-go
        with:
          light: "true"
      - if: ${{ !cancelled() }}
        timeout-minutes: 7
        run: |
          for attempt in 1 2; do
            timeout 180 npm ci && exit 0
            echo "npm ci attempt $attempt did not finish" >&2
            rm -rf node_modules
          done
          exit 1
      - if: ${{ !cancelled() }}
        run: make docs-lint
      - if: ${{ !cancelled() }}
        run: make docs-links-test
      - if: ${{ !cancelled() }}
        name: Check changed Markdown and affected indexes
        env:
          DOC_LINK_BASE: ${{ needs.preflight.outputs.base_sha }}
        run: make docs-links-check
      - if: ${{ !cancelled() }}
        run: make lengths-check
      - if: ${{ !cancelled() }}
        run: make schema-check
      - if: ${{ !cancelled() }}
        run: go build ./... && go vet ./... && go test ./...
        working-directory: packages/schema/gen/go
      - if: ${{ !cancelled() }}
        timeout-minutes: 7
        run: |
          for attempt in 1 2; do
            timeout 180 npm ci --ignore-scripts && exit 0
            echo "npm ci attempt $attempt did not finish" >&2
            rm -rf node_modules
          done
          exit 1
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        run: make api-check
      - if: ${{ !cancelled() }}
        name: Install the pinned gitleaks (8.30.1)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        run: bash scripts/check-tool-versions.sh gitleaks
      - if: ${{ !cancelled() }}
        run: gitleaks detect --redact --no-banner
      - if: ${{ !cancelled() }}
        id: ci-tools
        uses: ./.github/actions/ci-tools
      - name: Configure the provider mirror
        id: provider-mirror
        if: ${{ !cancelled() && steps.ci-tools.outcome == 'success' }}
        run: |
          cat >"$RUNNER_TEMP/ci-tools.tfrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path = "$RUNNER_TEMP/ci-tools/providers"
              include = ["registry.opentofu.org/*/*"]
            }
            direct {
              exclude = ["registry.opentofu.org/*/*"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/ci-tools.tfrc" >> "$GITHUB_ENV"
      # The mirror runs only after a verified load, so OpenTofu never starts
      # without it and never installs providers directly.
      - if: ${{ !cancelled() && steps.provider-mirror.outcome == 'success' }}
        uses: ./.github/actions/install-opentofu
      - if: ${{ !cancelled() && steps.provider-mirror.outcome == 'success' }}
        run: tofu fmt -check -recursive deploy/aws
      - if: ${{ !cancelled() && steps.provider-mirror.outcome == 'success' }}
        name: Validate each root
        run: |
          for root in deploy/aws/probe deploy/aws/bootstrap deploy/aws/prod; do
            tofu -chdir="$root" init -backend=false -input=false >/dev/null
            tofu -chdir="$root" validate
          done
      - if: ${{ !cancelled() }}
        name: npm audit (repository root)
        run: bash scripts/npm-audit.sh .
      - if: ${{ !cancelled() }}
        name: npm audit (apps/web)
        run: bash scripts/npm-audit.sh apps/web
      - if: ${{ !cancelled() }}
        name: npm audit (packages/schema)
        run: bash scripts/npm-audit.sh packages/schema
      - if: ${{ !cancelled() }}
        name: npm audit (deploy/dev-https-browser)
        run: bash scripts/npm-audit.sh deploy/dev-https-browser
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  operational:
    name: Operational tests
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/dev-https-browser/package-lock.json
      - if: ${{ !cancelled() }}
        name: Start the deploy-script static tests
        run: bash scripts/ci-background.sh start deploy-tests make operational-test-deploy
      - if: ${{ !cancelled() }}
        id: go
        uses: ./.github/actions/setup-go
        with:
          light: "true"
      - if: ${{ !cancelled() }}
        run: npm ci
      - if: ${{ !cancelled() }}
        run: make operational-test-fast
      - if: ${{ !cancelled() }}
        run: npm ci
        working-directory: deploy/dev-https-browser
      - if: ${{ !cancelled() }}
        run: make operational-test-browser
      - if: ${{ !cancelled() }}
        name: Wait for the deploy-script static tests
        run: bash scripts/ci-background.sh wait deploy-tests
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  dev-https-static:
    name: Dev HTTPS static (${{ matrix.shard }})
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run the dev-https static suite shard
        env:
          DEV_HTTPS_DIAGNOSTICS_ARTIFACT_DIR: ${{ runner.temp }}/dev-https-startup-diagnostics
          SHARD: ${{ matrix.shard }}
        run: make operational-test-dev-https DEV_HTTPS_TEST_SHARD="$SHARD/4"
      - name: Upload dev-https startup diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-https-startup-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/dev-https-startup-diagnostics/*.txt
          if-no-files-found: ignore
          retention-days: 14

  # The Go build/vet/test/lint gate, the sqlc-drift and route-table gates,
  # govulncheck, the media package's slow normalization corpus test (which
  # runs in the background beside the rest), and the deployment transparency
  # observer's own build/vet/test/lint/govulncheck (deploy/observer/README.md,
  # packages of the root Go module with no database, browser, or live AWS
  # access needed; its platform adapters and S3 publisher are tested against
  # httptest servers).
  #
  # govulncheck runs in source mode for apps/server, packages/schema/gen/go,
  # and deploy/observer in the root module, and for the separate Caddy build
  # module, which pins its own Caddy version. It fails only on a vulnerability
  # reachable from the scanned packages' own call graph, not on every
  # dependency with a known advisory. The module-level advisory GO-2026-5932
  # (x/crypto/openpgp; no fix exists) is known and not reachable. If it
  # reports as reachable, this job fails and the trace must be investigated,
  # not suppressed. Revisit by 2026-12-31: check for x/crypto dropping
  # openpgp.
  server:
    name: Server checks
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
      - run: make test-media-s3-up
      - name: Start the media corpus test
        env:
          SERVER_TEST_S3_RUN: ^TestNormalizeAcceptsFrozenCorpusDeterministically$
        run: bash scripts/ci-background.sh start media-corpus make server-test-media-s3
      - if: ${{ !cancelled() }}
        run: make server-build
      - if: ${{ !cancelled() }}
        name: Cross-compile the server for Darwin arm64
        working-directory: apps/server
        run: GOOS=darwin GOARCH=arm64 go build ./...
      - if: ${{ !cancelled() }}
        run: make server-vet
      - if: ${{ !cancelled() }}
        run: make server-test
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/ci-tools
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/install-golangci-lint
      - if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/server
          install-mode: none
      - if: ${{ !cancelled() }}
        name: go mod tidy is a no-op
        run: |
          cp go.mod /tmp/go.mod.before && cp go.sum /tmp/go.sum.before
          go mod tidy
          if ! diff /tmp/go.mod.before go.mod || ! diff /tmp/go.sum.before go.sum; then
            echo "go.mod/go.sum are not tidy: run 'go mod tidy' at the repository root and commit"
            exit 1
          fi
      - if: ${{ !cancelled() }}
        name: Install the pinned sqlc (v1.31.1)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        name: Assert sqlc is present and pinned
        run: sqlc version | grep -q 'v1.31.1'
      - if: ${{ !cancelled() }}
        run: make sqlc-check
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/install-caddy
      - if: ${{ !cancelled() }}
        run: make route-table-test
        env:
          CADDY_BIN: caddy
      - if: ${{ !cancelled() }}
        name: Install the pinned govulncheck (1.9.0)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        name: govulncheck apps/server
        run: govulncheck ./...
        working-directory: apps/server
      - if: ${{ !cancelled() }}
        name: govulncheck packages/schema/gen/go
        run: govulncheck ./...
        working-directory: packages/schema/gen/go
      - if: ${{ !cancelled() }}
        name: govulncheck deploy/caddy/production/build
        run: govulncheck ./...
        working-directory: deploy/caddy/production/build
      - if: ${{ !cancelled() }}
        name: observer build
        run: go build ./...
        working-directory: deploy/observer
      - if: ${{ !cancelled() }}
        name: observer vet
        run: go vet ./...
        working-directory: deploy/observer
      - if: ${{ !cancelled() }}
        name: observer test
        run: go test -race ./...
        working-directory: deploy/observer
      - if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: deploy/observer
          install-mode: none
      - if: ${{ !cancelled() }}
        name: govulncheck deploy/observer
        run: govulncheck ./...
        working-directory: deploy/observer
      - if: ${{ !cancelled() }}
        name: Wait for the media corpus test
        run: bash scripts/ci-background.sh wait media-corpus 1200
      - if: always()
        run: make test-media-s3-down
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  server-integration:
    name: Server integration
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres-migrations:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-integration
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make server-test-db
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        name: Initialize database roles (migrations)
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5433/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make server-migration-test
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5433/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make caddy-prod-test
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  server-resumeapi:
    name: Resume API integration
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-resumeapi
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make test-media-s3-up
      - if: ${{ !cancelled() }}
        run: make server-test-resumeapi-s3
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make server-test-media-s3
        env:
          SERVER_TEST_S3_SKIP: ^(TestNormalizationBudget|TestNormalizeAcceptsFrozenCorpusDeterministically)$
      - if: always()
        run: make test-media-s3-down
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  web:
    name: Web checks
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make web-source-manifest-check
      - if: ${{ !cancelled() }}
        run: npm ci
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        run: make web-lint
      - if: ${{ !cancelled() }}
        run: make web-typecheck
      - if: ${{ !cancelled() }}
        run: make web-test
      - if: ${{ !cancelled() }}
        name: Validate product page image freshness
        run: node scripts/validate-template-pages.mts --test
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        run: make web-build
      - if: ${{ !cancelled() }}
        run: make web-no-eval-check

  web-e2e:
    name: Web E2E (${{ matrix.shard }})
    needs: [preflight]
    if: (github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose') && needs.preflight.outputs.selection != 'no-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [preview-gap, rest-1, rest-2, rest-3, rest-4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ignore local E2E result roots
        run: |
          grep -qxF '/.dev/' .git/info/exclude ||
            printf '%s\n' '/.dev/' >> .git/info/exclude
      - name: Assert pinned browser display rules
        env:
          WEB_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_E2E_SHARD: ${{ matrix.shard }}
          WEB_E2E_MUTATIONS: ${{ needs.preflight.outputs.mutations }}
        run: |
          test -z "${UPDATE_GOLDEN+x}"
          test -z "${PLAYWRIGHT_UPDATE_SNAPSHOTS+x}"
          make web-e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: .dev/web-e2e-results/*/*/compare/diagnostics/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Upload display review images
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: display-review-${{ matrix.shard }}
          path: .dev/web-e2e-results/*/*/compare/review-images/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Upload preview gap report
        if: ${{ always() && matrix.shard == 'preview-gap' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-gap-report
          path: .dev/web-e2e-results/*/*/compare/harness/preview-gap-report.json
          if-no-files-found: warn

  # Runs every trusted-browser proof against the exact candidate through the
  # repository HTTPS harness. GitHub CI cannot see the deployed release
  # fence, the enrollment flags, live identity providers, or the production
  # origin, so a compile-only or Playwright-list result never substitutes for
  # this job. Proofs run in groups so the harness setup is paid once per
  # group; scripts/ci-browser-proofs.sh restarts the harness between proofs
  # and runs every proof of a group even when one fails. The TOTP and passkey
  # journeys run as shards (totp.spec.ts and second-factor.spec.ts,
  # "Enabled-proof sharding"), each first in its group so it starts on a
  # fresh database, and the ci job checks that their evidence together proves
  # every step. Groups are balanced by measured proof time. Uploaded evidence
  # covers only fictional accounts, plus the exports proof's redacted
  # mid-test failure facts (exports.spec.ts); every other proof uploads
  # nothing.
  dev-https-proofs:
    name: HTTPS proofs (${{ matrix.group }})
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: totp-replay-primary
            proofs: totp:replay-concurrent,primary
          - group: totp-skew-locale
            proofs: totp:skew,locale-attempts
          - group: totp-replace-epoch
            proofs: totp:replace-recovery,epoch-disabled
          - group: passkey-primary
            proofs: passkey:primary-disabled
          - group: passkey-recovery
            proofs: passkey:recovery-attempts public auth
          - group: editor
            proofs: editor exports
          - group: entry
            proofs: entry publish linkedin-import
          - group: account
            proofs: password privacy transport
          - group: mcp
            proofs: mcp mcp-sdk mcp-ts-sdk sample-start linkedin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start setup timing
        id: start-setup-timing
        run: |
          install -d -m 0700 .dev/proof-timing
          date +%s > .dev/proof-timing/setup-start
      - id: setup
        uses: ./.github/actions/browser-proof-setup
      - name: Record setup timing
        id: record-setup-timing
        if: always()
        env:
          SETUP_RESULT: ${{ steps.setup.outcome }}
        run: |
          start=$(cat .dev/proof-timing/setup-start)
          seconds=$(( $(date +%s) - start ))
          printf 'result\tseconds\n%s\t%s\n' "$SETUP_RESULT" "$seconds" > .dev/proof-timing/setup.tsv
          printf '| Setup result | Seconds |\n|-|-|\n| %s | %s |\n' "$SETUP_RESULT" "$seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Run each proof in the group
        env:
          PROOFS: ${{ matrix.proofs }}
        run: |
          read -ra proofs <<<"$PROOFS"
          bash scripts/ci-browser-proofs.sh "${proofs[@]}"
      - name: Upload browser proof timings
        id: upload-browser-proof-timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-proof-timing-${{ matrix.group }}
          path: .dev/proof-timing/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      - name: Upload shard proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-evidence-${{ matrix.group }}
          path: .dev/proof-evidence/
          if-no-files-found: ignore
          retention-days: 14
          # actions/upload-artifact excludes dot-directories unless include-hidden-files is true (actions/upload-artifact).
          include-hidden-files: true
      # Timings only (totp.spec.ts "CI section timing"): never covers a code,
      # secret, email, or URL, and is not part of the verified evidence above.
      - name: Upload TOTP proof timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: totp-timing-${{ matrix.group }}
          path: .dev/proof-evidence/*/totp-enabled.*/totp-timing.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      - name: Stop the HTTPS harness
        if: always()
        run: make dev-https-down
      - name: Stop the runner-local database
        if: always()
        run: make test-db-down
      - if: ${{ matrix.group == 'mcp' }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.setup.outputs.go-cache-hit }}
          cache-key: ${{ steps.setup.outputs.go-cache-key }}
          toolchain-hit: ${{ steps.setup.outputs.go-toolchain-hit }}

  ci:
    name: ci
    if: always()
    needs:
      - preflight
      - vn-infra
      - contracts
      - operational
      - dev-https-static
      - macos-tooling
      - server
      - server-integration
      - server-resumeapi
      - web
      - web-e2e
      - dev-https-proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-evidence-*
          path: shard-evidence
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        name: Check passkey shard coverage
        run: |
          mapfile -t evidence_files < <(
            find shard-evidence \
              \( -name passkey-second-factor-proof.json \
                 -o -name passkey-enrollment-disabled-proof.json \) )
          [ "${#evidence_files[@]}" -gt 0 ] ||
            { echo "no passkey shard evidence files were downloaded" >&2; exit 1; }
          node deploy/dev-https-browser/check-shard-coverage.mjs passkey \
            "${evidence_files[@]}"
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        name: Check TOTP shard coverage
        run: |
          mapfile -t evidence_files < <(
            find shard-evidence \
              \( -name totp-second-factor-proof.json \
                 -o -name totp-enrollment-disabled-proof.json \) )
          [ "${#evidence_files[@]}" -gt 0 ] ||
            { echo "no TOTP shard evidence files were downloaded" >&2; exit 1; }
          node deploy/dev-https-browser/check-shard-coverage.mjs totp \
            "${evidence_files[@]}"
      - name: Require valid selection and job results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if ! printf '%s\n' "$NEEDS_JSON" | jq -e \
            --arg event "$GITHUB_EVENT_NAME" '
              keys == (["preflight", "contracts", "operational",
                "dev-https-static", "macos-tooling", "vn-infra", "server",
                "server-integration", "server-resumeapi", "web", "web-e2e",
                "dev-https-proofs"] | sort)
              and .preflight.result == "success"
              and (.preflight.outputs.selection as $selection
                | ($selection == "full" or ($selection == "prose" and $event == "pull_request")
                  or ($selection == "no-web" and ($event == "pull_request" or $event == "push")))
                and (to_entries | all(
                  .value.result == "success" or
                  (.value.result == "skipped" and (
                    ($selection == "prose" and $event == "pull_request"
                      and (.key | IN("macos-tooling", "vn-infra", "server", "server-integration", "server-resumeapi", "web", "web-e2e", "dev-https-proofs")))
                    or ($selection == "no-web" and ($event == "pull_request" or $event == "push") and .key == "web-e2e")
                  )))))
            ' >/dev/null; then
            echo "ci: invalid selection or required job results" >&2
            exit 1
          fi
          echo "ci: all required jobs succeeded or were explicitly omitted"
