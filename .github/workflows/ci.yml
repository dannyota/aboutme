name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA of the trusted ancestor commit to compare with the candidate.
        required: true
        type: string

# Least-privilege default for every job: the workflow only reads the repo. No
# job writes back to it, and semgrep ci authenticates to its own platform via
# SEMGREP_APP_TOKEN rather than GITHUB_TOKEN.
permissions:
  contents: read

# A newer push to the same ref supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/dev-https-browser/package-lock.json
      - run: npm ci
      # `make operational-test` compiles and lists the trusted-browser specs
      # through the pinned @playwright/test in this directory; the list-only
      # check needs the runner, not downloaded browser binaries.
      - run: npm ci
        working-directory: deploy/dev-https-browser
      - run: make docs-lint
      - run: make lengths-check
      - run: make operational-test

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: packages/schema/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - run: make schema-check
      - run: go build ./... && go vet ./... && go test ./...
        working-directory: packages/schema/gen/go

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      # The drift gate in `make api-check` runs the generator pinned in
      # apps/web. --ignore-scripts skips `nuxt prepare`; the gate needs only
      # the generator binary.
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: make api-check

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - run: make server-build
      - run: make server-vet
      - run: make server-test
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/server
          version: v2.13.2
      - name: go mod tidy is a no-op
        run: |
          cd apps/server
          cp go.mod /tmp/go.mod.before && cp go.sum /tmp/go.sum.before
          go mod tidy
          diff /tmp/go.mod.before go.mod && diff /tmp/go.sum.before go.sum \
            || { echo "go.mod/go.sum are not tidy — run 'go mod tidy' in apps/server and commit"; exit 1; }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          cd apps/server && govulncheck ./...

  server-media-s3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - run: make test-s3-up
      - run: make server-test-s3
      - if: always()
        run: make test-s3-down

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make web-lint
      - run: make web-typecheck
      - run: make web-test
      - run: make web-build
      - run: make web-no-eval-check

  web-e2e:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ignore local E2E result roots
        run: |
          grep -qxF '/.dev/' .git/info/exclude ||
            printf '%s\n' '/.dev/' >> .git/info/exclude
      - name: Compare pinned browser baselines
        env:
          WEB_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -z "${UPDATE_GOLDEN+x}"
          test -z "${PLAYWRIGHT_UPDATE_SNAPSHOTS+x}"
          make web-e2e

  # Runs the synthetic passkey and recovery journey against the exact
  # candidate through the repository HTTPS harness. This is the only hosted
  # observation of that flow: GitHub CI cannot see the deployed release
  # fence, the enrollment flag, live identity providers, or the production
  # origin, so a compile-only or Playwright-list result never substitutes for
  # this job. Uploaded evidence covers only fictional accounts.
  passkey-browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # A go-installed caddy reports version "unknown", which the dev-https
      # tool check rejects, so this job uses the official release binary.
      - name: Install the pinned caddy (2.11.4)
        run: |
          curl -fsSL -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  /tmp/caddy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf /tmp/caddy.tar.gz -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      # The harness preflight requires the pinned Chromium on the host.
      - name: Install web dependencies and the pinned Chromium
        run: npm ci && npx playwright install chromium
        working-directory: apps/web
      - run: make dev-https
      - run: make dev-https-browser-image
      - run: make dev-https-passkey-check
      - name: Upload passkey proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passkey-browser-proof-evidence
          path: .dev/native-https/evidence/passkey-*
          if-no-files-found: ignore
          retention-days: 14
          # .dev is a dot-directory; the upload action excludes those by
          # default and would silently archive nothing without this.
          include-hidden-files: true
      - name: Stop the HTTPS harness
        if: always()
        run: make dev-https-down
      - name: Stop the runner-local database
        if: always()
        run: make test-db-down

  # Runs the synthetic TOTP enrollment, verification, and recovery journey
  # against the exact candidate through the repository HTTPS harness. This is
  # the only hosted observation of that flow: GitHub CI cannot see the
  # deployed release fence, the enrollment flag, or the production origin, so
  # a compile-only or Playwright-list result never substitutes for this job.
  # Uploaded evidence covers only fictional accounts.
  totp-browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # TOTP enrollment ships off. This proof must pass before
    # TOTP_ENROLLMENT_ENABLED is turned on; until then it reports without
    # blocking the release of the flag-off code.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # A go-installed caddy reports version "unknown", which the dev-https
      # tool check rejects, so this job uses the official release binary.
      - name: Install the pinned caddy (2.11.4)
        run: |
          curl -fsSL -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  /tmp/caddy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf /tmp/caddy.tar.gz -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      # The harness preflight requires the pinned Chromium on the host.
      - name: Install web dependencies and the pinned Chromium
        run: npm ci && npx playwright install chromium
        working-directory: apps/web
      - run: make dev-https
      - run: make dev-https-browser-image
      - run: make dev-https-totp-check
      - name: Upload TOTP proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: totp-browser-proof-evidence
          path: .dev/native-https/evidence/totp-*
          if-no-files-found: ignore
          retention-days: 14
          # .dev is a dot-directory; the upload action excludes those by
          # default and would silently archive nothing without this.
          include-hidden-files: true
      - name: Stop the HTTPS harness
        if: always()
        run: make dev-https-down
      - name: Stop the runner-local database
        if: always()
        run: make test-db-down

  # The browser-free half of web-e2e: build the Nuxt app from exactly the files
  # the source manifest lists. A stale manifest fails here quickly and in
  # parallel, instead of inside the Playwright image (and without being masked
  # behind a red `web` job).
  web-source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Ignore local result roots
        run: |
          grep -qxF '/.dev/' .git/info/exclude ||
            printf '%s\n' '/.dev/' >> .git/info/exclude
      - run: make web-source-build

  server-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        # A throwaway database on tmpfs removes disk latency from the suites.
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-integration
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      # Runs the DB-backed auth/store/user suites. Without this, a bare
      # `go test ./...` reports ok while every DSN-gated case skips — the
      # acceptance tests for AC-AUTH-001..005 and AC-SEC-002 among them. The
      # target sets REQUIRE_TEST_DB=1, so a missing DSN fails the job instead
      # of passing vacuously.
      - run: make server-test-db
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-resumeapi
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make test-s3-up
      - run: make server-test-resumeapi-s3
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: always()
        run: make test-s3-down

  migrations-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject modified or deleted migrations
        env:
          # Passed through the environment rather than interpolated directly
          # into the script: `${{ }}` expansion happens before the shell sees
          # the line, so event-derived values belong in env: as a rule, even
          # when — as here — they are commit SHAs.
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
              ! git cat-file -e "$BASE_SHA^{commit}" ||
              ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
              echo "Manual CI requires base_sha to be a full ancestor commit SHA." >&2
              exit 1
            fi
          fi
          bash scripts/check-migrations-append-only.sh --commits "$BASE_SHA" HEAD

  # Released resume schemas are immutable (docs/design/data.md, "Document
  # versions"): a released resume.v<N>.schema.json is the contract stored
  # documents and adjacent-version converters are pinned to. A one-time,
  # owner-approved documentation-citation rewrite is hash-pinned below so it
  # cannot authorize any other v1 bytes. Parallels
  # migrations-append-only above; the same name-status logic, a different
  # immutable artifact. packages/schema/test/released-append-only.test.ts
  # proves each rejected status against throwaway repositories and pins this
  # script's text.
  released-schema-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject modified or deleted released schemas
        env:
          # Passed through the environment rather than interpolated directly
          # into the script, for the same reason migrations-append-only does
          # it: `${{ }}` expansion happens before the shell sees the line.
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
              ! git cat-file -e "$BASE_SHA^{commit}" ||
              ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
              echo "Manual CI requires base_sha to be a full ancestor commit SHA." >&2
              exit 1
            fi
          fi
          if ! base=$(git rev-parse --verify --quiet "$BASE_SHA^{commit}") ||
            ! head=$(git rev-parse --verify --quiet "HEAD^{commit}"); then
            echo "Could not resolve released-schema comparison commits." >&2
            exit 1
          fi
          approved_old_v1_sha256="2da37bb75297fefe32a920e3fae960100f0a99236ba4dc21ef25ae6b3f61f13f"
          approved_new_v1_sha256="879858284bc3cb4092d1d671466a9c620e27abf134aecedce070b6f21e4e5866"
          # Compare the event base and candidate trees directly. A merge-base
          # diff can hide a released-schema reversion after rewritten history.
          if ! diff=$(git diff --name-status "$base" "$head" -- 'packages/schema/resume.v*.schema.json'); then
            echo "Could not compare released schemas with base." >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff" | grep -E '^(M|D|R|T)' || true)
          approved_v1_change=$(printf 'M\tpackages/schema/resume.v1.schema.json')
          if [ "$changed" = "$approved_v1_change" ]; then
            base_v1_sha256=$(git show "$base:packages/schema/resume.v1.schema.json" | sha256sum | cut -d ' ' -f 1)
            head_v1_sha256=$(git show "$head:packages/schema/resume.v1.schema.json" | sha256sum | cut -d ' ' -f 1)
            if [ "$base_v1_sha256" = "$approved_old_v1_sha256" ] && [ "$head_v1_sha256" = "$approved_new_v1_sha256" ]; then
              changed=""
            fi
          fi
          if [ -n "$changed" ]; then
            echo "Released schemas are immutable; only a new version file may be added:"
            echo "$changed"
            exit 1
          fi

  # Token-free secret scanning runs for every push and pull request, including
  # forks where GitHub correctly withholds the connected Semgrep token.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - name: Install the pinned gitleaks (8.30.1)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check-tool-versions.sh gitleaks
      - run: gitleaks detect --redact --no-banner

  # Connected Semgrep: Code (SAST, Pro rules + cross-file analysis), Supply
  # Chain (SCA for Go + npm), and Secrets — all free for public repositories.
  # Supply Chain covers dependency CVEs for Go and npm. It authenticates with
  # SEMGREP_APP_TOKEN, which GitHub withholds from FORK pull requests, so run
  # it on pushes, manual runs, and same-repo PRs only. A fork PR would have no
  # token and fail.
  semgrep:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semgrep ci is diff-aware; give it history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.176.0
      - run: scripts/test/semgrep-sca-inputs-test.sh
      - run: semgrep ci --code --supply-chain --secrets --no-suppress-errors
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # The migration suite is the slowest; it runs beside the other database
  # suites instead of after them.
  server-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        # A throwaway database on tmpfs removes disk latency from the suites.
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-migration-test
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable

  # Exercises the real deploy/caddy/Caddyfile route table (AC-OPS-005) through a
  # live caddy process fronting stub backends. Needs a caddy binary but no
  # database; pinned to 2.11.4 to match deploy/compose.yml's caddy image tag.
  route-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - name: Install the pinned caddy (2.11.4)
        run: |
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make route-table-test
        env:
          CADDY_BIN: caddy

  # Runs the native HTTPS stack for real and proves both MCP paths against it:
  # the raw JSON-RPC client (mcp) and the official SDK owner workflow (mcp-sdk,
  # synthetic local data only). No owner credential, release tag, or release
  # image digests are present, so the SDK proof's attestation write is skipped
  # (see scripts/mcp-owner-workflow.sh write_attestation). Fixed stage names
  # only; no screenshot, trace, video, or artifact upload.
  mcp-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      # A go-installed caddy reports version "unknown", which the dev-https
      # tool check rejects, so this job uses the official release binary.
      - name: Install the pinned caddy (2.11.4)
        run: |
          curl -fsSL -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  /tmp/caddy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf /tmp/caddy.tar.gz -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - name: Install web dependencies and the pinned Chromium
        run: npm ci && npx playwright install chromium
        working-directory: apps/web
      # dev-https starts the one shared database container itself, so the
      # job has no service container. Start it first to set up its roles.
      - run: make test-db-up
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:20432/aboutme_dev?sslmode=disable
      - run: make dev-https
      - run: make dev-https-browser-image
      - run: make dev-https-mcp-check
      - run: make dev-https-mcp-sdk-check
      - if: always()
        run: make dev-https-down
      - if: always()
        run: make test-db-down

  # Enforces the single-source-of-truth contract (ADR 0010): apps/server/
  # migrations/ is the only declared source for BOTH goose and sqlc's generated
  # data layer. Fails on any drift, including untracked generated files — which
  # is why `make sqlc-check` uses `git status --porcelain` rather than
  # `git diff --exit-code`.
  #
  # This needs no database and no DATABASE_URL: sqlc parses the migration files
  # statically. sqlc stays pinned so the gate flags real drift rather than
  # generator formatting changes.
  sqlc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      # One Go cache per job: a shared key lets whichever job finishes first
      # save a cache the other jobs cannot use. The commit in the key saves a
      # fresh cache each run; the prefix restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-
      - name: Install the pinned sqlc (v1.31.1)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Assert sqlc is present and pinned
        run: sqlc version | grep -q 'v1.31.1'
      - run: make sqlc-check

  # Formats and validates the public OpenTofu code without cloud credentials or
  # a backend. Deploys happen only from the owner's machine.
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/aws
      - name: Validate each root
        run: |
          for root in deploy/aws/probe deploy/aws/bootstrap deploy/aws/prod; do
            tofu -chdir="$root" init -backend=false -input=false >/dev/null
            tofu -chdir="$root" validate
          done
