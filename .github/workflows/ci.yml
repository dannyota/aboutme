      # tool check rejects, so this job uses the official release binary.
      - name: Install the pinned caddy (2.11.4)
        run: |
          curl -fsSL -o /tmp/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          echo "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  /tmp/caddy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf /tmp/caddy.tar.gz -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      # Cached on apps/web/package-lock.json: `npx playwright install`
      # is a no-op on a hit and still verifies the pinned browser is present.
      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install web dependencies and the pinned Chromium
        run: npm ci && npx playwright install chromium
        working-directory: apps/web
      # dev-https starts the one shared database container itself, so the
      # job has no service container. Start it first to set up its roles.
      - run: make test-db-up
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:20432/aboutme_dev?sslmode=disable
      - run: make dev-https
      - name: Wait for the background base-image pull
        run: |
          for _ in $(seq 1 600); do
            [ -f "$PLAYWRIGHT_BASE_PULL_STATUS" ] && break
            sleep 1
          done
          [ -f "$PLAYWRIGHT_BASE_PULL_STATUS" ] || {
            echo "base image pull did not finish in time" >&2
            cat "$PLAYWRIGHT_BASE_PULL_LOG" >&2 || true
            exit 1
          }
          status=$(cat "$PLAYWRIGHT_BASE_PULL_STATUS")
          if [ "$status" -ne 0 ]; then
            echo "base image pull failed (exit $status)" >&2
            cat "$PLAYWRIGHT_BASE_PULL_LOG" >&2 || true
            exit 1
          fi
      - run: make dev-https-browser-image
      - run: make dev-https-mcp-check
      - run: make dev-https-mcp-sdk-check
      - if: always()
        run: make dev-https-down
      - if: always()
        run: make test-db-down
      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  # Connected Semgrep: Code (SAST, Pro rules + cross-file analysis), Supply
  # Chain (SCA for Go + npm), and Secrets — all free for public repositories.
  # Supply Chain covers dependency CVEs for Go and npm. It authenticates with
  # SEMGREP_APP_TOKEN, which GitHub withholds from FORK pull requests, so run
  # it on pushes, manual runs, and same-repo PRs only. A fork PR would have no
  # token and fail.
  semgrep:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semgrep ci is diff-aware; give it history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Keyed on the pinned version alone: a version bump gets a fresh cache
      # instead of growing the old one forever.
      - name: Restore pip cache for Semgrep 1.178.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-semgrep-1.178.0-${{ runner.os }}
      - run: pip install semgrep==1.178.0
      - run: scripts/test/semgrep-sca-inputs-test.sh
      - run: semgrep ci --code --supply-chain --secrets --no-suppress-errors
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Aggregate gate: the branch protection target. Fails unless every job
  # above succeeded; semgrep may be `skipped` only through its own `if:`
  # (a fork pull request withholds SEMGREP_APP_TOKEN), never any other job.
  ci:
    if: always()
    needs:
      - docs
      - docs-dev-https
      - contracts
      - server
      - server-media-s3-corpus
      - web-test
      - web-e2e
      - web-build
      - caddy-prod-test
      - server-integration
      - server-resumeapi
      - passkey-browser-proof
      - passkey-browser-proof-coverage
      - totp-browser-proof
      - totp-browser-proof-coverage
      - mcp-proofs
      - semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed (semgrep may be skipped on its own condition)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | map(select(.key != "semgrep" or .value.result != "skipped"))
            | .[]
            | "\(.key)=\(.value.result)"
          ')
          if [ -n "$bad" ]; then
            echo "ci: required job(s) not successful:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "ci: all required jobs succeeded"
