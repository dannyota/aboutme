        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/server/go.sum', 'go.work.sum') }}-${{ steps.go-cache-week.outputs.week }}

  # Each totp-browser-proof shard's own evidence passed the closed-list check
