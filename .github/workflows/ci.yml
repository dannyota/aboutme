      - run: make dev-https-totp-check
        env:
          ABOUTME_TOTP_SHARD: ${{ matrix.shard }}
      - name: Upload TOTP proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: totp-browser-proof-evidence-${{ matrix.shard }}
          path: .dev/native-https/evidence/totp-*
          if-no-files-found: ignore
          retention-days: 14
          # .dev is a dot-directory; the upload action excludes those by
          # default and would silently archive nothing without this.
          include-hidden-files: true
      # Timings only (totp.spec.ts "CI section timing"): never covers a code,
      # secret, email, or URL, and is not part of the verified evidence above.
      - name: Upload TOTP proof timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
