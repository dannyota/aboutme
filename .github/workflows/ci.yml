name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA of the merge base of fetched main and the candidate.
        required: true
        type: string

# Least-privilege default for every job: the workflow only reads the repo. No
# job writes back to it, and semgrep ci authenticates to its own platform via
# SEMGREP_APP_TOKEN from the main-only semgrep environment.
permissions:
  contents: read

# PRs and dispatches supersede their own runs; each main push keeps its result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Job layout: macOS proves the local watchdog and static pre-push wrapper.
# Other jobs run Linux contracts, application checks, infrastructure, scans,
# browser shards, and proof groups, followed by the aggregate ci gate.
# Allowlisted prose pull requests retain preflight, all contracts, and ci.
# See docs/design/ci-path-selection.md for the selection contract.
# Short checks join a longer job that already has
# their setup instead of paying for a runner of their own, and independent
# work inside a job overlaps through scripts/ci-background.sh. Each check
# after a job's first runs under `if: ${{ !cancelled() }}` so one failure
# does not hide another.
jobs:
  preflight:
    name: CI preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.comparison.outputs.base_sha }}
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate comparison base and immutable artifacts
        id: comparison
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            base=$(bash scripts/check-migrations-append-only.sh --dispatch-base "$BASE_SHA" HEAD origin/main)
          fi
          bash scripts/check-migrations-append-only.sh --commits "$base" HEAD
          bash scripts/check-released-schemas.sh --commits "$base" HEAD
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select CI jobs
        id: selection
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
        run: |
          selection=$(python3 -I scripts/ci-path-selection.py "$GITHUB_EVENT_NAME" "$BASE_SHA" 2>/dev/null) || selection=full
          case "$selection" in
            full|prose) ;;
            *) selection=full ;;
          esac
          printf 'selection=%s\n' "$selection" >> "$GITHUB_OUTPUT"
          printf 'selection=%s\n' "$selection" >> "$GITHUB_STEP_SUMMARY"

  macos-tooling:
    name: macOS tooling
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and use Homebrew Bash and GNU coreutils
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bash coreutils
          bash_bin=$(brew --prefix --installed bash)/bin
          coreutils_bin=$(brew --prefix --installed coreutils)/libexec/gnubin
          "$bash_bin/bash" -c '((BASH_VERSINFO[0] >= 4))'
          printf '%s\n' "$bash_bin" "$coreutils_bin" >> "$GITHUB_PATH"
      - name: Watchdog process tests
        run: bash scripts/test/run-capped-test.sh
      - name: Static pre-push wrapper tests
        if: ${{ !cancelled() }}
        run: bash scripts/test/pre-push-test.sh
      - name: Production proof staging tests
        if: ${{ !cancelled() }}
        run: bash scripts/test/totp-production-proof-test.sh
      - uses: ./.github/actions/setup-go
        with:
          light: "true"
      - name: Native process supervision tests
        working-directory: apps/server
        run: go test ./internal/renderprocess

  vn-infra:
    name: VN infrastructure
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    uses: ./.github/workflows/vn-infra.yml

  # Checks needing no database, browser, or Go test run: gitleaks,
  # schema/API/Tofu contract gates, docs lint, operational static tests, and
  # `npm audit`. Full history supports gitleaks and docs links. The dev-https
  # static suite (two shards) and deploy-script tests run in the background.
  # `npm audit` needs no install: every manifest ships a package-lock.json,
  # and npm reads it directly. It fails on a high or critical advisory in a
  # production dependency, unless .github/npm-audit-exceptions.json lists it
  # (scripts/npm-audit.sh); --omit=dev drops devDependencies, which never
  # ship.
  contracts:
    name: Repository contracts
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Started before Node is set up, in the environment the suite was
      # written for.
      - name: Start the dev-https static suite shards
        env:
          DEV_HTTPS_DIAGNOSTICS_ARTIFACT_DIR: ${{ runner.temp }}/dev-https-startup-diagnostics
        run: |
          for shard in 0 1; do
            bash scripts/ci-background.sh start "dev-https-static-$shard" \
              make operational-test-dev-https DEV_HTTPS_TEST_SHARD="$shard/2"
          done
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            packages/schema/package-lock.json
            deploy/dev-https-browser/package-lock.json
      - if: ${{ !cancelled() }}
        name: Start the deploy-script static tests
        run: bash scripts/ci-background.sh start deploy-tests make operational-test-deploy
      # This job's own Go work is small (building/vetting/testing one
      # generated schema module, and `go install`-ing gitleaks), so it uses
      # its own light-scoped cache instead of the full shared build/module
      # cache the server job needs.
      - if: ${{ !cancelled() }}
        id: go
        uses: ./.github/actions/setup-go
        with:
          light: "true"
      - if: ${{ !cancelled() }}
        run: npm ci
      - if: ${{ !cancelled() }}
        run: make docs-lint
      - if: ${{ !cancelled() }}
        run: make docs-links-test
      - if: ${{ !cancelled() }}
        name: Check changed Markdown and affected indexes
        env:
          DOC_LINK_BASE: ${{ needs.preflight.outputs.base_sha }}
        run: make docs-links-check
      - if: ${{ !cancelled() }}
        run: make lengths-check
      - if: ${{ !cancelled() }}
        run: make operational-test-fast
      - if: ${{ !cancelled() }}
        run: make schema-check
      - if: ${{ !cancelled() }}
        run: go build ./... && go vet ./... && go test ./...
        working-directory: packages/schema/gen/go
      # The drift gate in `make api-check` runs the generator pinned in
      # apps/web. --ignore-scripts skips `nuxt prepare`; the gate needs only
      # the generator binary.
      - if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        run: make api-check
      - if: ${{ !cancelled() }}
        name: Install the pinned gitleaks (8.30.1)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        run: bash scripts/check-tool-versions.sh gitleaks
      - if: ${{ !cancelled() }}
        run: gitleaks detect --redact --no-banner
      - if: ${{ !cancelled() }}
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - if: ${{ !cancelled() }}
        run: tofu fmt -check -recursive deploy/aws
      - if: ${{ !cancelled() }}
        name: Validate each root
        run: |
          for root in deploy/aws/probe deploy/aws/bootstrap deploy/aws/prod; do
            tofu -chdir="$root" init -backend=false -input=false >/dev/null
            tofu -chdir="$root" validate
          done
      - if: ${{ !cancelled() }}
        run: npm ci
        working-directory: deploy/dev-https-browser
      - if: ${{ !cancelled() }}
        run: make operational-test-browser
      - if: ${{ !cancelled() }}
        name: npm audit (repository root)
        run: bash scripts/npm-audit.sh .
      - if: ${{ !cancelled() }}
        name: npm audit (apps/web)
        run: bash scripts/npm-audit.sh apps/web
      - if: ${{ !cancelled() }}
        name: npm audit (packages/schema)
        run: bash scripts/npm-audit.sh packages/schema
      - if: ${{ !cancelled() }}
        name: npm audit (deploy/dev-https-browser)
        run: bash scripts/npm-audit.sh deploy/dev-https-browser
      - if: ${{ !cancelled() }}
        name: Wait for the deploy-script static tests
        run: bash scripts/ci-background.sh wait deploy-tests
      - if: ${{ !cancelled() }}
        name: Wait for dev-https static suite shard 0
        run: bash scripts/ci-background.sh wait dev-https-static-0
      - if: ${{ !cancelled() }}
        name: Wait for dev-https static suite shard 1
        run: bash scripts/ci-background.sh wait dev-https-static-1
      - name: Upload dev-https startup diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-https-startup-diagnostics
          path: ${{ runner.temp }}/dev-https-startup-diagnostics/*.txt
          if-no-files-found: ignore
          retention-days: 14
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  # The Go build/vet/test/lint gate, the sqlc-drift and route-table gates,
  # govulncheck, the media package's slow normalization corpus test (which
  # runs in the background beside the rest), and the deployment transparency
  # observer's own build/vet/test/lint/govulncheck (deploy/observer/README.md,
  # a separate Go module outside go.work with no database, browser, or live
  # AWS access needed; its platform adapters and S3 publisher are tested
  # against httptest servers).
  #
  # govulncheck runs in source mode for every Go module in the repository: it
  # fails only on a vulnerability reachable from the module's own call graph,
  # not on every dependency with a known advisory. The Caddy build module and
  # the observer module live outside go.work (the former pins its own Caddy
  # version; the latter is a standalone deployment tool), so both need
  # GOWORK=off or govulncheck would refuse to run there at all. Two
  # module-level advisories are known and not reachable: GO-2026-6094
  # (cel-go 0.28.1; Caddy 2.11.4 cannot build against cel-go >= 0.29) and
  # GO-2026-5932 (x/crypto/openpgp; no fix exists). If either ever reports as
  # reachable, this job fails and the trace must be investigated, not
  # suppressed. Revisit by 2026-12-31: check for a Caddy release that builds
  # with cel-go >= 0.30, and for x/crypto dropping openpgp.
  server:
    name: Server checks
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
      # Only ./internal/media/...'s slow normalization corpus test runs here,
      # in the background beside the steps below; server-resumeapi's
      # server-test-s3 step runs the rest of the package.
      # SERVER_TEST_S3_RUN/SERVER_TEST_S3_SKIP select the complementary halves
      # so every test in the package runs exactly once between the two jobs.
      - run: make test-s3-up
      - name: Start the media corpus test
        env:
          SERVER_TEST_S3_RUN: ^TestNormalizeAcceptsFrozenCorpusDeterministically$
        run: bash scripts/ci-background.sh start media-corpus make server-test-s3
      - if: ${{ !cancelled() }}
        run: make server-build
      - if: ${{ !cancelled() }}
        name: Cross-compile the server for Darwin arm64
        working-directory: apps/server
        run: GOOS=darwin GOARCH=arm64 go build ./...
      - if: ${{ !cancelled() }}
        run: make server-vet
      - if: ${{ !cancelled() }}
        run: make server-test
      - if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: apps/server
          version: v2.15.0
      - if: ${{ !cancelled() }}
        name: go mod tidy is a no-op
        run: |
          cd apps/server
          cp go.mod /tmp/go.mod.before && cp go.sum /tmp/go.sum.before
          go mod tidy
          diff /tmp/go.mod.before go.mod && diff /tmp/go.sum.before go.sum \
            || { echo "go.mod/go.sum are not tidy — run 'go mod tidy' in apps/server and commit"; exit 1; }
      # Enforces the single-source-of-truth contract (ADR 0005): apps/server/
      # migrations/ is the only declared source for BOTH goose and sqlc's
      # generated data layer. Fails on any drift, including an untracked
      # generated file, so `make sqlc-check` uses `git status --porcelain`
      # rather than `git diff --exit-code`. This needs no database: sqlc
      # parses the migration files statically. sqlc stays pinned so the gate
      # flags real drift rather than generator formatting changes.
      - if: ${{ !cancelled() }}
        name: Install the pinned sqlc (v1.31.1)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        name: Assert sqlc is present and pinned
        run: sqlc version | grep -q 'v1.31.1'
      - if: ${{ !cancelled() }}
        run: make sqlc-check
      # Exercises the real deploy/caddy/Caddyfile route table (AC-OPS-005)
      # through a live caddy process fronting stub backends. Needs a caddy
      # binary but no database; pinned to 2.11.4 to match
      # deploy/compose.yml's caddy image tag.
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/install-caddy
      - if: ${{ !cancelled() }}
        run: make route-table-test
        env:
          CADDY_BIN: caddy
      - if: ${{ !cancelled() }}
        name: Install the pinned govulncheck (1.9.0)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        name: govulncheck apps/server
        run: govulncheck ./...
        working-directory: apps/server
      - if: ${{ !cancelled() }}
        name: govulncheck packages/schema/gen/go
        run: govulncheck ./...
        working-directory: packages/schema/gen/go
      - if: ${{ !cancelled() }}
        name: govulncheck deploy/caddy/production/build
        run: govulncheck ./...
        working-directory: deploy/caddy/production/build
        env:
          GOWORK: "off"
      # The deployment transparency observer (deploy/observer/README.md): its
      # own Go module outside go.work, so every step below runs with
      # GOWORK=off. No database, browser, or live AWS access is needed; the
      # platform adapters and the S3 publisher are tested against httptest
      # servers. It reuses this job's checkout, Go toolchain, and the
      # govulncheck already installed above.
      - if: ${{ !cancelled() }}
        name: observer build
        run: go build ./...
        working-directory: deploy/observer
        env:
          GOWORK: "off"
      - if: ${{ !cancelled() }}
        name: observer vet
        run: go vet ./...
        working-directory: deploy/observer
        env:
          GOWORK: "off"
      - if: ${{ !cancelled() }}
        name: observer test
        run: go test -race ./...
        working-directory: deploy/observer
        env:
          GOWORK: "off"
      - if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: deploy/observer
          version: v2.15.0
        env:
          GOWORK: "off"
      - if: ${{ !cancelled() }}
        name: go mod tidy is a no-op (deploy/observer)
        run: |
          cp go.mod /tmp/observer-go.mod.before && cp go.sum /tmp/observer-go.sum.before
          go mod tidy
          diff /tmp/observer-go.mod.before go.mod && diff /tmp/observer-go.sum.before go.sum \
            || { echo "go.mod/go.sum are not tidy: run 'go mod tidy' in deploy/observer and commit"; exit 1; }
        working-directory: deploy/observer
        env:
          GOWORK: "off"
      - if: ${{ !cancelled() }}
        name: govulncheck deploy/observer
        run: govulncheck ./...
        working-directory: deploy/observer
        env:
          GOWORK: "off"
      - if: ${{ !cancelled() }}
        name: Wait for the media corpus test
        run: bash scripts/ci-background.sh wait media-corpus 1200
      - if: always()
        run: make test-s3-down
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  # Runs server-test-integration and the DB-backed suites in server-test-db
  # against the primary postgres service, so this job's suites run at the
  # same time as server-resumeapi's rather than one after the other. The
  # migration suite runs against its own postgres-migrations service on a
  # different port, so its schema mutations never share a database with the
  # other suites in this job or with server-resumeapi. The production Caddy
  # image test joins this job last: it needs only Podman.
  server-integration:
    name: Server integration
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        # A throwaway database on tmpfs removes disk latency from the suites.
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres-migrations:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-integration
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      # Runs the DB-backed auth/store/user suites. Without this, a bare
      # `go test ./...` reports ok while every DSN-gated case skips, including
      # the acceptance tests for AC-AUTH-001..005 and AC-SEC-002. The target
      # sets REQUIRE_TEST_DB=1, so a missing DSN fails the job instead of
      # passing vacuously.
      - if: ${{ !cancelled() }}
        run: make server-test-db
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        name: Initialize database roles (migrations)
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5433/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make server-migration-test
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5433/aboutme?sslmode=disable
      # Builds the production Caddy image (compiling Caddy from source) and
      # runs its routing, origin mTLS, client-IP trust, and
      # maintenance-mode tests, so a broken build or a config regression
      # fails here instead of first surfacing in release-images after a tag.
      - if: ${{ !cancelled() }}
        run: make caddy-prod-test
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  # Runs the filesystem- and S3-backed resumeapi suites against their own
  # database service, so they run at the same time as server-integration's
  # suites rather than one after the other.
  server-resumeapi:
    name: Resume API integration
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: aboutme
          POSTGRES_PASSWORD: aboutme_dev
          POSTGRES_DB: aboutme
        ports:
          - 5432:5432
        # A throwaway database on tmpfs removes disk latency from the suites.
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U aboutme"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: ./.github/actions/setup-go
      - name: Initialize database roles
        run: make db-setup
        env:
          DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - run: make server-test-resumeapi
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      - if: ${{ !cancelled() }}
        run: make test-s3-up
      - if: ${{ !cancelled() }}
        run: make server-test-resumeapi-s3
        env:
          TEST_DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:5432/aboutme?sslmode=disable
      # The rest of ./internal/media/..., skipping the two tests the server
      # job already ran (its corpus test, and the budget test neither job
      # runs), so every test in the package runs exactly once between the
      # two jobs.
      - if: ${{ !cancelled() }}
        run: make server-test-s3
        env:
          SERVER_TEST_S3_SKIP: ^(TestNormalizationBudget|TestNormalizeAcceptsFrozenCorpusDeterministically)$
      - if: always()
        run: make test-s3-down
      - uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.go.outputs.cache-hit }}
          cache-key: ${{ steps.go.outputs.cache-key }}
          toolchain-hit: ${{ steps.go.outputs.toolchain-hit }}

  # The Nuxt lint, typecheck, unit-test, and build gate, plus the e2e source
  # manifest drift check. The manifest's completeness (every file the build
  # imports is listed) is proven by the web-e2e shards, which build both Nuxt
  # surfaces from exactly the manifest's files.
  web:
    name: Web checks
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make web-source-manifest-check
      - if: ${{ !cancelled() }}
        run: npm ci
        working-directory: apps/web
      - if: ${{ !cancelled() }}
        run: make web-lint
      - if: ${{ !cancelled() }}
        run: make web-typecheck
      - if: ${{ !cancelled() }}
        run: make web-test
      - if: ${{ !cancelled() }}
        run: make web-build
      - if: ${{ !cancelled() }}
        run: make web-no-eval-check

  # The pinned-browser renderer baselines, as two shards that together run
  # every spec once (Makefile WEB_E2E_SHARD). Each shard builds the Nuxt
  # surfaces it tests from the source manifest inside the pinned image.
  web-e2e:
    name: Web E2E (${{ matrix.shard }})
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [preview-gap, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ignore local E2E result roots
        run: |
          grep -qxF '/.dev/' .git/info/exclude ||
            printf '%s\n' '/.dev/' >> .git/info/exclude
      - name: Compare pinned browser baselines
        env:
          WEB_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          WEB_E2E_SHARD: ${{ matrix.shard }}
        run: |
          test -z "${UPDATE_GOLDEN+x}"
          test -z "${PLAYWRIGHT_UPDATE_SNAPSHOTS+x}"
          make web-e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: .dev/web-e2e-results/*/*/compare/diagnostics/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
      - name: Upload preview gap report
        if: ${{ always() && matrix.shard == 'preview-gap' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-gap-report
          path: .dev/web-e2e-results/*/*/compare/harness/preview-gap-report.json
          if-no-files-found: warn

  # Runs every trusted-browser proof against the exact candidate through the
  # repository HTTPS harness. GitHub CI cannot see the deployed release
  # fence, the enrollment flags, live identity providers, or the production
  # origin, so a compile-only or Playwright-list result never substitutes for
  # this job. Proofs run in groups so the harness setup is paid once per
  # group; scripts/ci-browser-proofs.sh restarts the harness between proofs
  # and runs every proof of a group even when one fails. The TOTP and passkey
  # journeys run as shards (totp.spec.ts and second-factor.spec.ts,
  # "Enabled-proof sharding"), each first in its group so it starts on a
  # fresh database, and the ci job checks that their evidence together proves
  # every step. Groups are balanced by measured proof time. Uploaded evidence
  # covers only fictional accounts, plus the exports proof's redacted
  # mid-test failure facts (exports.spec.ts); every other proof uploads
  # nothing.
  dev-https-proofs:
    name: HTTPS proofs (${{ matrix.group }})
    needs: [preflight]
    if: github.event_name != 'pull_request' || needs.preflight.outputs.selection != 'prose'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Each TOTP group runs its listed shards as parallel tests against one
      # harness (totp.spec.ts "Enabled-proof sharding"): most of each
      # shard's time is waiting for fresh 30-second codes, so they overlap.
      # Two shards per group keep each group within the other groups' time;
      # epoch-disabled pairs with a short shard because its disabled phase
      # starts only after both finish.
      matrix:
        include:
          - group: totp-replay-primary
            proofs: totp:replay-concurrent,primary
          - group: totp-skew-locale
            proofs: totp:skew,locale-attempts
          - group: totp-replace-epoch
            proofs: totp:replace-recovery,epoch-disabled
          - group: passkey-primary
            proofs: passkey:primary-disabled
          - group: passkey-recovery
            proofs: passkey:recovery-attempts public auth
          - group: editor
            proofs: editor exports
          - group: entry
            proofs: entry publish linkedin-import
          - group: account
            proofs: password privacy transport
          - group: mcp
            proofs: mcp mcp-sdk mcp-ts-sdk sample-start linkedin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start setup timing
        id: start-setup-timing
        run: |
          install -d -m 0700 .dev/proof-timing
          date +%s > .dev/proof-timing/setup-start
      - id: setup
        uses: ./.github/actions/browser-proof-setup
      - name: Record setup timing
        id: record-setup-timing
        if: always()
        env:
          SETUP_RESULT: ${{ steps.setup.outcome }}
        run: |
          start=$(cat .dev/proof-timing/setup-start)
          seconds=$(( $(date +%s) - start ))
          printf 'result\tseconds\n%s\t%s\n' "$SETUP_RESULT" "$seconds" > .dev/proof-timing/setup.tsv
          printf '| Setup result | Seconds |\n|-|-|\n| %s | %s |\n' "$SETUP_RESULT" "$seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Run each proof in the group
        env:
          PROOFS: ${{ matrix.proofs }}
        run: |
          read -ra proofs <<<"$PROOFS"
          bash scripts/ci-browser-proofs.sh "${proofs[@]}"
      - name: Upload browser proof timings
        id: upload-browser-proof-timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-proof-timing-${{ matrix.group }}
          path: .dev/proof-timing/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      - name: Upload shard proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-evidence-${{ matrix.group }}
          path: .dev/proof-evidence/
          if-no-files-found: ignore
          retention-days: 14
          # .dev is a dot-directory; the upload action excludes those by
          # default and would silently archive nothing without this.
          include-hidden-files: true
      # Timings only (totp.spec.ts "CI section timing"): never covers a code,
      # secret, email, or URL, and is not part of the verified evidence above.
      - name: Upload TOTP proof timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: totp-timing-${{ matrix.group }}
          path: .dev/proof-evidence/*/totp-enabled.*/totp-timing.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      - name: Stop the HTTPS harness
        if: always()
        run: make dev-https-down
      - name: Stop the runner-local database
        if: always()
        run: make test-db-down
      # One group saves the proofs' Go cache; the others would only race it.
      - if: ${{ matrix.group == 'mcp' }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-hit: ${{ steps.setup.outputs.go-cache-hit }}
          cache-key: ${{ steps.setup.outputs.go-cache-key }}
          toolchain-hit: ${{ steps.setup.outputs.go-toolchain-hit }}

  # Connected Semgrep: Code (SAST, Pro rules + cross-file analysis) and Supply
  # Chain (SCA for Go + npm). gitleaks owns secret scanning.
  # Each product set runs as its own `semgrep ci` scan in its own job, so the
  # two scans overlap instead of adding up. Every scan uploads to the same
  # Semgrep project and ref. The platform policy decides what fails `semgrep
  # ci` itself; a gate step after each scan blocks in the repository, whatever
  # that policy says. scripts/semgrep-gate.sh reads the scan's JSON and fails
  # on any Code finding of severity ERROR, HIGH, or CRITICAL, and on any
  # reachable Supply Chain finding of those severities. A reviewed false
  # positive is suppressed in place with `nosemgrep: <rule-id>` and a reason.
  # The scans read SEMGREP_APP_TOKEN from the semgrep environment, whose
  # deployment branch policy allows only main. Run them only on main pushes
  # and main dispatches so pull requests never receive the token.
  semgrep-code:
    name: Semgrep code
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: semgrep
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semgrep ci is diff-aware; give it history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Keyed on the pinned version alone: a version bump gets a fresh cache
      # instead of growing the old one forever.
      - name: Restore pip cache for Semgrep 1.183.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-semgrep-1.183.0-${{ runner.os }}
      - run: pip install semgrep==1.183.0
      - run: scripts/test/semgrep-gate-test.sh
      - run: semgrep ci --code --no-suppress-errors --json-output="$RUNNER_TEMP/semgrep.json"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Block on ERROR, HIGH, and CRITICAL Code findings
        run: scripts/semgrep-gate.sh code "$RUNNER_TEMP/semgrep.json"

  semgrep-supply-chain:
    name: Semgrep supply chain
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: semgrep
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semgrep ci is diff-aware; give it history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The code job saves this cache; this job only restores it.
      - name: Restore pip cache for Semgrep 1.183.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-semgrep-1.183.0-${{ runner.os }}
      - run: pip install semgrep==1.183.0
      - run: scripts/test/semgrep-sca-inputs-test.sh
      - run: semgrep ci --supply-chain --no-suppress-errors --json-output="$RUNNER_TEMP/semgrep.json"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Block on reachable ERROR, HIGH, and CRITICAL Supply Chain findings
        run: scripts/semgrep-gate.sh supply-chain "$RUNNER_TEMP/semgrep.json"

  # Aggregate gate: the branch protection target. Each proof shard's own
  # evidence passed the closed-list check in verify-evidence.mjs when its
  # shard ran; this job first checks that the shards' evidence together
  # proves every step of the TOTP and passkey scenarios and that each
  # disabled-enrollment phase ran exactly once. It then fails unless every
  # job above succeeded or has an explicit prose omission. The two Semgrep
  # jobs may skip only outside main pushes and main dispatches, where the
  # semgrep environment is unavailable.
  ci:
    name: ci
    if: always()
    needs:
      - preflight
      - vn-infra
      - contracts
      - macos-tooling
      - server
      - server-integration
      - server-resumeapi
      - web
      - web-e2e
      - dev-https-proofs
      - semgrep-code
      - semgrep-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-evidence-*
          path: shard-evidence
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        name: Check passkey shard coverage
        run: |
          mapfile -t evidence_files < <(
            find shard-evidence \
              \( -name passkey-second-factor-proof.json \
                 -o -name passkey-enrollment-disabled-proof.json \) )
          [ "${#evidence_files[@]}" -gt 0 ] ||
            { echo "no passkey shard evidence files were downloaded" >&2; exit 1; }
          node deploy/dev-https-browser/check-shard-coverage.mjs passkey \
            "${evidence_files[@]}"
      - if: ${{ needs.dev-https-proofs.result == 'success' }}
        name: Check TOTP shard coverage
        run: |
          mapfile -t evidence_files < <(
            find shard-evidence \
              \( -name totp-second-factor-proof.json \
                 -o -name totp-enrollment-disabled-proof.json \) )
          [ "${#evidence_files[@]}" -gt 0 ] ||
            { echo "no TOTP shard evidence files were downloaded" >&2; exit 1; }
          node deploy/dev-https-browser/check-shard-coverage.mjs totp \
            "${evidence_files[@]}"
      - name: Require valid selection and job results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOW_SEMGREP_SKIP: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
        run: |
          if ! printf '%s\n' "$NEEDS_JSON" | jq -e \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg allow_semgrep_skip "$ALLOW_SEMGREP_SKIP" '
              keys == (["preflight", "contracts", "macos-tooling", "vn-infra",
                "server", "server-integration", "server-resumeapi", "web",
                "web-e2e", "dev-https-proofs", "semgrep-code", "semgrep-supply-chain"] | sort)
              and .preflight.result == "success"
              and (.preflight.outputs.selection as $selection
                | ($selection == "full" or ($selection == "prose" and $event == "pull_request"))
                and (to_entries | all(
                  .value.result == "success" or
                  (.value.result == "skipped" and (
                    ($allow_semgrep_skip == "true"
                      and (.key | IN("semgrep-code", "semgrep-supply-chain")))
                    or ($selection == "prose" and $event == "pull_request"
                      and (.key | IN("macos-tooling", "vn-infra", "server", "server-integration", "server-resumeapi", "web", "web-e2e", "dev-https-proofs")))
                  )))))
            ' >/dev/null; then
            echo "ci: invalid selection or required job results" >&2
            exit 1
          fi
          echo "ci: all required jobs succeeded or were explicitly omitted"
