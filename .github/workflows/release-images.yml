name: Release images

# Builds, smoke-tests and publishes the production images for a version tag.
# It holds no cloud credential and never deploys; see
# docs/design/single-host-production.md. Server, web, and caddy publish one
# image per platform, linux/arm64 for AWS and linux/amd64 for the Vietnam host
# (docs/design/vietnam-production.md, "Host"), and the version tag names an
# image index of the two. Each observer platform builds in its own job below so
# a Trivy finding there cannot cancel or block server, web, or caddy, or stop
# the release job that publishes them.
# Manual builds use release-check.yml with read-only permissions.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No publishing job receives write authority until this read-only check
  # accepts the tag and its exact main CI result. Each write-capable job repeats
  # the check from trusted main before other work, including on partial reruns.
  # Candidate checkouts supply build inputs only.
  eligibility:
    name: Release eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dannyota/aboutme
          ref: refs/heads/main
          path: .release-trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .release-trusted/scripts/release-eligibility.sh "$TAG" "$COMMIT"

  # App images fail fast together. Observer outcomes never gate app builds.
  # Each platform builds on a native runner.
  build:
    name: Release images (${{ matrix.name }}, ${{ matrix.arch }})
    needs: eligibility
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        name: [server, web, caddy]
        arch: [arm64, amd64]
        include:
          - name: server
            dockerfile: deploy/server.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
          - name: caddy
            dockerfile: deploy/caddy/production/Dockerfile
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
    env:
      # The image job joins the platform tags under the version tag.
      IMAGE: ghcr.io/dannyota/aboutme-${{ matrix.name }}:${{ github.ref_name }}-${{ matrix.arch }}
      NAME: ${{ matrix.name }}
      ARCH: ${{ matrix.arch }}
      MACHINE: ${{ matrix.machine }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dannyota/aboutme
          ref: refs/heads/main
          path: .release-trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .release-trusted/scripts/release-eligibility.sh "$TAG" "$COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/release-image-check
        with:
          report-name: ${{ matrix.name }}-${{ matrix.arch }}
      - name: Push
        if: github.event_name == 'push'
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$NAME=$digest" >"digest-$NAME-$ARCH.txt"
          echo "$NAME linux/$ARCH=$digest" >>"$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dannyota/aboutme-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The SBOM lists the packages in the pushed digest: Go build information
      # and the OS package database. The attestation binds it to that digest;
      # docs/design/deployment-transparency/verification.md, "SBOM".
      - name: SBOM
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --format spdx-json \
            --output "aboutme-$NAME-$ARCH.spdx.json" "ghcr.io/dannyota/aboutme-$NAME@$DIGEST"
          jq -e '.spdxVersion == "SPDX-2.3"' "aboutme-$NAME-$ARCH.spdx.json" >/dev/null
      - if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/dannyota/aboutme-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: aboutme-${{ matrix.name }}-${{ matrix.arch }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: digest-${{ matrix.name }}-${{ matrix.arch }}.txt
          if-no-files-found: error
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}-${{ matrix.arch }}
          path: aboutme-${{ matrix.name }}-${{ matrix.arch }}.spdx.json
          if-no-files-found: error

  # Joins each image's two platform digests under the version tag as an image
  # index, checks the index lists exactly those digests, and attests its
  # provenance. A deploy pins one platform digest, never the index:
  # deploy/aws/scripts/deploy.sh picks linux/arm64.
  image:
    name: Release index (${{ matrix.name }})
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        name: [server, web, caddy]
    env:
      REPO: ghcr.io/dannyota/aboutme-${{ matrix.name }}
      IMAGE: ghcr.io/dannyota/aboutme-${{ matrix.name }}:${{ github.ref_name }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dannyota/aboutme
          ref: refs/heads/main
          path: .release-trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .release-trusted/scripts/release-eligibility.sh "$TAG" "$COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.name }}-*
          path: artifacts
          merge-multiple: true
      - name: Create index
        id: index
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          declare -A want
          for arch in arm64 amd64; do
            line=$(cat "artifacts/digest-$NAME-$arch.txt")
            [[ $line =~ ^$NAME=(sha256:[0-9a-f]{64})$ ]] ||
              { echo "image: malformed $arch digest for $NAME" >&2; exit 1; }
            want[$arch]=${BASH_REMATCH[1]}
          done
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE" \
            "$REPO@${want[arm64]}" "$REPO@${want[amd64]}"
          raw=$(docker buildx imagetools inspect --raw "$IMAGE")
          jq -e --arg arm "${want[arm64]}" --arg amd "${want[amd64]}" '
            (.manifests | length) == 2
            and any(.manifests[]; .digest == $arm and .platform.os == "linux" and .platform.architecture == "arm64")
            and any(.manifests[]; .digest == $amd and .platform.os == "linux" and .platform.architecture == "amd64")' \
            <<<"$raw" >/dev/null || { echo "image: $IMAGE does not list exactly the built digests" >&2; exit 1; }
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE" | jq -r .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "image: no index digest for $IMAGE" >&2; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "$NAME=$digest" >"index-$NAME.txt"
          echo "$NAME index=$digest" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dannyota/aboutme-${{ matrix.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.name }}
          path: index-${{ matrix.name }}.txt
          if-no-files-found: error

  # The deployment transparency observer
  # (docs/design/deployment-transparency/README.md) builds a single-platform
  # arm64 manifest for Lambda. Its failures never block the app release.
  observer-image:
    name: Release observer (arm64)
    needs: eligibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/dannyota/aboutme-observer:${{ github.ref_name }}
      NAME: observer
      ARCH: arm64
      MACHINE: aarch64
      DOCKERFILE: deploy/observer/Dockerfile
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dannyota/aboutme
          ref: refs/heads/main
          path: .release-trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .release-trusted/scripts/release-eligibility.sh "$TAG" "$COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/release-image-check
        with:
          report-name: observer
      - name: Push
        if: github.event_name == 'push'
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "observer=$digest" >digest-observer.txt
          echo "observer=$digest" >>"$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dannyota/aboutme-observer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The SBOM lists the packages in the pushed digest: Go build information
      # and the OS package database. The attestation binds it to that digest;
      # docs/design/deployment-transparency/verification.md, "SBOM".
      - name: SBOM
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --format spdx-json \
            --output aboutme-observer.spdx.json "ghcr.io/dannyota/aboutme-observer@$DIGEST"
          jq -e '.spdxVersion == "SPDX-2.3"' aboutme-observer.spdx.json >/dev/null
      - if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/dannyota/aboutme-observer
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: aboutme-observer.spdx.json
          push-to-registry: true
          create-storage-record: false
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-observer
          path: digest-observer.txt
          if-no-files-found: error
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-observer
          path: aboutme-observer.spdx.json
          if-no-files-found: error

  # The amd64 observer uses a separate single-platform tag for the Vietnam host.
  # Its job stays independent so a Trivy finding cannot block the app images
  # or their release.
  observer-image-amd64:
    name: Release observer (amd64)
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/dannyota/aboutme-observer:${{ github.ref_name }}-amd64
      NAME: observer-amd64
      ARCH: amd64
      MACHINE: x86_64
      DOCKERFILE: deploy/observer/Dockerfile
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dannyota/aboutme
          ref: refs/heads/main
          path: .release-trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .release-trusted/scripts/release-eligibility.sh "$TAG" "$COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/release-image-check
        with:
          report-name: observer-amd64
      - name: Push
        if: github.event_name == 'push'
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "observer-amd64=$digest" >digest-observer-amd64.txt
          echo "observer linux/amd64=$digest" >>"$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dannyota/aboutme-observer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --format spdx-json \
            --output aboutme-observer-amd64.spdx.json "ghcr.io/dannyota/aboutme-observer@$DIGEST"
          jq -e '.spdxVersion == "SPDX-2.3"' aboutme-observer-amd64.spdx.json >/dev/null
      - if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/dannyota/aboutme-observer
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: aboutme-observer-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-observer-amd64
          path: digest-observer-amd64.txt
          if-no-files-found: error
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-observer-amd64
          path: aboutme-observer-amd64.spdx.json
          if-no-files-found: error

  # Publishes the tag's SBOMs and digests as a GitHub Release, so they keep a
  # permanent public link. The signed attestations above are the evidence; a
  # release asset is a copy. This job holds no registry, OIDC, or attestation
  # permission. It needs only the app images: observer job outcomes never gate
  # or block this release (see the "build" job comment).
  # needs lists both observer jobs so this job can pick up their digest
  # artifacts. !cancelled() keeps GitHub from skipping this job when either
  # observer job fails. The explicit app image result is the release gate.
  release:
    name: Publish release
    needs: [image, observer-image, observer-image-amd64]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OBSERVER_ARM_RESULT: ${{ needs['observer-image'].result }}
      OBSERVER_AMD_RESULT: ${{ needs['observer-image-amd64'].result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dannyota/aboutme
          ref: refs/heads/main
          path: .release-trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .release-trusted/scripts/release-eligibility.sh "$TAG" "$COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: index-*
          path: artifacts
          merge-multiple: true
      - name: Assemble
        run: |
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            { echo "release: $TAG is not a vMAJOR.MINOR.PATCH tag" >&2; exit 1; }
          mkdir release
          : >release/digests.txt
          # Reads one "name=sha256:..." digest file.
          read_digest() { # file name
            local line
            line=$(cat "$1")
            [[ $line =~ ^$2=(sha256:[0-9a-f]{64})$ ]] ||
              { echo "release: malformed digest in ${1##*/}" >&2; return 1; }
            printf '%s\n' "${BASH_REMATCH[1]}"
          }
          # Each line of digests.txt is an image reference and the platforms
          # it serves: the index first, then each platform image.
          for name in server web caddy; do
            d=$(read_digest "artifacts/index-$name.txt" "$name")
            echo "ghcr.io/dannyota/aboutme-$name@$d linux/arm64,linux/amd64" >>release/digests.txt
            for arch in arm64 amd64; do
              d=$(read_digest "artifacts/digest-$name-$arch.txt" "$name")
              echo "ghcr.io/dannyota/aboutme-$name@$d linux/$arch" >>release/digests.txt
              jq -e '.spdxVersion == "SPDX-2.3"' "artifacts/aboutme-$name-$arch.spdx.json" >/dev/null
              cp "artifacts/aboutme-$name-$arch.spdx.json" release/
            done
            # Existing transparency documents link this name. AWS runs the
            # arm64 image, so keep that platform's SBOM at the legacy URL.
            cp "artifacts/aboutme-$name-arm64.spdx.json" "release/aboutme-$name.spdx.json"
          done
          # Each observer platform is listed when its independent job succeeds.
          names=()
          if [ "$OBSERVER_ARM_RESULT" = success ] &&
            [ -e artifacts/digest-observer.txt ] &&
            [ -e artifacts/aboutme-observer.spdx.json ]; then
            names+=(observer)
          fi
          if [ "$OBSERVER_AMD_RESULT" = success ] &&
            [ -e artifacts/digest-observer-amd64.txt ] &&
            [ -e artifacts/aboutme-observer-amd64.spdx.json ]; then
            names+=(observer-amd64)
          fi
          for name in "${names[@]}"; do
            d=$(read_digest "artifacts/digest-$name.txt" "$name")
            arch=arm64
            if [ "$name" = observer-amd64 ]; then
              arch=amd64
            fi
            echo "ghcr.io/dannyota/aboutme-observer@$d linux/$arch" >>release/digests.txt
            jq -e '.spdxVersion == "SPDX-2.3"' "artifacts/aboutme-$name.spdx.json" >/dev/null
            cp "artifacts/aboutme-$name.spdx.json" release/
          done
          cat >release/notes.md <<EOF
          Images built from $TAG by the release-images workflow. \`digests.txt\`
          lists each image by digest with the platforms it serves: the
          multi-platform index, then one image per platform. Files with a
          platform suffix are copies of signed SPDX 2.3 SBOMs. The app files
          without a platform suffix are copies of the arm64 SBOMs for existing
          AWS transparency links.

          Verify an image's build provenance with the GitHub CLI:

          \`\`\`sh
          gh attestation verify \\
            oci://ghcr.io/dannyota/aboutme-server@sha256:<digest> \\
            --repo dannyota/aboutme \\
            --signer-workflow dannyota/aboutme/.github/workflows/release-images.yml \\
            --source-ref refs/tags/$TAG \\
            --deny-self-hosted-runners
          \`\`\`

          Add \`--predicate-type https://spdx.dev/Document/v2.3\` to verify its SBOM.
          EOF
      - name: Publish
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file release/notes.md \
            release/digests.txt release/aboutme-*.spdx.json
