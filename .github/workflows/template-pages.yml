name: Template pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-pages:
    name: Generate product page images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ignore local candidate roots
        run: |
          grep -qxF '/.dev/' .git/info/exclude ||
            printf '%s\n' '/.dev/' >> .git/info/exclude
      - name: Generate candidate product images
        env:
          TEMPLATE_PAGES_RUN_ID: pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: make web-template-pages
      - name: Upload validated product images
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-template-pages
          path: |
            .dev/web-template-pages/${{ github.sha }}/pages-${{ github.run_id }}-${{ github.run_attempt }}/candidate/*.png
            .dev/web-template-pages/${{ github.sha }}/pages-${{ github.run_id }}-${{ github.run_attempt }}/candidate/manifest.json
            .dev/web-template-pages/${{ github.sha }}/pages-${{ github.run_id }}-${{ github.run_attempt }}/candidate/source-metadata.txt
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
