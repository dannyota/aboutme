# Site-down alarm for production (docs/runbooks/production.md, "Alarms"). A
# failed scheduled run makes GitHub email the account that last changed the
# schedule. GitHub can delay scheduled runs by several minutes under load.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  readyz:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check https://aboutme.vn/readyz
        run: |
          # Three tries 20 seconds apart, so one dropped request does not page.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              https://aboutme.vn/readyz) || code=none
            if [ "$code" = 200 ]; then
              exit 0
            fi
            echo "attempt $attempt: /readyz answered $code"
            [ "$attempt" = 3 ] || sleep 20
          done
          echo "::error::aboutme.vn/readyz failed three times"
          exit 1
