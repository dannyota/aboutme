name: security-scan

# Scans default-branch dependencies and published release images on a schedule,
# so a vulnerability disclosed after a release still surfaces. This does not
# inventory deployed versions. GitHub notifies only the user who last
# edited the cron line when a scheduled run fails, and only if their Actions
# notifications are on; in a public repository it also disables the schedule
# after 60 days with no repository activity.
on:
  schedule:
    - cron: "17 3 * * 1" # Monday 03:17 UTC, off-peak
  workflow_dispatch:
    inputs:
      release_tag:
        description: "App release to scan (blank selects GitHub's latest published release)"
        type: string
        required: false
      observer_release_tag:
        description: "Observer release to scan (blank uses the selected app release)"
        type: string
        required: false

permissions:
  contents: read
  packages: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Install the pinned govulncheck (1.8.0)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: apps/server
        run: govulncheck ./...
        working-directory: apps/server
      - if: ${{ !cancelled() }}
        name: packages/schema/gen/go
        run: govulncheck ./...
        working-directory: packages/schema/gen/go
      - if: ${{ !cancelled() }}
        name: deploy/observer
        run: govulncheck ./...
        working-directory: deploy/observer
        env:
          GOWORK: "off"
      - if: ${{ !cancelled() }}
        name: deploy/caddy/production/build
        run: govulncheck ./...
        working-directory: deploy/caddy/production/build
        env:
          GOWORK: "off"
      - if: failure()
        run: echo "### govulncheck failed (reachable vulnerability or scan error)" >>"$GITHUB_STEP_SUMMARY"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: repository root
        run: bash scripts/npm-audit.sh .
      - if: ${{ !cancelled() }}
        name: apps/web
        run: bash scripts/npm-audit.sh apps/web
      - if: ${{ !cancelled() }}
        name: packages/schema
        run: bash scripts/npm-audit.sh packages/schema
      - if: ${{ !cancelled() }}
        name: deploy/dev-https-browser
        run: bash scripts/npm-audit.sh deploy/dev-https-browser
      - if: failure()
        run: echo "### npm audit found a high or critical advisory" >>"$GITHUB_STEP_SUMMARY"

  # Scans both platforms of server, web, caddy, and observer by published digest
  # with the same pinned Trivy install release-images.yml uses. Fails on fixable
  # HIGH or CRITICAL finding across every target; scripts/security-scan.sh
  # weekly-scan continues past a failing target so one run always reports
  # the complete picture.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: scripts/security-scan.sh install-trivy "$RUNNER_TEMP/trivy-bin"
      - name: Scan released images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          OBSERVER_RELEASE_TAG: ${{ inputs.observer_release_tag }}
        run: |
          scripts/security-scan.sh weekly-scan \
            "$RUNNER_TEMP/trivy-bin/trivy" "$RUNNER_TEMP/reports" \
            "$RELEASE_TAG" "$OBSERVER_RELEASE_TAG"
      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Published release image scan"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/reports/summary.txt" 2>/dev/null || echo "Scan did not produce a summary."
            echo '```'
            echo
            echo "Failed targets (findings, missing digests, or scan errors):"
            echo '```text'
            cat "$RUNNER_TEMP/reports/failed.txt" 2>/dev/null || echo "(none recorded)"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-image-scan-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn
          retention-days: 7
