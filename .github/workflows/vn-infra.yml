# Static checks for deploy/vn. This workflow runs without cloud credentials
# (docs/design/vietnam-production.md, "Infrastructure code and state"). ci.yml
# does not run shellcheck, so this workflow does for the host scripts.
name: VN infrastructure

on:
  push:
    paths:
      - "deploy/vn/**"
      - ".github/workflows/vn-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vn-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/vn
      - name: Validate the root
        run: |
          tofu -chdir=deploy/vn/prod init -backend=false -input=false >/dev/null
          tofu -chdir=deploy/vn/prod validate
      - name: Check shell scripts
        run: |
          shellcheck --version
          mapfile -t scripts < <(git ls-files 'deploy/vn/*.sh' 'deploy/vn/**/*.sh' | sort -u)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts under deploy/vn"
            exit 0
          fi
          for f in "${scripts[@]}"; do
            bash -n "$f"
            shellcheck -x -S warning "$f"
          done
      - name: Test deployment safety
        run: |
          for test in deploy/vn/tests/*-test.sh; do
            if [ "$test" = deploy/vn/tests/crowdsec-integration-test.sh ]; then
              continue
            fi
            "$test"
          done

  crowdsec-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned CrowdSec
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          gpg --dearmor --yes -o /tmp/crowdsec.gpg deploy/vn/host/keys/crowdsec.asc
          sudo install -m 0644 /tmp/crowdsec.gpg /etc/apt/keyrings/crowdsec.gpg
          echo "deb [signed-by=/etc/apt/keyrings/crowdsec.gpg] https://packagecloud.io/crowdsec/crowdsec/ubuntu noble main" | \
            sudo tee /etc/apt/sources.list.d/crowdsec.list >/dev/null
          sudo apt-get update -qq
          sudo bash -c '
            unset CROWDSEC_POLICY_RC_D CROWDSEC_SYSTEMCTL
            . deploy/vn/host/crowdsec-offline.sh
            crowdsec_install_offline apt-get install -y -qq crowdsec=1.8.1 sqlite3
          '
      - name: Disable disk swap
        # Retention refuses to run while attack records could reach a swap
        # device other than zram.
        run: |
          cat /proc/swaps
          sudo swapoff -a
          [ "$(wc -l </proc/swaps)" -eq 1 ]
      - name: Test pinned parser and scenarios
        run: |
          sudo systemctl unmask --runtime crowdsec.service
          sudo deploy/vn/tests/crowdsec-integration-test.sh
