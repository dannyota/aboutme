# Static checks for deploy/vn. This workflow runs without cloud credentials
# (docs/design/vietnam-production.md, "Infrastructure code and state"). ci.yml
# calls this workflow on every gate run, including shellcheck for host scripts.
name: VN infrastructure

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy/vn
      - name: Validate the root
        run: |
          tofu -chdir=deploy/vn/prod init -backend=false -input=false >/dev/null
          tofu -chdir=deploy/vn/prod validate
      - name: Test mocked infrastructure plans
        run: tofu -chdir=deploy/vn/prod test
      - name: Validate the DNS root
        run: |
          tofu -chdir=deploy/vn/dns init -backend=false -input=false >/dev/null
          tofu -chdir=deploy/vn/dns validate
      - name: Test mocked DNS plans
        run: tofu -chdir=deploy/vn/dns test
      - name: Check shell scripts
        run: |
          shellcheck --version
          mapfile -t scripts < <(git ls-files 'deploy/vn/*.sh' 'deploy/vn/**/*.sh' | sort -u)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts under deploy/vn"
            exit 0
          fi
          for f in "${scripts[@]}"; do
            bash -n "$f"
            shellcheck -x -S warning "$f"
          done
      - name: Test deployment safety
        run: |
          for test in deploy/vn/tests/*-test.sh; do
            if [ "$test" = deploy/vn/tests/crowdsec-integration-test.sh ] || \
               [ "$test" = deploy/vn/tests/crowdsec-db-test.sh ] || \
               [ "$test" = deploy/vn/tests/crowdsec-privacy-notice-test.sh ] || \
               [ "$test" = deploy/vn/tests/crowdsec-config-test.sh ] || \
               [ "$test" = deploy/vn/tests/crowdsec-retention-test.sh ] || \
               [ "$test" = deploy/vn/tests/crowdsec-lease-test.sh ] || \
               [ "$test" = deploy/vn/tests/crowdsec-vacuum-test.sh ] || \
               [ "$test" = deploy/vn/tests/watch-test.sh ]; then
              continue
            fi
            "$test"
          done
      - name: Test PostgreSQL retention contracts
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for test in crowdsec-config crowdsec-retention crowdsec-lease crowdsec-vacuum watch; do
            bash "deploy/vn/tests/$test-test.sh" || failed=1
          done
          exit "$failed"

  crowdsec-privacy-notice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test notice guest filesystem protocol
        run: sudo unshare --mount --propagation private bash deploy/vn/tests/crowdsec-privacy-notice-test.sh

  crowdsec-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect signed packages and prove suppressed engine setup
        run: |
          sudo env GITHUB_ACTIONS=true bash deploy/vn/tests/crowdsec-offline-test.sh packages
      - name: Build the pinned production Caddy binary
        run: |
          sudo apt-get install -y -qq podman >/dev/null
          sudo podman build --target caddy-build -f deploy/caddy/production/Dockerfile -t retention-caddy .
          container=$(sudo podman create --entrypoint /bin/true retention-caddy)
          trap 'sudo podman rm "$container" >/dev/null' EXIT
          sudo podman cp "$container:/out/caddy" "$RUNNER_TEMP/caddy"
      - name: Disable disk swap
        # Retention refuses to run while attack records could reach a swap
        # device other than zram.
        run: |
          cat /proc/swaps
          sudo swapoff -a
          [ "$(wc -l </proc/swaps)" -eq 1 ]
      - name: Require PostgreSQL retention configuration
        run: bash deploy/vn/tests/crowdsec-config-test.sh
      - name: Test PostgreSQL parser, retention and real consumer rebuild
        run: |
          sudo env GITHUB_ACTIONS=true CROWDSEC_TEST_CADDY_BINARY="$RUNNER_TEMP/caddy" \
            unshare --mount --propagation private bash deploy/vn/tests/crowdsec-integration-test.sh

  crowdsec-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect signed packages and prove suppressed engine setup
        run: |
          sudo env GITHUB_ACTIONS=true bash deploy/vn/tests/crowdsec-offline-test.sh packages
      - name: Derive pinned catalog metadata
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true unshare --mount --propagation private \
            bash deploy/vn/tests/crowdsec-db-test.sh derive | \
            tee "$RUNNER_TEMP/crowdsec-catalog-output.txt"
          sed -n '/^BEGIN crowdsec-v1.8.1-postgresql18-catalog$/,/^END crowdsec-v1.8.1-postgresql18-catalog$/p' \
            "$RUNNER_TEMP/crowdsec-catalog-output.txt" | sed '1d;$d' \
            >"$RUNNER_TEMP/crowdsec-schema-v1.8.1.tsv"
          test -s "$RUNNER_TEMP/crowdsec-schema-v1.8.1.tsv"
      - name: Upload catalog metadata for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crowdsec-postgresql-catalog
          path: ${{ runner.temp }}/crowdsec-schema-v1.8.1.tsv
          if-no-files-found: error
          retention-days: 7
      - name: Test inactive PostgreSQL gate
        run: |
          sudo env GITHUB_ACTIONS=true unshare --mount --propagation private \
            bash deploy/vn/tests/crowdsec-db-test.sh integration
      - name: Test PostgreSQL retention and lease boundaries
        run: |
          sudo swapoff -a
          sudo env GITHUB_ACTIONS=true unshare --mount --propagation private \
            bash deploy/vn/tests/crowdsec-retention-test.sh postgresql
