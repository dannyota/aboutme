name: Set up the trusted-browser proof harness
description: >-
  Prepares a runner for the dev-https browser proofs: Node, Go, Caddy, the
  pinned host Chromium, the runner-local database, the native HTTPS harness,
  and the pinned browser image. Container image pulls and the web install
  run in the background so they overlap the toolchain setup.
outputs:
  go-cache-hit:
    description: The cache-hit output of setup-go.
    value: ${{ steps.go.outputs.cache-hit }}
  go-cache-key:
    description: The cache-key output of setup-go.
    value: ${{ steps.go.outputs.cache-key }}
  go-toolchain-hit:
    description: The toolchain-hit output of setup-go.
    value: ${{ steps.go.outputs.toolchain-hit }}
runs:
  using: composite
  steps:
    # Pulls the database image, then the pinned Playwright base image (the
    # FROM reference in deploy/dev-https-browser/Dockerfile), in the
    # background. make test-db-up and dev-https-browser-image then find them
    # local instead of pulling on the critical path.
    - name: Start pulling container images in the background
      shell: bash
      run: |
        base=$(awk '/^FROM /{print $2; exit}' deploy/dev-https-browser/Dockerfile)
        db=$(grep -o 'docker.io/library/postgres:[^;[:space:]]*' Makefile | head -n 1)
        [ -n "$base" ] && [ -n "$db" ] || { echo 'cannot find the pinned images' >&2; exit 1; }
        bash scripts/ci-background.sh start image-pulls \
          bash -c 'podman pull "$0" && podman pull "$1"' "$db" "$base"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: apps/web/package-lock.json
    # Cached on apps/web/package-lock.json: `npx playwright install` is a
    # no-op on a hit and still verifies the pinned browser is present.
    - name: Restore the Playwright browser cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
    # The harness preflight requires the pinned Chromium on the host. The
    # install overlaps the Go and Caddy setup below.
    - name: Start installing web dependencies and the pinned Chromium
      shell: bash
      run: |
        bash scripts/ci-background.sh start web-deps \
          bash -c 'cd apps/web && npm ci && npx playwright install chromium'
    - id: go
      uses: ./.github/actions/setup-go
    - uses: ./.github/actions/install-caddy
    - name: Wait for web dependencies and the pinned Chromium
      shell: bash
      run: bash scripts/ci-background.sh wait web-deps
    # Ubuntu 24.04 blocks unprivileged user namespaces for any binary without
    # an AppArmor profile (kernel.apparmor_restrict_unprivileged_userns), so
    # the pinned Chromium dies with "No usable sandbox" and every PDF and
    # share-image render returns 503. This profile grants the namespace right
    # to that one binary so the renderer keeps its sandbox, as Chromium's
    # docs/security/apparmor-userns-restrictions.md recommends.
    - name: Let the pinned Chromium create its sandbox namespaces
      shell: bash
      run: |
        chromium=$(node scripts/chromium-path.mjs)
        printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile aboutme-ci-chromium %s flags=(unconfined) {\n  userns,\n}\n' "$chromium" |
          sudo tee /etc/apparmor.d/aboutme-ci-chromium >/dev/null
        sudo apparmor_parser -r /etc/apparmor.d/aboutme-ci-chromium
    # dev-https starts the one shared database container itself; start it
    # first to set up its roles.
    - shell: bash
      run: make test-db-up
    - name: Initialize database roles
      shell: bash
      env:
        DATABASE_URL: postgres://aboutme:aboutme_dev@127.0.0.1:20432/aboutme_dev?sslmode=disable
      run: make db-setup
    - shell: bash
      run: make dev-https
    - name: Wait for the background image pulls
      shell: bash
      run: bash scripts/ci-background.sh wait image-pulls
    - shell: bash
      run: make dev-https-browser-image
