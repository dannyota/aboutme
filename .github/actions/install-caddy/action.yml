name: Install Caddy
description: >-
  Installs the pinned Caddy release binary and puts it on PATH. A
  go-installed caddy reports version "unknown", which the dev-https tool
  check rejects, and the release binary is faster than compiling Caddy.
runs:
  using: composite
  steps:
    - id: archive
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/caddy.tar.gz
        key: caddy-2.11.9-linux-amd64-sha512-0e85544340290a16ce4bfb76fe7d65e9de1bf3a6e67f5ccfff30b30d27ea4c73e078077b7bf3e58ae60b6b12e44327705287059c775bca5782e8ee85ea7edd75
    - name: Select Caddy archive
      shell: bash
      env:
        CACHE_HIT: ${{ steps.archive.outputs.cache-hit }}
      run: |
        if [ -f "$RUNNER_TEMP/ci-tools/caddy_2.11.9_linux_amd64.tar.gz" ]; then
          cp "$RUNNER_TEMP/ci-tools/caddy_2.11.9_linux_amd64.tar.gz" "$RUNNER_TEMP/caddy.tar.gz"
        elif [ "$CACHE_HIT" != true ]; then
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            -o "$RUNNER_TEMP/caddy.tar.gz" https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz
        fi
    - name: Verify and install Caddy
      shell: bash
      run: |
        echo "0e85544340290a16ce4bfb76fe7d65e9de1bf3a6e67f5ccfff30b30d27ea4c73e078077b7bf3e58ae60b6b12e44327705287059c775bca5782e8ee85ea7edd75  $RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
        mkdir -p "$RUNNER_TEMP/caddy"
        tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
        echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
    - if: ${{ github.ref == 'refs/heads/main' && steps.archive.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/caddy.tar.gz
        key: ${{ steps.archive.outputs.cache-primary-key }}
